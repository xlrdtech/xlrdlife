  // fixed; the surrounding world did not, so an uploaded photo landed inside the
  // glass and nowhere else. world() is the only function allowed to decide what
  // place this is. ⛔ Never call dusk() from a render path again — it is the
  // DEFAULT, reachable only through world()'s else branch.
  vec3 col = world(rd);
  // the light the orb throws into its own scene. Tinted by the scene itself, so a
  // warm upload glows warm and a cold one glows cold - never a fixed violet.
  col += col * (0.22 + amp*0.75) * exp(-rad*2.9) * 0.55;

  // how far apart is it right now? sound and touch both pull it open.
  float held  = touchHeld > 0.5 ? smoothstep(0.0, 0.30, touchAge) : 0.0;
  float letgo = touchHeld > 0.5 ? 0.0 : exp(-relAge * 2.0);
  float sound = smoothstep(0.06, 0.55, amp);   // his voice pulls it apart sooner          // his voice, above room noise
  float apart = clamp(max(max(held, letgo), sound), 0.0, 1.0);

  // analytic hit, then refine against the displaced surface. At apart == 0 the
  // displacement is 0 and this is exactly the old constant-cost intersection.
  // ⭐⭐⭐ IT WAS CONTAINED BY MY OWN CODE — qi 2026-08-23 08:49:
  //   "outwardly, right now, it's CONTAINED. It shouldn't be contained like that."
  // A real bug, not a taste. I tested the ray against the BASE sphere and only
  // refined from that hit — so every ray that missed the base radius was thrown
  // away before refinement ran, and any material the displacement pushed OUTWARD
  // could never be seen. The silhouette could dent inward but could never grow
  // past the original ball. Containment was structural, built into the algorithm.
  // ⭐ FIX: test against a BOUNDING hull big enough to hold the worst-case
  // displacement, then walk inward to the real surface. Outward lobes now exist.
  // ⛔ BOUND must always exceed MAXD's largest value or outward material silently
  //    vanishes again — which is exactly the bug this replaces.
  // "I keep saying I need this thing to be MORE AMORPHIC" (08:45): 0.52, plus a
  // permanent 0.055 so it is never a perfect ball even at rest.
  float MAXD  = 0.52 * apart + 0.055;
  float BOUND = r * (1.0 + MAXD * 1.40);

  float th = hitSphere(ro, rd, BOUND);
  if(th > 0.0){
    for(int i = 0; i < 5; i++){          // walk in from the hull to the surface
      vec3 pp = normalize(ro + rd*th);
      float rr = r * (1.0 + lobes(pp, t) * MAXD);
      float t2 = hitSphere(ro, rd, rr);
      if(t2 <= 0.0){ th = -1.0; break; } // a genuine gap - the ray passes through
      th = t2;
    }
  }
  bool hit = th > 0.0;
  vec3 q = ro + rd*max(th, 0.0);

  if(hit){
    vec3 n = nrm(q, r);
    // tilt the normal along the displacement gradient so the light agrees with the
    // broken shape. Finite differences on the lobe field, cheap and stable.
    {
      vec3 pn0 = normalize(q);
      float e = 0.035;
      float l0 = lobes(pn0, t);
      vec3 gradL = vec3(
        lobes(normalize(pn0 + vec3(e,0.0,0.0)), t) - l0,
        lobes(normalize(pn0 + vec3(0.0,e,0.0)), t) - l0,
        lobes(normalize(pn0 + vec3(0.0,0.0,e)), t) - l0);
      n = normalize(n - gradL * (1.4 * apart + 0.30));
    }
    vec3 v = normalize(ro - q);

    // ⭐⭐⭐ A SPLASH WITH TIME FROZEN — qi 2026-08-23 08:01-08:05, verbatim:
    //   "the orb needs to be reactive to touch as well, not just the voice"
    //   "but in a LIQUID manner, not the normal pulse shit you did last time"
    //   "when I touch the orb I want it to react like liquid"
    //   "maybe it should even splash BUT FREEZE TIME, and when I go it REFORMS itself"
    // That last line is the whole mechanic and it is not a decay timer:
    //   finger DOWN  -> a crater opens under it with a crown thrown up around the
    //                   rim, and then NOTHING MOVES. The splash is caught mid-air.
    //   finger UP    -> only then does time resume: the crater relaxes and rings
    //                   run outward, settling. It reforms.
    // ⛔ A pulse (scale the whole body, decay on a clock) is what he rejected by
    // name. Never reintroduce one. And the deformation is GEODESIC — measured as
    // an angle across the sphere from the contact point, not a screen distance —
    // so the splash sits where his finger actually landed even when he has turned
    // the world around.

    // where on the sphere did he touch? cast that pixel's ray and intersect.
    vec3 crd  = normalize(xAx*touchUV.x + yAx*touchUV.y + zAx*(1.35*zoomF));
    float cth = hitSphere(ro, crd, r);
    vec3 cdir = cth > 0.0 ? normalize(ro + crd*cth) : normalize(-out3);
    vec3 pn   = normalize(q);
    float ang = acos(clamp(dot(pn, cdir), -1.0, 1.0));      // geodesic distance

    // a tangent frame at the contact, so the crown can have lobes around its rim
    vec3 tx = normalize(cross(cdir, vec3(0.0, 1.0, 0.0)) + vec3(1e-4));
    vec3 ty = cross(cdir, tx);
    float azc = atan(dot(pn, ty), dot(pn, tx));

    // the crater, and the crown of fluid thrown up around it
    float grab   = smoothstep(0.0, 0.22, touchAge);          // it takes a moment to open
    float crater = -exp(-ang*ang*24.0) * 0.90;
    float lobes  = 0.62 + 0.38*cos(azc*7.0 + 0.5);           // a real splash is not round
    float crown  =  exp(-pow(ang - 0.40, 2.0)*26.0) * 0.60 * lobes;
    float heldD  = (crater + crown) * grab;

    float disp;
    if(touchHeld > 0.5){
      disp = heldD;                    // TIME FROZEN. the splash simply stands there.
    } else {
      // he let go: the crater flows back, and rings leave it and settle
      float relax = exp(-relAge * 2.5);
      float ring  = sin(ang*12.0 - relAge*6.0)
                  * exp(-abs(ang - relAge*1.45) * 3.0)
                  * exp(-relAge * 1.5) * 0.45;
      disp = heldD*relax + ring;
    }

    // apply it as a real surface tilt: the tangent pointing AWAY from the contact.
    // Tilting the normal is what makes the mirrored world bend through the dent,
    // which is the cue the eye reads as liquid on a reflective body.
    vec3 tang = normalize(pn - cdir*dot(pn, cdir) + vec3(1e-5));
    n = normalize(n + tang * disp * 1.05 + pn * disp * 0.22);

    // ⛔ 06:16, qi: it read as a MIRROR BALL — a decoration, not something alive.
    // A gazing ball is static: its reflection never moves, so the eye files it
    // as an ornament. Life comes from the reflection SLIDING. So the environment
    // is slowly rotated under the sphere, and voice spins it faster — the orb
    // looks like it is turning toward you when you speak.
    float spin = t*0.085 + amp*2.2;
    float cs = cos(spin), sn = sin(spin);
    vec3 refl0 = reflect(-v, n);                 // UNSPUN: where the eye truly looks
    // View-frame copy for the camera term. At the orb centre refl0 == out3 (straight back
    // at the viewer) and zAx == -out3, so view-frame z is -1, fwd is +1, and his face lands
    // dead centre and STAYS there. The environment below still spins — that is deliberate.
    gCamRefl = vec3(dot(refl0, xAx), dot(refl0, yAx), dot(refl0, zAx));
    vec3 refl = vec3(cs*refl0.x + sn*refl0.z, refl0.y, -sn*refl0.x + cs*refl0.z);
    vec3 mir  = env(refl);

    // ⭐⭐ METAL, NOT GLASS — qi 2026-08-23 08:00, verbatim:
    //   "my reflection in the orb is too see-through"
    //   "it needs to be more of a metallic reflective shine so it's more realistic"
    //   "it doesn't look like a realistic reflection of me"
    // He is describing the physics exactly. DIELECTRIC glass reflects only ~4%
    // head-on and transmits the rest, so anything mirrored in it is washed out by
    // whatever lies behind — which is why his face read as a ghost. A CONDUCTOR
    // reflects 70-95% at EVERY angle and transmits nothing. So the refracted ray
    // is GONE, not reduced: there is no behind any more.
    // ⛔ The earlier "kinda transparent" (06:24) is SUPERSEDED by this. Do not
    // reintroduce refract() here — transparency is what he came back and rejected.
    float ct = max(dot(n,v), 0.0);

    // Conductor fresnel: high base reflectance, tinted, rising to white at grazing.
    // A metal's reflectance is COLOURED at normal incidence and neutral at the
    // edge — that colour shift is most of what reads as "real metal".
    // ⭐⭐⭐ THE ORB IMPOSES NO COLOUR — qi 2026-08-23 08:11, verbatim:
    //   "it definitely has like an all jet black background... teal and purple and
    //    stuff INSTEAD OF the colours that [I uploaded]"
    // Four separate things in this shader were painting his environment over with
    // a palette he never chose: a violet F0, a rainbow iridescence cycle (which
    // is precisely where the TEAL came from), an amethyst voice rim, and a purple
    // scene glow. All four are gone. This is the same law he has now stated three
    // ways - colour agnostic, glass not grey, blend into whatever I upload: THE
    // MIRROR CONTRIBUTES NO PIGMENT. Every colour on screen comes from his image.
    // ⛔ Never reintroduce a hardcoded hue into the orb's material or its lights.
    vec3 F0 = vec3(0.90);                          // neutral, achromatic
    vec3 fres = F0 + (vec3(1.0) - F0) * pow(1.0 - ct, 5.0);

    // with the body this transparent the reflection reads against whatever is
    // behind it, so keep the mirror but let the page carry the low end
    // ⭐⭐⭐ THE BEND IS HOW YOU KNOW IT IS THERE — qi 2026-08-23 08:56:
    //   "you can see everything that you're looking at BEHIND it, but you can still
    //    see it… the BENT-like reflection on it, so you know it's there."
    // That is a LENS, not a mirror, and it is the piece I removed at 08:00 when he
    // said the body was too see-through. I over-corrected: I deleted refraction
    // entirely, which took the bend with it. But the bend was never the problem —
    // the problem was that refraction at full weight WASHED HIM OUT.
    // ⭐ The distinction that makes both true at once: bend the WORLD BEHIND IT, do
    // not make the body transparent to it. A small refracted world sample warps what
    // is behind the glass so the shape announces itself, while the reflection stays
    // fully intact on top. See through it, and still see it.
    // ⭐⭐⭐ A LIQUID MAGNIFYING GLASS — qi 2026-08-23 09:10, his own analogy and the
    // clearest brief of the session:
    //   "like a LIQUID MAGNIFYING GLASS or some shit, but NOT TOO MAGNIFYING, just a
    //    layer over it so you can see what's there… it kind of LIQUEFIES whatever is
    //    behind it."
    // Three properties, and I only had the first:
    //   1  it bends what is behind          - had it
    //   2  it MAGNIFIES, gently             - missing, and this is the "glass" cue.
    //      A real lens makes what is behind slightly LARGER; that is how the eye
    //      knows it is looking through something solid rather than at a hole.
    //   3  the distortion MOVES             - missing, and this is the "liquid" cue.
    //      Static distortion reads as glass; drifting distortion reads as liquid.
    // ⛔ "not too magnifying" is a real constraint - overdo it and it becomes a
    //    fisheye novelty instead of a presence he can work behind.
    vec3 straight = rd;                                // what he'd see with no orb
    vec3 bendDir = refract(-v, n, 1.0/1.22);
    if(length(bendDir) < 0.001) bendDir = reflect(-v, n);

    // pull most of the way back to straight-through, then over-converge slightly.
    // over-converging past 'straight' is what produces magnification.
    bendDir = normalize(mix(bendDir, straight, 0.88));
    bendDir = normalize(straight + (bendDir - straight) * 1.05);

    // and let it LIQUEFY: a slow drifting warp, stronger toward the rim where a real
    // liquid surface is thickest, and it breathes with his voice.
    vec3 pn2 = normalize(q);
    float liq = sin(pn2.x*5.1 + t*0.62) * sin(pn2.y*4.4 - t*0.51)
              + 0.5*sin(pn2.z*7.9 + t*0.83);
    bendDir = normalize(bendDir + vec3(liq, liq*0.7, -liq*0.5)
                        * (0.035 + amp*0.05) * (0.35 + 0.65*(1.0 - ct)));

    vec3 behind = world(bendDir);
    // ⭐ "I'm still not seeing what's behind it" (qi 08:59). I had the dead centre at
    // 52% mirror, which is half a mirror — too much to look through. Real glass is
    // mostly TRANSMISSION face-on and mostly REFLECTION at the grazing rim, so the
    // weighting inverts: you look THROUGH the middle and the rim carries the shine.
    // ⛔ Do not raise the centre's mirror share again; looking through is the point.
    // ⭐⭐⭐ LOOKING THROUGH IT MUST NOT DARKEN IT — qi 2026-08-23 09:07:
    //   "when I see through it, it SHOULDN'T BE DARKER in order for it [to be
    //    see-through]… it looked like it got darker."
    // He caught a physics error. I was multiplying the WHOLE mix — reflection AND
    // transmission together - by fres. But fres is REFLECTANCE: it belongs only on
    // ^^^^ NO BACKTICKS. A markdown backtick in a GLSL comment CLOSES the JS
    // template literal holding the shader, and the page dies with a parse error
    // ('Unexpected identifier'), not a shader error. THIRD time today.
    // the reflected term. What passes THROUGH is transmittance, which is (1 - fres).
    // Multiplying the see-through part by the reflectance dims exactly the thing he
    // is trying to look through, and the dimming gets worse the clearer the glass is.
    // ⭐ Energy where it belongs: reflection * fres + transmission * (1 - fres). Now
    // the sum stays at 1.0, so the middle is as bright as the world behind it and
    // "see-through" costs him no light at all.
    // ⛔ Never apply fres to the transmitted term again.
    // ⭐ "it looks like we lost most of the reflection… the reflex magnifying glass"
    // (qi 09:11). The energy fix traded too far toward transparent: I had the centre
    // at only 0.16 mirror. ⭐ The KEY is that this is now safe to raise — with
    // reflection*fres + transmission*(1-fres) the two sides sum to 1.0, so adding
    // mirror no longer STEALS light from what is behind. Before the energy fix,
    // raising this would have darkened the see-through; now it cannot.
    // 🔴 CORRECTION, qi 09:49: "we should be WARPING the environment and only
    // LIGHTING UP when it detects voice" + "its still a fucking black blob on the
    // screen." The note above this line said the lever was alpha, NOT mirShare.
    // That note was WRONG and it is why the blob survived four attempts.
    // ⭐ THE BLOB WAS NEVER A SHADOW AND NEVER AN ALPHA PROBLEM. mirShare 0.38 at
    // the centre mixes in 38% MIRROR, and what the orb mirrors is his dark sky and
    // dark ground. A dark reflection subtracted from the transmission IS the blob.
    // No alpha value can fix it, because the pixel is genuinely dark before alpha
    // ever runs - which is exactly why lowering opacity only ever made it fainter.
    // ⭐ SO THE MIRROR ITSELF IS THE VOICE LEVER. At rest: 0.04 centre = essentially
    // pure transmission, so the only thing visible is the LENS WARP. On voice: the
    // mirror climbs and it lights up. His spec, stated literally.
    // ⛔ amp, not voice: 'voice' is declared ~50 lines BELOW this point, so naming it
    // here is a use-before-declaration the compiler rejects. amp is a uniform and is
    // in scope everywhere.
    float vGate = smoothstep(0.02, 0.42, amp);
    float mirShare = clamp((0.15 + 0.40*vGate) + (0.29 + 0.45*vGate)*(1.0 - ct), 0.0, 1.0);
    vec3 reflPart  = mir    * fres * mirShare;
    vec3 tranPart  = behind * (vec3(1.0) - fres * mirShare);
    vec3 c = reflPart + tranPart;

    // anisotropic sheen: a brushed-metal band that slides as the orb turns.
    // Metal is not a perfect mirror - this is the "shine over" he asked for.
    float sheen = pow(max(dot(reflect(-v,n), normalize(vec3(-0.40,0.80,0.45))), 0.0), 10.0);
    // the sheen borrows the ENVIRONMENT's own colour rather than inventing one
    c += mir * sheen * 0.20;

    // the rim brightens, achromatically. The old rainbow cos() cycle here is what
    // produced the teal he called out - a hue the environment never contained.
    float ir = pow(1.0 - ct, 3.4);
    c += mir * ir * 0.22;

    float f = pow(1.0 - ct, 4.0);

    // the "it heard you" rim. Still voice-driven, but it glows in the
    // environment's OWN colour, sampled from what the rim is reflecting.
    float rim = pow(1.0 - max(dot(n,v),0.0), 2.6);
    c += mir * rim * (0.18 + amp*2.1);

    // a single specular highlight so the form reads as solid
    vec3 L = normalize(vec3(-0.45, 0.75, 0.62));
    // ⛔ NEVER a white specular. qi 09:03: "still seeing this damn light spot."
    // A vec3(1.0) highlight is a white blowout no matter how the body is scaled
    // afterwards, because the clamp is proportional. Tint it to what the orb is
    // actually reflecting, keep it broad and low, and it reads as sheen not a lamp.
    c += mir * pow(max(dot(n, normalize(L+v)),0.0), 96.0) * 0.30;
    // a second, wider lobe so the highlight has falloff instead of a hard dot
    c += mir * pow(max(dot(n, normalize(L+v)),0.0), 18.0) * 0.14;

    // ⭐⭐ IT WAS BRIGHTER THAN ITS OWN WORLD — qi 2026-08-23 08:56:
    //   "the reason the avatar is standing out more than it's supposed to is because
    //    it seems to be BRIGHTER than the environment."
    // Physically impossible, and my fault. A mirror's reflectance is BELOW 1 — it
    // always returns less light than it receives. But I was stacking an anisotropic
    // sheen, a voice rim and a specular ON TOP of the reflection, so the orb emitted
    // more than the world it reflects. That is why it pops off the background instead
    // of belonging to it. ⛔ The orb's total output must never exceed its environment.
    float envHere = dot(world(rd), vec3(0.34));       // the world directly behind it
    float orbHere = dot(c, vec3(0.34));
    // ⭐⭐⭐ NOT THERE UNTIL YOU SPEAK — qi 2026-08-23 08:56, the whole spec in a line:
    //   "it doesn't seem to be EQUAL to the environment, so it almost feels like
    //    it's NOT THERE UNTIL YOU SPEAK."
    //   "it's supposed to be invisibility… an avatar that can be directly in the
    //    screen but is STILL NOT BLOCKING THE SCREEN."
    // So the resting state is EQUAL — not a hair above, exactly level with the world
    // behind it, which is what makes a thing disappear. Presence is earned by VOICE:
    // brightness and opacity both climb only while he is talking, and settle back to
    // invisible when he stops. ⛔ Never give it resting prominence again.
    float voice = smoothstep(0.02, 0.42, amp);   // triggers sooner, saturates sooner          // 0 silent, 1 speaking
    // 🔴🔴 THE BLACK BLOB WAS THIS ONE CLAMP — qi 09:49: "its still a fucking black
    // blob on the screen", after four failed attempts on alpha and mirShare.
    // The upper bound was 1.0, so this equalizer could only ever scale the orb DOWN.
    // When the orb is DARKER than the world behind it — which it always is, because
    // the refracted sample bends down into the dark ground — the ratio wants to be
    // ABOVE 1.0 and got clamped away, so nothing corrected it. The comment directly
    // above says "the resting state is EQUAL"; the code was structurally incapable of
    // reaching equal, because equal needs to brighten as well as dim.
    // ⭐ EQUAL IS A TWO-WAY MATCH. Let it lift a too-dark orb up to its environment,
    // not just pull a too-bright one down. At rest the target IS envHere, so the body
    // lands at the same luminance as the world behind it = genuinely invisible, while
    // the refraction PATTERN survives the scaling, which is the warp he asked for:
    // "we should be warping the environment and only lighting up when it detects
    // voice." (qi 09:49) Both halves of that sentence come from this line.
    // ⛔ Never cap this at 1.0 again. A one-way equalizer is a darkener.
    c *= clamp((envHere * (1.0 + voice*1.9)) / max(orbHere, 0.004), 0.35, 14.0);
    // 🔴 THE WHITE SPOT IS WHAT THE LINE ABOVE COULD NOT FLATTEN.
    // It levels every orb pixel to envHere EXCEPT where the ratio saturates. On the
    // 0.35 floor a pixel already ~2.9x brighter than the world behind it KEEPS its
    // excess while everything around it is levelled, so it becomes the only structure
    // left on the surface and reads as a lamp instead of as part of an image.
    //   why WHITE     - one SCALAR gain on r,g,b, and col/(col+0.85) below compresses
    //                   all three identically, so the survivor desaturates
    //   why FEATHERED - orbHere is a smooth field, so the boundary is a gradient, not
    //                   an edge. That is the "feathered brush in Photoshop" edge.
    //   why ON HIM    - the brightest thing on the orb IS his camera frame, so the
    //                   white spot and the "hole" are ONE defect, not two.
    // Not the specular: both lobes are tinted by mir, capped 0.30/0.14, and keyed to an
    // UPPER-LEFT light, while the blob he screenshotted sits below-left.
    // ⛔ No clamp VALUE fixes this. ANY bound leaves a survivor sitting AT the bound.
    // ⭐ Roll the top off against the world's own level instead - the same Reinhard
    //    shoulder already used on his camera frame. Below the ceiling the factor is
    //    EXACTLY 1.0 (no-op); above it everything compresses toward the environment
    //    asymptotically, so the orb can never out-shine the place it reflects.
    float ceilL = max(envHere * (1.0 + voice*1.9) * 1.35, 0.004);
    float cLum  = dot(c, vec3(0.299, 0.587, 0.114));
    c *= (cLum / (1.0 + max(cLum - ceilL, 0.0) / ceilL)) / max(cLum, 0.0015);
    // ⭐⭐⭐⭐ A CONSTRUCTION, NOT A CORRECTION. Four attempts failed here — mirShare,
    // the clamp ceiling, alpha, and a debug read that never fired — because every one
    // of them tried to CORRECT a dark body back toward its surroundings. The reliable
    // move is to build the resting state OUT OF the surroundings, so it cannot be dark:
    // at rest the pixel IS world(rd), the exact colour the screen would show with no
    // orb there at all. Invisible by definition, no equalizer required.
    // ⭐ presence is the whole spec in one scalar — qi 09:49: "we should be warping the
    // environment and ONLY LIGHTING UP when it detects voice." 0.10 at rest keeps a
    // whisper of the lens warp visible; voice takes it to the full mirror.
    // ⛔ Never make the resting body a formula that COULD land dark. Make it the
    // background, plus a fraction.
    // 🔴 THE IDLE BLOB WAS A TYPO'D CONSTANT, not a missing feature. The comment
    //    four lines up specifies "0.10 at rest keeps a whisper of the lens warp
    //    visible; voice takes it to the full mirror." The code shipped 0.34 —
    //    3.4x the documented intent — so 34% of the orb's colour was painted over
    //    the world at all times. That is the shadow qi reported at 09:17, 09:49,
    //    and again at 17:08 ("its not fixed I'm not satisfied").
    //    Reasoning was already correct and written down; only the number was wrong.
    // ⛔ Never raise this floor. 0.10 is the whisper; 0 would kill the warp too,
    //    and the warp IS the spec — "invisible yet visible", "like a mirage",
    //    "warping the environment and only lighting up when it detects voice."
    float presence = 0.10 + 0.90*voice;
    c = mix(world(rd), c, presence);
    // chrome contrast: pivot on the orb's own mean so the MEAN is preserved
    // 🔴 STALE PIVOT - provable without a camera. orbHere is sampled at the TOP of this
    // block, then c is rescaled by up to 14x by the equalizer and mixed with world(rd)
    // by presence BEFORE this line reads it. The comment below claims the mean is
    // preserved; two transforms out of date it cannot be. orbHere runs BELOW the
    // post-equalizer value (that is the entire reason the equalizer exists), so the
    // expansion collapses to roughly 1.28*c - a net brightness LIFT applied hardest
    // exactly where the pixel is already brightest. Second half of the white spot.
    // ⛔ Never pivot on a luminance sampled before a rescale.
    float pivot = max(dot(c, vec3(0.34)), 0.004);
    c = max(vec3(0.0), vec3(pivot) + (c - vec3(pivot)) * (1.28 + 0.42*voice));
    col = c;
    // ⭐⭐⭐ THE BODY ITSELF IS SEE-THROUGH — qi 2026-08-23 08:46-08:47:
    //   "the sphere is TOO PROMINENT… I need to be able to see DIRECTLY THROUGH it.
    //    It does need to reflect, but I need to be able to see through it."
    //   "anything that is overlay is supposed to be able to go on any screen, and no
    //    matter where it is on the screen you can still see right through it SO IT
    //    DOESN'T INTERFERE WITH ANY WORK."
    // That last clause is the whole spec and it is a product requirement, not a
    // look: this thing lives on top of what he is doing, so it must never cost him
    // a single pixel of legibility. I had the body at 0.94 alpha — effectively
    // opaque, effectively in the way.
    // ⭐ Real glass is inverted from what I built: it is MOST transparent looking
    // straight through the middle and most visible at the grazing rim, because
    // fresnel reflectance climbs as the surface turns away. So the centre opens up
    // and the rim holds the form. He can read straight through the middle of it.
    // ⛔ Never raise the centre alpha back up. Prominence is the defect.
    // opacity follows the same rule: nearly gone at rest, present when he speaks.
    // The rim always carries a little more than the centre, which is how glass reads.
    // ⭐⭐ VOICE CHANGES BRIGHTNESS, NEVER OPACITY — qi 2026-08-23 09:12:
    //   "now I see what you were trying to do about having it light up. That's cool,
    //    BUT NO, you gotta be able to SEE RIGHT THROUGH."
    // I had voice pushing the centre alpha to ~0.52 - half solid the moment he speaks,
    // which is exactly when he most needs to keep reading. Presence has to be carried
    // on the BRIGHTNESS/reflection axis (which it already is, envHere * (1+voice)),
    // and opacity must stay low at all times. ⛔ Never let voice raise alpha much.
    // Centre tops out near 0.15 even mid-sentence; the rim carries the form.
    // ⭐ "it's still not ALL THE WAY see-through BEFORE you speak" (qi 09:15).
    // Resting centre goes 0.07 -> 0.03: effectively a ghost until he talks. And note
    // WHICH lever this is: alpha, not mirShare. Lowering mirShare would cost him the
    // reflection he just told me he'd lost (09:11); lowering ALPHA costs nothing but
    // presence. ⭐ Two different knobs for two different complaints - never trade one
    // for the other.
    // ⭐⭐⭐ IT WAS A SHADOW BECAUSE ALPHA CANNOT FIX A DARK COLOUR — qi 09:17:
    //   "it's still like a shadow, it's darkened, so darkening won't make it able for
    //    somebody to READ it… if I'm not speaking then it's dark, that's still
    //    BLOCKING it. It shouldn't be a shadow. IT SHOULD BE GLASS."
    // Every alpha value I tried failed for the same reason: the orb's COLOUR is dark
    // (it reflects a dark world), so compositing it at ANY opacity lays dark pixels
    // over his page. 0.30 was a shadow; 0.03 was a fainter shadow. There is no
    // number that makes a dark colour not darken.
    // ⭐ THE FIX IS NOT A NUMBER, IT IS THE FORMULA: derive alpha from BRIGHTNESS.
    // A dark pixel gets alpha 0 and is literally absent. Only the bright parts — the
    // specular, the rim, the lit reflection — carry any alpha at all. That makes the
    // orb ADDITIVE in effect: it can only ever put light ON his screen, never take
    // any away. Which is exactly what glass does, and exactly "invisible until it
    // lights up."
    // ⛔ Never go back to a geometric alpha here. Geometry cannot know if a pixel is
    //    dark, and a dark pixel with opacity is a shadow by definition.
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    alphaOut = clamp(lum * 1.55, 0.0, 0.90) * (0.62 + 0.38*voice);
  } else {
    // ground glow the sphere casts into the space beneath it
    float g = smoothstep(0.95, 0.0, length(uv - vec2(0.0,-0.55)));
    col += col * g * (0.08 + amp*0.22);            // the ground bounce, env-coloured
    // OFF the sphere there is nothing to see but the light it casts. Everything
    // else is fully transparent, which is what lets it sit over a page.
    alphaOut = 1.0;   // brightness gate at the end handles it; nothing dark survives
  }

  // filmic-ish shoulder, then dither to kill banding in the dark falloff
  col = col/(col+0.85);
  col = pow(col, vec3(0.4545));
  // brightness-derived alpha, computed on the FINAL tonemapped colour so it matches
  // exactly what is on screen. ⛔ Must come after the tonemap, never before.
  float finalLum = dot(col, vec3(0.299, 0.587, 0.114));
  alphaOut = clamp(finalLum * 1.55, 0.0, 0.92) * alphaOut;
  // ⛔ Never let the default page premultiply the orb by its own luminance again.
  // overlayMode < 0.5 = standalone (canvas IS the world) -> fully opaque.
  alphaOut = mix(1.0, alphaOut, overlayMode);
  alphaOut = max(alphaOut, solidBg);              // ?solid=1 -> fully opaque again
  float dth = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
  col += (dth-0.5)/255.0;

  // ⭐⭐⭐ SEE RIGHT THROUGH IT — qi 2026-08-23 08:31, the full sentence at last:
  //   "the goal was to make it reflective, but the reflective was really for it to be
  //    like INVISIBLE — so if we got it loaded up on a browser on any web page you
  //    should be able to SEE RIGHT THROUGH."
  // So the reflectivity was never the point; it was the MEANS. The orb is meant to
  // have no backdrop of its own and sit over whatever is behind it. That means this
  // frame cannot be opaque: everything the orb does not occupy must be ALPHA 0, and
  // the orb itself carries only as much alpha as a real reflection would.
  // ⛔ Never write vec4(col, 1.0) here again — an opaque frame cannot float.
  // ?solid=1 restores an opaque background for anyone who wants the standalone view.
  float a = alphaOut;
  gl_FragColor = vec4(col * a, a);        // premultiplied, matches the context below
}`;

let prog, aP, uRes, uT, uAmp, uHasCam, uCamAsp, uCam, tex;
let uHasCamF, uCamAspF, uCamF;
let uEnvMap, uHasEnv, envTex, envLoaded = false;
let uEnvMode, uLook, envMode = 0;
let uFlipY, envFlip = 0;
let uZoomF, zoomF = 1.0;
let uDist, camDist = 2.9, tCamDist = 2.9;   // eased radius, and its target
function clampDist(v){ return Math.max(1.25, Math.min(7.0, v)); }
let uOverlay, overlayMode = new URLSearchParams(location.search).has('overlay') ? 1 : 0;
let uTravel, travelK = 0;
let uTouchUV, uTouchAge, uTouchHeld, uRelAge;

let micGain = 4.2;                 // qi 08:58: "a LOT more reaction to my voice"
try {                                        // storage throws in some contexts
  const st = localStorage.getItem('aether.micGain');
  if(st) micGain = Math.max(0.4, Math.min(9, parseFloat(st) || 4.2));
} catch(_) {}
addEventListener('DOMContentLoaded', () => {
  const sl = document.getElementById('sens'), lab = document.getElementById('sensV');
  if(!sl) return;
  sl.value = micGain; if(lab) lab.textContent = micGain.toFixed(1);
  sl.addEventListener('input', () => {
    micGain = parseFloat(sl.value);
    if(lab) lab.textContent = micGain.toFixed(1);
    try { localStorage.setItem('aether.micGain', String(micGain)); } catch(_) {}
  }, {passive:true});
});

// LIQUID MIRROR, TOUCH LEG. qi 08:01 - "reactive to touch as well, not just the
// voice... but in a LIQUID manner, not the normal pulse."
// Record WHERE he touched in the shader's own uv units, and WHEN. The shader
// sends one crest out from that point. A tap anywhere feeds it; a drag re-seeds
// it continuously, so dragging trails ripples the way a finger through water does.
// "splash BUT FREEZE TIME, and when I go it reforms itself" (08:05). So the state
// that matters is not elapsed time - it is HELD vs RELEASED. While his finger is
// down the shader is told to stop evolving; the moment he lifts, relAge starts and
// the surface reforms. A single decay timer cannot express that, which is exactly
// why the first version felt like a pulse.
const touch = {x:0, y:0, at:-999, held:0, rel:-999};
function touchPos(e){
  const p = e.touches ? e.touches[0] : e;
  const w = cv.clientWidth || 1, h = cv.clientHeight || 1;
  const m = Math.min(w, h);
  // must match the shader exactly: (frag - 0.5*res) / min(res)
  touch.x =  (p.clientX - w*0.5) / m;
  touch.y = -(p.clientY - h*0.5) / m;      // GL y is up, CSS y is down
}
addEventListener('pointerdown', e => {
  touchPos(e); touch.at = performance.now(); touch.held = 1;
}, {passive:true});
addEventListener('pointermove', e => {
  // dragging carries the crater with the finger, so it keeps deforming under him
  if(touch.held) touchPos(e);
}, {passive:true});
function release(){
  if(!touch.held) return;
  touch.held = 0;
  touch.rel = performance.now();           // NOW time resumes, and it reforms
}
addEventListener('pointerup', release, {passive:true});
addEventListener('pointercancel', release, {passive:true});
addEventListener('blur', release, {passive:true});

// ─────────────────────────────────────────────────────────────────────────────
// LOOK AROUND.  qi 07:34 - "it either needs to follow the movement of the phone
// to navigate the environment, or it needs to be 360 and rotate."
// Both, because they are the same mechanism: a yaw/pitch pair that the shader
// orbits the camera by. The gyroscope drives it where there is one, a drag
// drives it everywhere, and neither is required for the page to work.
// ⭐⭐ DRAG AND GYRO ARE ADDITIVE, NOT RIVALS — qi 2026-08-23 08:33:
//   "I still want to be able to travel and rotate even when I'm in [voice] mode,
//    because every time I start the voice mode, THAT'S when it goes into gyroscope
//    mode."
// He found a real bug and it is in my own logic. I had drag set gyro=false so a
// deliberate drag would win — but onOrient sets gyro=true again on the very NEXT
// sensor tick, which is milliseconds later. So the gyro stole the view back the
// instant his finger lifted, every time, and arming the mic is what armed the gyro.
// ⭐ THE FIX IS TO STOP MAKING THEM COMPETE. Drag accumulates a PERSISTENT OFFSET;
// the gyro reports a DELTA from its own baseline; the view is offset + delta. Both
// inputs are live at once, forever, and neither can overwrite the other.
// ⛔ Never gate one input on a boolean the other input also writes.
const look = {yaw:0, pit:0,
              dYaw:0, dPit:0,      // his drag - persistent, never reset by the sensor
              gYaw:0, gPit:0,      // the gyro's delta from its own baseline
              gyro:false, a0:null, b0:null};
const D2R = Math.PI/180;

function clampPit(v){ return Math.max(-1.15, Math.min(1.15, v)); }

// ── PINCH TO ZOOM. Two fingers = zoom, one finger = look. Exactly one writer
// touches pinch.on (the pinch handler); the drag only READS it. That is the
// difference from the gyro-vs-drag bug: there, BOTH inputs wrote the same flag.
const pinch = {on:false, pts:new Map(), d0:0, z0:1};
(function(){
  const pdist = () => {           // finger separation; NOT the camera radius
    const a = [...pinch.pts.values()];
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  };
  addEventListener('pointerdown', e => {
    pinch.pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch.pts.size === 2){ pinch.on = true; pinch.d0 = pdist(); pinch.z0 = tCamDist; }
  }, {passive:true});
  addEventListener('pointermove', e => {
    if(!pinch.pts.has(e.pointerId)) return;
    pinch.pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(!pinch.on || pinch.pts.size < 2) return;
    const d = pdist();
    if(pinch.d0 > 8){
      // spreading fingers -> camera moves IN, so the orb genuinely enlarges
      tCamDist = clampDist(pinch.z0 * (pinch.d0 / d));
    }
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  const drop = e => {
    pinch.pts.delete(e.pointerId);
    if(pinch.pts.size < 2) pinch.on = false;
  };
  addEventListener('pointerup', drop, {passive:true});
  addEventListener('pointercancel', drop, {passive:true});
  // desktop: wheel / trackpad pinch
  addEventListener('wheel', e => {
    zoomF = Math.max(0.55, Math.min(4.0, zoomF * (e.deltaY < 0 ? 1.06 : 0.943)));
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
})();

// ── PRESS AND HOLD TO TRAVEL. qi 09:26: "if I press and hold... it should be able to
// travel through the 3D environment that its in, like back and forth."
// Hold past 320ms to engage, then slide up to go forward and down to come back -
// that is his "back and forth" on one finger. Position PERSISTS on release, because
// travelling somewhere and being yanked back is not travelling. Back to dusk resets.
// ⛔ Never engage on a plain tap: a tap is how he wakes the mic, and stealing it
// would cost him the one control he uses most.
let travelHeld = () => false;
(function(){
  let held=false, timer=null, y0=0, base=0;
  travelHeld = () => held;
  const start = e => {
    if(pinch.on) return;
    const p0 = e.touches ? e.touches[0] : e;
    // the orb sits centred at ~0.45 of viewport height; inside that disc is HIS
    // avatar and belongs to the deform, not to travel.
    const m = Math.min(innerWidth, innerHeight);
    const dx = (p0.clientX - innerWidth  * 0.5) / m;
    const dy = (p0.clientY - innerHeight * 0.45) / m;
    if(Math.sqrt(dx*dx + dy*dy) < 0.46) return;      // on the orb: deform owns it
    y0 = p0.clientY;
    base = travelK;
    timer = setTimeout(() => { held = true; }, 320);
  };
  const move = e => {
    if(!held) return;
    const y = (e.touches ? e.touches[0] : e).clientY;
    travelK = Math.max(-0.42, Math.min(0.72, base + (y0 - y) * 0.0022));
    if(e.cancelable) e.preventDefault();
  };
  const end = () => { held = false; if(timer){ clearTimeout(timer); timer = null; } };
  addEventListener('pointerdown', start, {passive:true});
  addEventListener('pointermove', move, {passive:false});
  addEventListener('pointerup', end, {passive:true});
  addEventListener('pointercancel', end, {passive:true});
})();

// ── drag: always available, desktop and phone alike
(function(){
  let down=false, lx=0, ly=0;
  const start=e=>{ const p=e.touches?e.touches[0]:e; down=true; lx=p.clientX; ly=p.clientY; };
  const move =e=>{
    if(!down) return;
    const p=e.touches?e.touches[0]:e;
    if(pinch.on){ lx=p.clientX; ly=p.clientY; return; }   // re-baseline, never jump
    if(travelHeld()){ lx=p.clientX; ly=p.clientY; return; }  // travel owns the gesture
    // dragging LEFT should sweep the world left, so the sign follows the finger
    look.dYaw += (p.clientX-lx) * 0.0055;
    look.dPit = clampPit(look.dPit + (p.clientY-ly) * 0.0040);
    lx=p.clientX; ly=p.clientY;
    // ⛔ do NOT touch look.gyro here. Suppressing the sensor was the bug: it came
    // straight back on the next tick and the drag was lost.
    if(e.cancelable) e.preventDefault();
  };
  const end=()=>{ down=false; };
  addEventListener('pointerdown',start,{passive:true});
  addEventListener('pointermove',move,{passive:false});
  addEventListener('pointerup',end,{passive:true});
  addEventListener('pointercancel',end,{passive:true});
})();

// ── gyroscope: relative to wherever he was pointing when it started, so "front"
// is where he already is rather than magnetic north.
function onOrient(e){
  if(e.alpha === null && e.beta === null) return;
  const a = e.alpha || 0, b = e.beta || 0;
  if(look.a0 === null){ look.a0 = a; look.b0 = b; }
  let da = a - look.a0;
  if(da >  180) da -= 360;                 // the compass wraps; the view must not
  if(da < -180) da += 360;
  look.gYaw = -da * D2R;
  look.gPit = (b - look.b0) * D2R * 0.9;
  look.gyro = true;
  const n = document.getElementById('envNote');
  if(n && !n.dataset.gyro){ n.dataset.gyro='1'; n.textContent='Move the phone to look around. Drag works at the same time.'; }
}

// iOS 13+ gates the sensor behind a permission that MUST come from a gesture.
// There is no way around that, so it rides along with the mic/camera grant and
// a refusal costs nothing: the drag still works.
let gyroArmed = false;
function armGyro(){
  if(gyroArmed) return;          // idempotent: it is now called from three places
  try{
    const DOE = window.DeviceOrientationEvent;
    if(!DOE) return;
    if(typeof DOE.requestPermission === 'function'){
      DOE.requestPermission().then(r=>{
        if(r === 'granted'){
          gyroArmed = true;
          addEventListener('deviceorientation', onOrient, {passive:true});
        }
      }).catch(()=>{});        // a refusal costs nothing - drag still works
    } else {
      gyroArmed = true;         // no gate on this platform: live immediately
      addEventListener('deviceorientation', onOrient, {passive:true});
    }
  }catch(_){}
}

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    fail('<b>Shader failed.</b> ' + gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function initGL(){
  const v = sh(gl.VERTEX_SHADER, VS), f = sh(gl.FRAGMENT_SHADER, FS);
  if(!v||!f) return false;
  prog = gl.createProgram();
  gl.attachShader(prog,v); gl.attachShader(prog,f); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    fail('<b>Program link failed.</b> ' + gl.getProgramInfoLog(prog)); return false;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  aP = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);

  uRes=gl.getUniformLocation(prog,'res');
  uT=gl.getUniformLocation(prog,'t');
  uAmp=gl.getUniformLocation(prog,'amp');
  uHasCam=gl.getUniformLocation(prog,'hasCam');
  uCamAsp=gl.getUniformLocation(prog,'camAsp');
  uCam=gl.getUniformLocation(prog,'cam');
  uHasCamF=gl.getUniformLocation(prog,'hasCamF');
  uCamAspF=gl.getUniformLocation(prog,'camAspF');
  uCamF=gl.getUniformLocation(prog,'camF');
  uEnvMap=gl.getUniformLocation(prog,'envMap');
  uHasEnv=gl.getUniformLocation(prog,'hasEnv');
  uEnvMode=gl.getUniformLocation(prog,'envMode');
  uFlipY=gl.getUniformLocation(prog,'flipY');
  uZoomF=gl.getUniformLocation(prog,'zoomF');
  uDist=gl.getUniformLocation(prog,'dist');
  uOverlay=gl.getUniformLocation(prog,'overlayMode');
  uTravel=gl.getUniformLocation(prog,'travelK');
  uLook=gl.getUniformLocation(prog,'look');
  uTouchUV=gl.getUniformLocation(prog,'touchUV');
  uTouchAge=gl.getUniformLocation(prog,'touchAge');
  uTouchHeld=gl.getUniformLocation(prog,'touchHeld');
  uRelAge=gl.getUniformLocation(prog,'relAge');

  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  // 1px placeholder so the sampler is always valid, even before permission
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([6,5,12,255]));
  gl.uniform1i(uCam, 0);

  // ── the supplied environment: /aether/?env=<equirect.jpg>
  // ⭐ qi 06:28: "the images were examples of how it should REFLECT, not examples
  // of the environment." So the panorama is an INPUT. Hand it any place and the
  // sphere mirrors that place, full 360, no cone and no seam. With none supplied
  // it falls back to the procedural scene, which is a demo, not the spec.
  envTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, envTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);        // wraps in azimuth
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([6,5,12,255]));
  gl.uniform1i(uEnvMap, 2);
  gl.activeTexture(gl.TEXTURE0);

  const envUrl = new URLSearchParams(location.search).get('env');
  if(envUrl){
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => {
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D, envTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      try{
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
        envLoaded = true;
      }catch(e){ fail('<b>Environment blocked.</b> ' + e + ' — the panorama host must allow cross-origin reads.'); }
      gl.activeTexture(gl.TEXTURE0);
    };
    im.onerror = () => fail('<b>Environment failed to load.</b> ' + envUrl);
    im.src = envUrl;
  }
  return true;
}

let W=0,H=0;
function size(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  // ⭐ BLACK STRIP IN THE PWA - qi 2026-08-23 08:12: "I'm having a black strip
  // when I open it as a PWA." In a standalone/fullscreen window innerHeight can
  // report SHORT of the real screen (the UA reserves the status-bar band before
  // the page is told about it), and any row the canvas does not cover falls
  // through to body's black. So take the largest honest measure of the viewport,
  // and re-measure on visualViewport changes, which is the event that actually
  // fires when that band is released.
  const vh = Math.max(
    innerHeight,
    document.documentElement.clientHeight || 0,
    (window.visualViewport && window.visualViewport.height) || 0
  );
  const vw = Math.max(
    innerWidth,
    document.documentElement.clientWidth || 0,
    (window.visualViewport && window.visualViewport.width) || 0
  );
  cv.style.height = vh + 'px';
  cv.style.width  = vw + 'px';
  const w = Math.round(vw*dpr), h = Math.round(vh*dpr);
  if(w===W && h===H) return;
  W=w; H=h; cv.width=w; cv.height=h;
  gl.viewport(0,0,w,h);
}

/* ── mic ─────────────────────────────────────────────────────────────────── */
let analyser=null, buf8=null, amp=0, ampS=0, camLive=false, camAsp=1;

async function start(){
  grant.classList.add('gone');

  // camera — rear first, that is the room you are pointing at
  try{
    const s = await navigator.mediaDevices.getUserMedia({
      // ⭐ FRONT camera, qi 2026-08-23 06:25, reasoned out by him:
      // "if I'm part of the environment, cause I'm looking at it, and it's just
      //  paying attention to me — then if I was staring at it, it would be
      //  showing my reflection, so that does make sense."
      // The rear camera sees whatever the phone is aimed at, usually a table or
      // a wall. The FRONT camera sees the environment that is actually looking
      // back — him, and the room he is standing in. That is what the sphere is
      // attending to. It is also the camera iOS reliably grants.
      video:{facingMode:{ideal:'user'}, width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
    vid.srcObject = s;
    await vid.play().catch(()=>{});
    camLive = true;
    hud.classList.add('on');
  }catch(e){
    fail('<b>No camera.</b> ' + e.name + ' — the sphere still listens, but it has nothing to mirror. '
       + 'If you opened this inside another app’s browser, close it and launch AETHER from its own icon.');
  }

  // mic — separate request so a camera refusal does not kill the voice
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    if(ac.state === 'suspended') await ac.resume();
    const src = ac.createMediaStreamSource(s);
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);              // note: never connected to destination — no feedback
    buf8 = new Uint8Array(analyser.fftSize);
    hud.classList.add('on');
  }catch(e){
    hint.textContent = 'mic blocked';
    fail((errBox.innerHTML||'') + '<br><b>No mic.</b> ' + e.name
       + ' — a webview never hands a page a microphone. Open AETHER from its own home-screen icon.');
  }
}

function readMic(){
  if(!analyser) return 0;
  analyser.getByteTimeDomainData(buf8);
  let s=0;
  for(let i=0;i<buf8.length;i++){ const x=(buf8[i]-128)/128; s+=x*x; }
  const rms = Math.sqrt(s/buf8.length);
  // rms of ordinary speech sits around .02–.15; map that to a usable 0..1
  return Math.min(1, Math.max(0, (rms-0.008)*7.5));
}

/* ── frame ───────────────────────────────────────────────────────────────── */
let t0 = null;
function frame(ts){
  requestAnimationFrame(frame);
  if(!prog) return;
  if(t0===null) t0=ts;
  size();

  amp = readMic();
  ampS += (amp - ampS) * (amp > ampS ? 0.35 : 0.08);   // fast attack, slow release

  if(camLive && vid.readyState >= 2 && vid.videoWidth){
    camAsp = vid.videoWidth / vid.videoHeight;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    try{ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid); }catch(e){}
  }

  gl.uniform2f(uRes, cv.width, cv.height);
  gl.uniform1f(uT, (ts-t0)/1000);
  // ⭐ SENSITIVITY — qi 08:30: "increase the sensitivity to the sound, like, or
  // give me a control for sensitivity." Both: the default gain is raised AND he
  // gets the slider, because the right value depends on his room and his wearable,
  // which I cannot know from here. Persisted per-device.
  gl.uniform1f(uAmp, Math.min(1.0, ampS * micGain));
  // BOTH inputs, summed. He can drag while the gyroscope is live and the drag holds.
  const tYaw = look.dYaw + look.gYaw;
  const tPit = clampPit(look.dPit + look.gPit);
  const k = look.gyro ? 0.16 : 0.22;
  look.yaw += (tYaw - look.yaw) * k;
  look.pit += (tPit - look.pit) * k;
  gl.uniform2f(uLook, look.yaw, look.pit);
  pumpMotion();                       // a moving environment needs a fresh upload
  gl.uniform2f(uTouchUV, touch.x, touch.y);
  gl.uniform1f(uTouchAge, (ts - touch.at) / 1000);
  gl.uniform1f(uTouchHeld, touch.held);
  gl.uniform1f(uRelAge, touch.held ? 9999 : (ts - touch.rel) / 1000);
  gl.uniform1f(uEnvMode, envMode);
  gl.uniform1f(uFlipY, envFlip);
  gl.uniform1f(uZoomF, zoomF);
  camDist += (tCamDist - camDist) * 0.18;   // their easing, kept verbatim
  gl.uniform1f(uDist, camDist);
  gl.uniform1f(uOverlay, overlayMode);
  gl.uniform1f(uTravel, travelK);
  gl.uniform1f(uHasEnv, envLoaded ? 1 : 0);
  gl.uniform1f(uHasCam, 0);                       // no rear camera in use
  gl.uniform1f(uHasCamF, camLive ? 1 : 0);        // FRONT is the only one
  gl.uniform1f(uCamAspF, camAsp);
  gl.uniform1f(uCamAsp, camAsp);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  lvl.style.width = (ampS*100).toFixed(1) + '%';
  if(analyser) hint.textContent = ampS > 0.18 ? 'hearing you' : 'listening';
}

if(gl && initGL()){
  size();
  requestAnimationFrame(frame);       // the sphere renders BEFORE any permission
}

// ─────────────────────────────────────────────────────────────────────────────
// ANY IMAGE -> AN ENVIRONMENT.  qi 07:36 "lets me upload any image and it
// automatically makes it a good panorama" and 07:41 "that's all I have"
// (flat photos) plus "can you convert it or interpret it?"
// AUTOMATICALLY means the page decides, not him. The tell is the ASPECT RATIO:
// a true equirectangular panorama is 2:1 by convention, because it maps 360
// degrees across and 180 down. Anything else is a flat photo and gets the
// mirror-wrap. So he picks a file and never has to know which kind it was.
function applyEnvImage(img, label){
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const ar = h > 0 ? w/h : 1;
  const trueSphere = (ar > 1.88 && ar < 2.18);
  envMode = trueSphere ? 0 : 1;

  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, envTex);
  // his photos are arbitrary sizes, and WebGL1 refuses mipmaps or REPEAT on a
  // non-power-of-two texture - it does not warn, it silently samples black.
  // CLAMP_TO_EDGE + LINEAR is the combination that always works.
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  try{
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    envLoaded = true;
  }catch(err){
    fail('<b>That image could not be read.</b> ' + (err && err.message ? err.message : ''));
    return;
  }
  gl.activeTexture(gl.TEXTURE0);
  envMotion = null;                   // a still replaces any running video/GIF

  const n = document.getElementById('envNote');
  if(n) n.textContent = (trueSphere ? 'Real 360 detected (' : 'Wrapped from a flat photo (')
    + w + ' by ' + h + '). ' + (label || '');
  closeSheet();
}

function loadEnvFromSrc(src, label, revoke){
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => { applyEnvImage(im, label); if(revoke) URL.revokeObjectURL(src); };
  im.onerror = () => {
    if(revoke) URL.revokeObjectURL(src);
    fail('<b>Could not load that image.</b> A remote link needs to allow cross-origin reads; a file off your phone always works.');
  };
  im.src = src;
}

// ⭐⭐ A LIVING ENVIRONMENT — qi 2026-08-23 08:35 and again 08:41: "if I use a GIF,
// would it give the panoramic environment live motion as well?… is it possible to
// upload GIF images or videos for the environment AND the reflection?"
// Yes, with one non-obvious step. A WebGL texture is a SNAPSHOT: texImage2D copies
// the pixels once, so a GIF handed straight to a texture is frozen on frame one.
// The fix is to re-upload every frame from a source that is itself animating:
//   VIDEO -> upload the <video> element directly each frame (cheapest, best quality)
//   GIF   -> an animated GIF DOES advance inside an <img>, but an <img> cannot be
//            re-read directly, so draw it to a 2D canvas each frame and upload that
// Video is the better choice of the two: smaller, smoother, and it can run minutes.
let envMotion = null;        // {kind:'video'|'gif', el, cv, ctx}

function useVideo(url, label){
  const v = document.getElementById('envVid');
  v.crossOrigin = 'anonymous';
  v.src = url; v.muted = true; v.loop = true; v.playsInline = true;
  v.play().catch(()=>{});               // autoplay needs muted, which it is
  v.addEventListener('loadeddata', () => {
    envMode = (v.videoWidth / Math.max(v.videoHeight,1) > 1.88 &&
               v.videoWidth / Math.max(v.videoHeight,1) < 2.18) ? 0 : 1;
    envMotion = {kind:'video', el:v};
    envLoaded = true;
    const n = document.getElementById('envNote');
    if(n) n.textContent = 'Live video environment (' + v.videoWidth + ' by ' +
                          v.videoHeight + '). ' + (label||'');
    closeSheet();
  }, {once:true});
  v.addEventListener('error', () => fail('<b>That video could not be read.</b>'), {once:true});
}

// ⭐⭐⭐ DECODE THE FRAMES MYSELF - qi's own 500x500 / 30-frame GIF, 2026-08-23 19:04:
// label read "Animated environment (500 by 500)", kind was 'gif', every presence check
// PASSED - and the canvas pixel signature was byte-identical across three samples 900ms
// apart (3933269 three times). Frames were not advancing at all.
// ⭐ MY EARLIER FIX WAS INCOMPLETE, NOT WRONG. Attaching the <img> was necessary but
// not sufficient: at 1px and 0.01 opacity the browser STILL treats it as not rendered
// and suspends the animation. I fixed the instance I understood (display:none) and left
// the RULE unhandled - the rule is that animation depends on a heuristic I do not
// control, so it must not be depended on at all.
// ✅ ImageDecoder (WebCodecs) decodes GIF frames EXPLICITLY, with real per-frame
// durations, and steps on my own clock. No heuristic, no hidden-element gamble.
// ⛔ Falls back to the <img> path when ImageDecoder is absent - never leave a browser
// with no path at all.
async function useGifDecoded(url, label){
  if(typeof ImageDecoder === 'undefined') return false;
  try{
    const resp = await fetch(url);
    const buf  = await resp.arrayBuffer();
    const dec  = new ImageDecoder({data: buf, type: 'image/gif'});
    await dec.tracks.ready;
    const track = dec.tracks.selectedTrack;
    const count = track && track.frameCount ? track.frameCount : 1;
    if(count < 2) return false;                 // a single frame cannot animate
    const frames = [];
    for(let i = 0; i < count; i++){
      const {image} = await dec.decode({frameIndex: i});
      // duration is microseconds; GIFs commonly report 0 for "use default"
      const ms = image.duration ? image.duration / 1000 : 100;
      frames.push({bmp: image, ms: Math.max(20, ms)});
    }
    const cv2 = document.getElementById('gifCv');
    cv2.width = frames[0].bmp.displayWidth;
    cv2.height = frames[0].bmp.displayHeight;
    const ctx = cv2.getContext('2d');
    const ar = cv2.width / Math.max(cv2.height, 1);
    envMode = (ar > 1.88 && ar < 2.18) ? 0 : 1;
    envMotion = {kind:'gif', cv:cv2, ctx:ctx, frames:frames, idx:0, acc:0, decoded:true};
    envLoaded = true;
    const n = document.getElementById('envNote');
    if(n) n.textContent = 'Animated environment (' + cv2.width + ' by ' + cv2.height +
                          ', ' + count + ' frames). ' + (label||'');
    closeSheet();
    return true;
  }catch(e){ return false; }
}

function useGif(url, label){
  useGifDecoded(url, label).then(ok => { if(!ok) useGifImgFallback(url, label); });
}

function useGifImgFallback(url, label){
  // ⭐⭐ A DETACHED GIF DOES NOT ANIMATE — qi 2026-08-23 08:59: "the GIF images
  // aren't doing the motion." Not a cache problem, a real bug of mine.
  // Browsers PAUSE animated-image playback for an <img> that is not being rendered:
  // one created with new Image() and never attached, or attached with display:none,
  // sits frozen on frame one. My canvas was then faithfully copying that one frame
  // every tick — which looks exactly like the feature was never built.
  // ⭐ So attach it and keep it RENDERED but invisible: 1px, opacity 0, off in the
  // corner. ⛔ display:none re-freezes it. Never use display:none here.
  const im = document.getElementById('gifSrc') || (() => {
    const e = new Image();
    e.id = 'gifSrc';
    e.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;' +
                      'opacity:0.01;pointer-events:none;z-index:-1';
    document.body.appendChild(e);
    return e;
  })();
  im.crossOrigin = 'anonymous';
  im.onload = () => {
    const cv2 = document.getElementById('gifCv');
    cv2.width = im.naturalWidth; cv2.height = im.naturalHeight;
    const ctx = cv2.getContext('2d');
    envMode = (im.naturalWidth / Math.max(im.naturalHeight,1) > 1.88 &&
               im.naturalWidth / Math.max(im.naturalHeight,1) < 2.18) ? 0 : 1;
    envMotion = {kind:'gif', el:im, cv:cv2, ctx:ctx};
    envLoaded = true;
    const n = document.getElementById('envNote');
    if(n) n.textContent = 'Animated environment (' + im.naturalWidth + ' by ' +
                          im.naturalHeight + '). ' + (label||'');
    closeSheet();
  };
  im.onerror = () => fail('<b>That image could not be read.</b>');
  im.src = url;
}

// re-upload the moving source every frame. This is the whole trick.
function pumpMotion(){
  if(!envMotion || !envTex) return;
  try {
    let src = null;
    if(envMotion.kind === 'video'){
      const v = envMotion.el;
      if(v.readyState < 2) return;                  // nothing decoded yet
      src = v;
    } else {
      if(envMotion.decoded){
        // step on my own clock: no reliance on the browser animating anything
        envMotion.acc += 16.7;
        const cur = envMotion.frames[envMotion.idx];
        if(envMotion.acc >= cur.ms){
          envMotion.acc = 0;
          envMotion.idx = (envMotion.idx + 1) % envMotion.frames.length;
        }
        envMotion.ctx.drawImage(envMotion.frames[envMotion.idx].bmp, 0, 0);
      } else {
        envMotion.ctx.drawImage(envMotion.el, 0, 0);  // the GIF has advanced by itself
      }
      src = envMotion.cv;
    }
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, envTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
    gl.activeTexture(gl.TEXTURE0);
  } catch(_) { envMotion = null; }                  // never let this kill the loop
}

}
