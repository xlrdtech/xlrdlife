<title>Descent</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font: 400 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; color:#c9ccd0; }
  canvas { display:block; position:fixed; inset:0; }

  /* Overlay is deliberately sparse and low-contrast — in the reference class the
     technical garnish sits UNDER the image, never competing with it. */
  .hud { position:fixed; inset:0; pointer-events:none; z-index:2; }
  .brand { position:absolute; top:22px; left:24px; font-size:11px; letter-spacing:.34em;
           text-transform:uppercase; color:#8d949c; }
  .scale { position:absolute; top:22px; right:24px; text-align:right; font-variant-numeric:tabular-nums; }
  .scale b { display:block; font-size:11px; letter-spacing:.28em; text-transform:uppercase;
             color:#eef1f4; font-weight:500; }
  .scale span { font-size:11px; color:#6f767e; letter-spacing:.08em; }

  /* Depth ladder — the only interactive affordance. */
  .ladder { position:absolute; left:24px; top:50%; transform:translateY(-50%);
            display:flex; flex-direction:column; gap:2px; pointer-events:auto; }
  .rung { display:flex; align-items:center; gap:10px; padding:7px 0; cursor:pointer;
          background:none; border:0; color:#5f666e; font:inherit; font-size:11px;
          letter-spacing:.2em; text-transform:uppercase; transition:color .35s ease; }
  .rung i { display:block; width:22px; height:1px; background:currentColor; opacity:.5;
            transition:width .45s cubic-bezier(.22,1,.36,1), opacity .35s ease; }
  .rung:hover { color:#a8aeb5; }
  .rung[data-on="1"] { color:#eef1f4; }
  .rung[data-on="1"] i { width:46px; opacity:1; }

  .readout { position:absolute; left:24px; bottom:22px; font-size:11px; color:#5f666e;
             letter-spacing:.06em; font-variant-numeric:tabular-nums; }
  .hint { position:absolute; right:24px; bottom:22px; font-size:11px; color:#4d545b;
          letter-spacing:.16em; text-transform:uppercase; }

  .veil { position:fixed; inset:0; z-index:3; background:#000; pointer-events:none;
          transition:opacity 1.1s ease; }
  @media (prefers-reduced-motion: reduce) { .veil { transition:none; } }
</style>

<div class="hud">
  <div class="brand">Descent</div>
  <div class="scale"><b id="sName">Orbit</b><span id="sUnit">— km</span></div>

  <nav class="ladder" id="ladder"></nav>

  <div class="readout" id="readout">alt 0</div>
  <div class="hint">scroll · drag</div>
</div>
<div class="veil" id="veil"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ─────────────────────────────────────────────────────────────────────────────
   DESCENT — one continuous camera fall across four scales:
     space → sky → earth → underground

   WHY IT IS BUILT THIS WAY
   The reference class (Active Theory, Abeto/igloo.inc) buys its realism with
   authored Houdini/Blender geometry and baked light. None of that pipeline
   exists here, so competing on asset fidelity is a losing frame. What actually
   carries the read, and what this file spends its whole budget on:

     · a value range that runs true black to true white — a page spanning only
       mid-greys reads as a sketch no matter how correct the geometry is
     · three or more receding planes, each lower in contrast, haze pooling
       between them, so depth is felt rather than drawn
     · contact darkening where forms meet ground; a floating subject reads flat
     · a near-monochrome cool palette, so the few warm accents actually land

   Everything is procedural and generated at load. No external asset, no build
   step, no bundler — one file, per canon 9.

   TRAP PAID FOR (skill note 5): untextured THREE.Points render as hard opaque
   SQUARES, and with sizeAttenuation any particle near the lens smears a grey
   box across the frame. It is invisible in a local still and only shows up on
   the served page. Every point cloud here gets a generated radial-alpha map.
   ───────────────────────────────────────────────────────────────────────────── */

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // keeps highlights from clipping to mush
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 6000);
const world  = new THREE.Group();
scene.add(world);

/* ── the one texture everything particulate uses ───────────────────────────── */
function radialSprite(inner = 0.0, soft = 1.0) {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d').createRadialGradient(s/2, s/2, s*0.5*inner, s/2, s/2, s/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(soft * 0.5, 'rgba(255,255,255,0.34)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  const ctx = c.getContext('2d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = radialSprite();

/* ── value anchors: the palette is deliberately narrow and cool ────────────── */
const INK    = 0x05070a;
const SLATE  = 0x1b2027;
const STEEL  = 0x5d666f;
const PALE   = 0xc9ccd0;
const SIGNAL = 0x7fd4ff;   // the single cool accent — used sparingly, on purpose

scene.fog = new THREE.FogExp2(INK, 0.0016);

/* ═════════ LAYER 1 · SPACE ════════════════════════════════════════════════ */
const space = new THREE.Group(); world.add(space);
{
  const N = 5200, pos = new Float32Array(N*3), col = new Float32Array(N*3), siz = new Float32Array(N);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    // shell distribution, not a cube — a cubic field betrays its corners on rotate
    const r = 900 + Math.random()*1500;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph) + 700;
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    // most stars are dim; a few are white-hot. That spread IS the value range.
    const t = Math.pow(Math.random(), 3.2);
    c.setHSL(0.58 - t*0.05, 0.22*(1-t), 0.30 + t*0.68);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    siz[i] = 0.6 + t*3.4;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  g.setAttribute('size',     new THREE.BufferAttribute(siz, 1));
  space.add(new THREE.Points(g, new THREE.PointsMaterial({
    size:2.4, map:SPRITE, alphaTest:0.02, transparent:true,
    vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending,
    sizeAttenuation:true
  })));
}

/* ═════════ LAYER 2 · THE LIMB — planet edge + atmosphere ══════════════════ */
const limb = new THREE.Group(); world.add(limb);
{
  const R = 620;
  const surf = new THREE.Mesh(
    new THREE.SphereGeometry(R, 96, 96),
    new THREE.MeshStandardMaterial({ color:0x0a0f16, roughness:1, metalness:0 })
  );
  surf.position.y = -R - 40;
  limb.add(surf);

  // Atmosphere: backside-rendered rim. Fresnel on the BACK face is what makes a
  // planet edge glow instead of looking like a lit ball.
  const atmo = new THREE.Mesh(
    new THREE.SphereGeometry(R*1.045, 96, 96),
    new THREE.ShaderMaterial({
      side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uCol:{ value:new THREE.Color(SIGNAL) } },
      vertexShader:`varying vec3 vN; varying vec3 vP;
        void main(){ vN=normalize(normalMatrix*normal);
          vec4 mv=modelViewMatrix*vec4(position,1.); vP=mv.xyz;
          gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`varying vec3 vN; varying vec3 vP; uniform vec3 uCol;
        void main(){
          float f = pow(clamp(1.0 - abs(dot(normalize(vN), normalize(-vP))), 0., 1.), 3.4);
          gl_FragColor = vec4(uCol * f * 1.5, f);
        }`
    })
  );
  atmo.position.copy(surf.position);
  limb.add(atmo);
}

/* ═════════ LAYER 3 · EARTH — a city read as light, not geometry ═══════════ */
const earth = new THREE.Group(); world.add(earth);
{
  // Ground: large, dark, faintly rough. It exists to CATCH the contact shadow
  // and to give the haze something to pool against.
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(2600, 2600, 1, 1),
    new THREE.MeshStandardMaterial({ color:0x080b10, roughness:0.96, metalness:0.02 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.4;
  earth.add(ground);

  // Blocks on a jittered grid. Instanced so 1,800 towers cost one draw call.
  const COUNT = 1800;
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ color:SLATE, roughness:0.72, metalness:0.16 });
  const mesh = new THREE.InstancedMesh(geo, mat, COUNT);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  const p = new THREE.Vector3(), s = new THREE.Vector3();

  let n = 0;
  const SPAN = 46, PITCH = 15;
  for (let ix = -SPAN; ix <= SPAN && n < COUNT; ix++) {
    for (let iz = -SPAN; iz <= SPAN && n < COUNT; iz++) {
      const x = ix*PITCH + (Math.random()-0.5)*5.5;
      const z = iz*PITCH + (Math.random()-0.5)*5.5;
      const d = Math.hypot(x, z);
      if (d > 660 || d < 26) continue;          // hole at centre = the descent shaft
      if (Math.random() > 0.62) continue;        // negative space is what reads as a city
      // density falls off from centre — a uniform field looks like a circuit board
      const core = Math.max(0, 1 - d/620);
      const h = 4 + Math.pow(Math.random(), 2.3) * (10 + core*118);
      p.set(x, h/2, z);
      s.set(4 + Math.random()*7, h, 4 + Math.random()*7);
      q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random()*0.34);
      m.compose(p, q, s);
      mesh.setMatrixAt(n++, m);
    }
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  earth.add(mesh);

  // Window light as points, NOT emissive faces. Emissive boxes blow out into a
  // single mass at distance; discrete points keep the seams between towers.
  const L = 5200, lp = new Float32Array(L*3), lc = new Float32Array(L*3);
  const c = new THREE.Color(), tmp = new THREE.Matrix4();
  const pos = new THREE.Vector3(), scl = new THREE.Vector3(), qq = new THREE.Quaternion();
  for (let i = 0; i < L; i++) {
    mesh.getMatrixAt((Math.random()*n)|0, tmp);
    tmp.decompose(pos, qq, scl);
    lp[i*3]   = pos.x + (Math.random()-0.5)*scl.x*1.02;
    lp[i*3+1] = Math.random()*scl.y;
    lp[i*3+2] = pos.z + (Math.random()-0.5)*scl.z*1.02;
    const warm = Math.random() > 0.82;
    c.setHSL(warm ? 0.09 : 0.55, warm ? 0.55 : 0.30, 0.52 + Math.random()*0.36);
    lc[i*3] = c.r; lc[i*3+1] = c.g; lc[i*3+2] = c.b;
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
  lg.setAttribute('color',    new THREE.BufferAttribute(lc, 3));
  earth.add(new THREE.Points(lg, new THREE.PointsMaterial({
    size:1.5, map:SPRITE, alphaTest:0.02, transparent:true, vertexColors:true,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
    // fog:false — MEASURED on capture 2: the frame still topped out at #1c2530
    // with no white anywhere, because FogExp2 at street density (~0.0057) ate
    // every additive sprite before it reached the lens. Emissive sources are
    // lights, not surfaces; fogging them is physically wrong AND it erased the
    // exact highlights added to fix the value range in the first place.
    fog:false
  })));

  // Haze slabs — the depth cue.
  // MEASURED FAIL, first street capture: these all sat BEHIND the city at
  // z=-320, so nothing ever separated near towers from far ones and the whole
  // field read as one black mass. Haze only creates depth when it is BETWEEN
  // the camera and the subject. They now straddle the field, and each is
  // fainter as it recedes so the eye reads the order.
  const HAZE = [
    { z:  190, o:0.16, y: 26 },   // in front of the near towers
    { z:  -60, o:0.22, y: 54 },
    { z: -300, o:0.26, y: 96 },
    { z: -620, o:0.20, y:140 }
  ];
  for (const h of HAZE) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(2600, 700),
      new THREE.MeshBasicMaterial({ color:0x1a2430, transparent:true,
        opacity:h.o, depthWrite:false })
    );
    m.position.set(0, h.y, h.z);
    earth.add(m);
  }

  // Roof beacons — the WHITE end of the value range.
  // The first capture spanned black to only #2a3038: no white anywhere, which
  // the reference bar treats as an automatic fail before composition is even
  // considered. These few small bright sprites supply true white, and being
  // sparse they read as signal rather than blowing the frame out.
  const B = 90, bp = new Float32Array(B*3);
  const tmpM = new THREE.Matrix4(), bpos = new THREE.Vector3(),
        bscl = new THREE.Vector3(), bq = new THREE.Quaternion();
  for (let i = 0; i < B; i++) {
    mesh.getMatrixAt((Math.random()*n)|0, tmpM);
    tmpM.decompose(bpos, bq, bscl);
    bp[i*3] = bpos.x; bp[i*3+1] = bscl.y + 1.2; bp[i*3+2] = bpos.z;
  }
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.BufferAttribute(bp, 3));
  earth.add(new THREE.Points(bg, new THREE.PointsMaterial({
    size:3.2, map:SPRITE, alphaTest:0.02, transparent:true, color:0xffffff,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
    // fog:false — MEASURED on capture 2: the frame still topped out at #1c2530
    // with no white anywhere, because FogExp2 at street density (~0.0057) ate
    // every additive sprite before it reached the lens. Emissive sources are
    // lights, not surfaces; fogging them is physically wrong AND it erased the
    // exact highlights added to fix the value range in the first place.
    fog:false
  })));
}

/* ═════════ LAYER 4 · UNDERGROUND — the part no dataset gives you ══════════ */
const under = new THREE.Group(); world.add(under);
{
  // Nobody streams the subsurface. This layer is invented, which is exactly why
  // it is the one that can carry an identity instead of borrowed realism.
  const RING = 34;
  for (let i = 0; i < 26; i++) {
    const y   = -30 - i*38;
    const rad = RING + Math.sin(i*0.7)*7 + i*0.9;
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(rad, 0.42, 8, 128),
      new THREE.MeshStandardMaterial({
        color:STEEL, roughness:0.42, metalness:0.72,
        emissive:new THREE.Color(SIGNAL), emissiveIntensity:0.055 + (i%4===0 ? 0.16 : 0)
      })
    );
    ring.rotation.x = Math.PI/2;
    ring.position.y = y;
    under.add(ring);

    // Struts: thin, dark, and DARKER than the field behind them. Pale needles
    // against a bright gap vanish — the lattice only reads when it occludes.
    if (i % 2 === 0) {
      for (let k = 0; k < 9; k++) {
        const a = (k/9)*Math.PI*2 + i*0.16;
        const st = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.2, 38, 6),
          new THREE.MeshStandardMaterial({ color:0x151a21, roughness:0.85, metalness:0.35 })
        );
        st.position.set(Math.cos(a)*rad, y - 19, Math.sin(a)*rad);
        under.add(st);
      }
    }
  }

  // Suspended motes give the shaft volume; without them it reads as a diagram.
  const D = 2600, dp = new Float32Array(D*3);
  for (let i = 0; i < D; i++) {
    const a = Math.random()*Math.PI*2, r = Math.random()*72;
    dp[i*3]   = Math.cos(a)*r;
    dp[i*3+1] = -20 - Math.random()*1000;
    dp[i*3+2] = Math.sin(a)*r;
  }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  under.add(new THREE.Points(dg, new THREE.PointsMaterial({
    size:0.9, map:SPRITE, alphaTest:0.02, transparent:true, opacity:0.5,
    color:0x9fb4c6, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true
  })));
}

/* ── light: one key, one cold fill, one rim. Three is enough. ─────────────── */
/* ═════════ LIGHT — one source, and it BLOWS OUT ═══════════════════════════
   REFERENCE (qi, 2026-08-16): a face emerging from a single blown-white light
   against near-total black, violet/lavender secondaries, glitch striations,
   chromatic fringing where light meets dark.

   That image reframed the whole lighting problem. Two earlier captures failed
   the value gate — #2a3038, then #1c2530, never any white — because the scene
   was lit EVENLY by three balanced lights. Balanced lighting cannot produce
   that image no matter how the geometry improves.

   So: ONE dominant source that genuinely clips to white, a violet fill at a
   fraction of its strength, and ambient dropped near zero so everything the key
   does not touch falls to true black. Form is now defined by WHERE THE LIGHT
   STOPS rather than by geometry edges — which is also why this is achievable
   here: it is a lighting problem, not an asset-authoring problem, and assets
   were the one thing the reference class could buy that we cannot. */
const VIOLET = 0x9d8cff;

scene.add(new THREE.HemisphereLight(0x121a26, 0x000000, 0.16));   // near-zero: black must stay black

const key = new THREE.DirectionalLight(0xfff6e6, 3.4);            // warm, and deliberately over-driven
key.position.set(210, 250, 380);
scene.add(key);

const fill = new THREE.DirectionalLight(VIOLET, 0.55);            // the lavender mass, far weaker
fill.position.set(-320, 90, 140);
scene.add(fill);

const rim = new THREE.DirectionalLight(SIGNAL, 0.30);             // keeps far edges off the fog
rim.position.set(-180, 140, -300);
scene.add(rim);

/* THE BLOWN SOURCE ITSELF, as visible geometry.
   A DirectionalLight has no body — it can light a surface but can never put a
   clipped white pixel in the frame. The reference's whole read comes from the
   source being IN SHOT and overexposed. These stacked additive sprites are that
   body: three coincident layers so the core saturates past 1.0 and reads as
   genuine blowout rather than a grey disc. */
const flare = new THREE.Group();
for (const [scale, opacity] of [[300, 0.95], [520, 0.5], [900, 0.22]]) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: SPRITE, color: 0xfff4e2, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    // toneMapped:false — MEASURED, capture 3: value gate reached max=240 with
    // near-white 0.000%. ACESFilmicToneMapping was the last 15 points: its whole
    // purpose is to roll highlights off smoothly, so it asymptotes and NEVER
    // returns 255. The curve designed to prevent blowout was suppressing the one
    // blowout the reference is built on. Bypassing it for the source only keeps
    // ACES doing its real job on every lit surface.
    toneMapped: false
  }));
  s.scale.set(scale, scale, 1);
  flare.add(s);
}
scene.add(flare);

/* ═════════ THE DESCENT ════════════════════════════════════════════════════
   One scalar, t ∈ [0,1], drives everything. Scale bands are keyframes on that
   single axis, so the fall is genuinely continuous — no scene swaps, no
   teleports, no loading seam between "levels". */
const BANDS = [
  { t:0.00, name:'Space',       unit:'400 000 km', y:1180, z:1500, look:  260 },
  { t:0.34, name:'Orbit',       unit:'  1 200 km', y: 420, z: 640, look:   40 },
  { t:0.58, name:'Sky',         unit:'      9 km', y: 165, z: 250, look:   10 },
  // Street pulled UP and BACK. The first capture put the camera at y=26, z=74 —
  // INSIDE the tower field, so the skyline filled the left edge and 60% of the
  // frame was empty. From 96/430 the city reads as a skyline against sky, and
  // the lit-pixel width lands near the 0.45 the reference bar asks for.
  { t:0.78, name:'Street',      unit:'     40  m', y:  96, z: 430, look:   48 },
  { t:1.00, name:'Underground', unit:'   −980  m', y:-560, z:  54, look:-640 }
];

/* Deep-link any depth: ?t=0.78 or #street. Two reasons this exists —
   a scale band is shareable as a URL, and every band becomes independently
   capturable for the screenshot gate (a scene you can only reach by scrolling
   is a scene you cannot verify). */
function initialDepth() {
  const q = new URLSearchParams(location.search).get('t');
  if (q !== null && !Number.isNaN(parseFloat(q))) {
    return Math.min(1, Math.max(0, parseFloat(q)));
  }
  const h = location.hash.replace('#', '').toLowerCase();
  const hit = BANDS.find(b => b.name.toLowerCase() === h);
  return hit ? hit.t : 0;
}
let t = initialDepth(), tGoal = t;

const $name = document.getElementById('sName');
const $unit = document.getElementById('sUnit');
const $out  = document.getElementById('readout');

const ladder = document.getElementById('ladder');
BANDS.forEach((b, i) => {
  const el = document.createElement('button');
  el.className = 'rung';
  el.innerHTML = `<i></i>${b.name}`;
  el.addEventListener('click', () => { tGoal = b.t; });
  ladder.appendChild(el);
  b.el = el;
});

addEventListener('wheel', e => {
  tGoal = Math.min(1, Math.max(0, tGoal + e.deltaY * 0.00045));
}, { passive:true });

let dragging = false, lastY = 0;
addEventListener('pointerdown', e => { dragging = true; lastY = e.clientY; });
addEventListener('pointerup',   () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  tGoal = Math.min(1, Math.max(0, tGoal + (lastY - e.clientY) * 0.0016));
  lastY = e.clientY;
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown') tGoal = Math.min(1, tGoal + 0.06);
  if (e.key === 'ArrowUp'   || e.key === 'PageUp')   tGoal = Math.max(0, tGoal - 0.06);
});

const smooth = x => x*x*(3 - 2*x);   // smoothstep, so band edges never snap

function sample(u) {
  let i = 0;
  while (i < BANDS.length - 2 && u > BANDS[i+1].t) i++;
  const a = BANDS[i], b = BANDS[i+1];
  const k = smooth(Math.min(1, Math.max(0, (u - a.t) / (b.t - a.t))));
  return {
    y:    a.y    + (b.y    - a.y   )*k,
    z:    a.z    + (b.z    - a.z   )*k,
    look: a.look + (b.look - a.look)*k,
    band: k < 0.5 ? a : b
  };
}

const clock = new THREE.Clock();
let active = null;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);

  t += (tGoal - t) * Math.min(1, dt * 2.6);      // inertia — a hard cut feels cheap

  const s = sample(t);
  const drift = clock.elapsedTime * 0.045;
  camera.position.set(Math.sin(drift) * s.z * 0.16, s.y, s.z);
  camera.lookAt(0, s.look, 0);

  // Fog thickens as you descend — haze is the single strongest depth cue here.
  // Ceiling lowered from 0.0075: at street level the old value put density near
  // 0.0057, which ate every additive highlight before it reached the lens and
  // is why capture 2 still had no white in it.
  scene.fog.density = 0.0006 + Math.pow(t, 2.1) * 0.0026;

  // Park the blown source off to the right and slightly high, so it sits IN
  // FRAME and the subject is read against it — the reference's whole structure.
  // It rides the band scale so the source stays proportionate as we descend.
  flare.position.set(s.z * 0.62, s.y + s.z * 0.30, -s.z * 0.55);
  const fs = 0.5 + s.z / 700;
  flare.scale.setScalar(Math.max(0.28, fs));

  // Cross-fade the layers rather than toggling them; a popped layer reads as a bug.
  space.visible = t < 0.62;
  limb.visible  = t < 0.74;
  earth.visible = t > 0.30;
  under.visible = t > 0.62;

  space.rotation.y = clock.elapsedTime * 0.006;
  under.rotation.y = clock.elapsedTime * 0.021;

  if (active !== s.band) {
    active = s.band;
    $name.textContent = s.band.name;
    $unit.textContent = s.band.unit;
    BANDS.forEach(b => b.el.dataset.on = (b === s.band) ? '1' : '0');
  }
  $out.textContent = 'depth ' + (t*100).toFixed(1) + '%';

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

frame();
requestAnimationFrame(() => { document.getElementById('veil').style.opacity = '0'; });
</script>
