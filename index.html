  <style>
    :root {
      --ink: #dffbe9;
      --accent: #3cff96;
      --alert: #ff4a4a;
      --dim: rgba(223, 251, 233, 0.45);
      --faint: rgba(223, 251, 233, 0.12);
      --bg: #000100;
      --panel: rgba(5, 12, 8, 0.55);
      --border: rgba(60, 255, 150, 0.15);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      height: 100%; 
      background: var(--bg); 
      overflow: hidden; /* Native scroll is handled by the main container */
      font-family: 'Inter', sans-serif; 
      -webkit-font-smoothing: antialiased;
    }
    
    /* The 3D Environment sits purely in the background */
    #gl-canvas { 
      display: block; 
      position: fixed; 
      inset: 0; 
      outline: none; 
      z-index: 0; 
      pointer-events: none;
    }

    /* Ambient dark vignette so text pops over the plasma */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0,1,0,0.14) 0%, rgba(0,1,0,0.10) 30%, rgba(0,1,0,0.88) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* --- NATIVE UI OVERLAY --- */
    #ui-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-top: 90px; /* Space for fixed nav */
      padding-bottom: 100px;
    }

    /* Hide scrollbar for clean look */
    #ui-layer::-webkit-scrollbar { display: none; }
    #ui-layer { scrollbar-width: none; }

    /* Top Sticky Navigation */
    #top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      gap: 10px;
      padding: 20px 24px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: linear-gradient(to bottom, rgba(0,1,0,0.95) 0%, rgba(0,1,0,0.4) 60%, transparent 100%);
      pointer-events: auto;
    }
    #top-nav::-webkit-scrollbar { display: none; }

    .nav-pill {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-pill:hover {
      background: rgba(60, 255, 150, 0.05);
      color: #fff;
    }

    .nav-pill.active {
      background: rgba(60, 255, 150, 0.15);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(60, 255, 150, 0.1);
    }

    /* Content Layout */
    .content-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section {
      margin-bottom: 80px;
      scroll-margin-top: 120px; /* Offset for sticky nav when anchor jumping */
    }

    h2 {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 22px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h2 .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--accent);
      background: rgba(60, 255, 150, 0.05);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(60, 255, 150, 0.15);
      text-transform: uppercase;
      margin-left: auto;
    }

    .card-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 14, 12, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 24px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.01em;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      position: relative;
    }

    .link-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-card .left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .link-card .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .link-card .link-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s;
    }

    .link-card .right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .link-card .meta-hash {
      opacity: 0.6;
    }

    .link-card svg {
      opacity: 0.3;
      transition: all 0.3s ease;
      transform: translateX(-4px);
    }

    .link-card:hover, .link-card:active {
      transform: translateY(-2px);
      background: rgba(15, 22, 18, 0.7);
      border-color: rgba(60, 255, 150, 0.2);
      border-top-color: rgba(60, 255, 150, 0.4);
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(60, 255, 150, 0.05) inset;
    }

    .link-card:hover::before, .link-card:active::before {
      opacity: 1;
      box-shadow: 0 0 15px var(--accent);
    }

    .link-card:hover .status-dot {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .link-card:hover .link-text {
      color: #fff;
    }

    .link-card:hover .right {
      color: rgba(255, 255, 255, 0.6);
    }

    .link-card:hover svg {
      opacity: 1;
      color: var(--accent);
      transform: translateX(0);
    }

    /* Real state: page published in the last 48h */
    .link-card.fresh .status-dot {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(60, 255, 150, 0.6);
    }

    /* Real state: curated path with no page on disk — shown, never hidden */
    .link-card.dead {
      cursor: default;
      opacity: 0.4;
      border-color: rgba(255, 74, 74, 0.15);
    }
    .link-card.dead .status-dot { background: var(--alert); }
    .link-card.dead .meta-hash  { color: var(--alert); opacity: 0.8; }
    .link-card.dead:hover {
      transform: none;
      background: rgba(10, 14, 12, 0.5);
      border-color: rgba(255, 74, 74, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .link-card.dead:hover::before { opacity: 0; }
    .link-card.dead svg { opacity: 0.15; }

    @media (max-width: 600px) {
      #top-nav { padding: 16px; gap: 8px; }
      .nav-pill { padding: 8px 14px; font-size: 10px; }
      .content-container { padding: 0 16px; }
      .link-card { padding: 16px; font-size: 14px; }
      .link-card .meta-hash { display: none; }
      section { margin-bottom: 60px; }
    }

        const tip  = l.t ? ` title="${l.t.replace(/"/g,'&quot;')}"` : '';
        return `
        <${tag} ${attr}${tip} class="link-card${dead ? ' dead' : ''}${l.f ? ' fresh' : ''}">
          <div class="left">
            <div class="status-dot"></div>
            <span class="link-text">${l.p}</span>
          </div>
          <div class="right">
            <span class="meta-hash">${l.m}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </div>
        </${tag}>
        `;
      }).join('')}
    </div>
  `;
  container.appendChild(section);
});

// --- SCROLL SPY (Active Nav State) ---
const observerOptions = {
  root: document.getElementById('ui-layer'),
  rootMargin: '-20% 0px -75% 0px', // Triggers when section enters upper middle viewport
  threshold: 0
};

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      // Update Pills
      document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
      const activePill = document.querySelector(`.nav-pill[data-target="${entry.target.id}"]`);
      if (activePill) {
        activePill.classList.add('active');
        // Center the pill by scrolling ONLY the nav. scrollIntoView() would also
        // scroll #ui-layer (its scrollable ancestor) and yank the page on load.
        topNav.scrollTo({
          left: activePill.offsetLeft - (topNav.clientWidth - activePill.offsetWidth) / 2,
          behavior: 'smooth'
        });
      }
    }
  });
}, observerOptions);

document.querySelectorAll('section').forEach(sec => observer.observe(sec));
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { RGBShiftShader }  from 'three/addons/shaders/RGBShiftShader.js';

const canvas = document.getElementById('gl-canvas');
const scene = new THREE.Scene(); 
scene.fog = new THREE.FogExp2(0x000100, 0.001);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 8000); 
// Pull camera back so we can see the core clearly behind the UI
camera.position.z = 600;

const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const composer = new EffectComposer(renderer); 
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.05, 0.8, 0.2);
composer.addPass(bloomPass);

// Subtle chromatic aberration
const rgbPass = new ShaderPass(RGBShiftShader);
rgbPass.uniforms['amount'].value = 0.0008;
rgbPass.uniforms['angle'].value = Math.PI * 0.5;
composer.addPass(rgbPass);

const ophanim = new THREE.Group(); 
scene.add(ophanim);

const coreGeometry = new THREE.IcosahedronGeometry(220, 48); // Restored original scale
const plasmaUniforms = { t: { value: 0 }, energy: { value: 0 }, morph: { value: 1 } };
const plasmaMaterial = new THREE.ShaderMaterial({
  uniforms: plasmaUniforms, transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `
    varying vec3 vPos; varying vec3 vNormal;
    uniform float t; uniform float energy;
    
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float snoise(vec3 v){ 
      const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
      const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy) );
      vec3 x0 = v - i + dot(i, C.xxx) ;
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min( g.xyz, l.zxy );
      vec3 i2 = max( g.xyz, l.zxy );
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod(i, 289.0 ); 
      vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
      float n_ = 0.142857142857; vec3  ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z *ns.z); vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_ );    
      vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4( x.xy, y.xy ); vec4 b1 = vec4( x.zw, y.zw ); vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0)); vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
      vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
      return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
    }

    void main() {
      vNormal = normalize(normalMatrix * normal);
      float time = t * 2.0;
      float n = snoise(position * 0.012 - time);
      float n2 = snoise(position * 0.03 + time * 0.8);
      float spike = pow(max(0.0, n), 5.0) * 450.0 * (0.5 + energy * 2.5);
      vec3 pos = (position * 0.05) + normal * (spike + n2 * 10.0);
      vPos = pos;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPos; varying vec3 vNormal;
    uniform float t; uniform float energy; uniform float morph;

    float hash(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
    float noise(vec3 x) { vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y), mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z); }

    void main() {
      float dist = length(vPos) / 220.0;
      vec3 v = normalize(vPos);
      float n1 = noise(v * 6.0 + vec3(0.0, t * 4.0, t * 2.0));
      float n2 = noise(v * 12.0 - vec3(t * 3.0, 0.0, t * 4.0));
      float veins = abs(sin((n1 + n2) * 20.0));
      veins = smoothstep(0.97, 1.0, 1.0 - veins);
      
      float activity = veins * (1.0 + energy * 3.0);
      if (activity < 0.02) discard; 
      
      vec3 lightningGreen = vec3(0.0, 0.85, 0.35); 
      vec3 coreHot = vec3(0.4, 1.0, 0.6); 
      vec3 color = mix(lightningGreen, coreHot, clamp(activity - 0.5, 0.0, 1.0));
      
      float orbW = max(0.0, 1.0 - abs(morph - 1.0));
      float alpha = activity * orbW;
      alpha *= smoothstep(2.0, 0.2, dist); 
      
      gl_FragColor = vec4(color, alpha);
    }
  `
});

const plasmaCore = new THREE.Mesh(coreGeometry, plasmaMaterial);
ophanim.add(plasmaCore);

{ 
  const NP = 2500, p = new Float32Array(NP*3), s = new Float32Array(NP), ph = new Float32Array(NP);
  for(let i=0; i<NP; i++) { 
    const r = 1200 + Math.random()*2000, th = Math.random()*Math.PI*2, pp = Math.acos(2*Math.random()-1);
    p[i*3] = r*Math.sin(pp)*Math.cos(th); p[i*3+1] = r*Math.sin(pp)*Math.sin(th); p[i*3+2] = r*Math.cos(pp);
    s[i] = Math.random()*2.0 + 0.5; ph[i] = Math.random()*Math.PI*2; 
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('asize', new THREE.BufferAttribute(s, 1));
  g.setAttribute('aph', new THREE.BufferAttribute(ph, 1));
  
  const world = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { t: {value:0}, warp: {value:0} },
    vertexShader: `
      attribute float asize; attribute float aph; uniform float t; uniform float warp; varying float vo;
      void main(){ 
        vec3 q = position;
        q.y += sin(t * 0.5 + aph) * 50.0;
        vec4 mv = modelViewMatrix * vec4(q, 1.0);
        vo = 0.1 + 0.15 * sin(t * 0.8 + aph);
        gl_PointSize = asize * (400.0 / -mv.z) * (1.0 + warp); 
        gl_Position = projectionMatrix * mv; 
      }`,
    fragmentShader: `
      varying float vo; 
      void main(){ 
        vec2 d = gl_PointCoord - 0.5;
        if(length(d) > 0.5) discard; 
        gl_FragColor = vec4(0.23, 1.0, 0.58, exp(-dot(d,d)*12.0) * vo); 
      }`
  }));
  scene.add(world); 
  window.worldDust = world;
}

const uiLayer = document.getElementById('ui-layer');
const S = { 
  time: 0, 
  scrollVel: 0, 
  lastScroll: 0,
  fx: 0, fy: 0 
};

uiLayer.addEventListener('scroll', () => {
  const currentScroll = uiLayer.scrollTop;
  // Calculate instantaneous velocity
  const rawVel = Math.abs(currentScroll - S.lastScroll);
  // Cap it so aggressive flings don't break the shader
  S.scrollVel = Math.min(rawVel * 0.1, 3.0); 
  S.lastScroll = currentScroll;
}, { passive: true });

function handleMouseMove(e) {
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  S.fx = (x / innerWidth) * 2 - 1;
  S.fy = -(y / innerHeight) * 2 + 1;
}
window.addEventListener('mousemove', handleMouseMove, { passive: true });
window.addEventListener('touchmove', handleMouseMove, { passive: true });

function frame() {
  requestAnimationFrame(frame); 
  S.time += 0.016;

  // Physics Decay
  S.scrollVel *= 0.92; 
  const energy = Math.min(S.scrollVel * 0.5, 1.5); // Bound the energy

  // Parallax the camera based on scroll position (moves slightly up/down)
  const maxScroll = Math.max(1, uiLayer.scrollHeight - window.innerHeight);
  const scrollFraction = uiLayer.scrollTop / maxScroll;
  const targetCamY = (S.fy * 30) + (scrollFraction * -80 + 40); // Shift down as you scroll down
  
  camera.position.x += ((S.fx * 30) - camera.position.x) * 0.05;
  camera.position.y += (targetCamY - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);

  // Rotate Core (Base spin + Scroll velocity)
  ophanim.rotation.y -= 0.003 + (S.scrollVel * 0.005);
  ophanim.rotation.x += 0.001 + (S.scrollVel * 0.002);
  
  // Update Shader Uniforms
  plasmaMaterial.uniforms.t.value = S.time;
  plasmaMaterial.uniforms.energy.value = energy;

  if (window.worldDust) {
    window.worldDust.material.uniforms.t.value = S.time;
    window.worldDust.material.uniforms.warp.value = energy * 0.5;
  }

  // Reactive Post-Processing
  bloomPass.strength = 0.85 + (energy * 0.5);
  rgbPass.uniforms['amount'].value = 0.0005 + (energy * 0.001); 

  composer.render();
}
frame();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; 
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); 
  composer.setSize(innerWidth, innerHeight);
});
</script>
