<!--
  ============================================================================
  THIS IS A FORWARDER, NEVER A COPY. One avatar, one origin, zero drift.
  ============================================================================
  Replaced 2026-08-26 05:06. The 116,343-byte build that stood here is at
  git 0992cc8 and is recoverable; nothing was deleted, it was superseded.

  WHY — qi, all day 2026-08-25/26, and he was right every time:
      "Can you fix my avatars, please?"     "they all are the same"
      "are the avatar versions done?"       "You made my avatar look fake."
      "I gave you hours earlier today and I checked and it didnt really change"
      "when I went through the chips, nothing about the avatar changed"

  THE CAUSE, MEASURED. This fork had ORB_PRESETS = ZERO. Its shader constants
  were hardcoded literals equal to canonical's 'dense' preset, so there was
  exactly ONE look baked in. The chips rendered and clicking them could not
  change anything, because there was nothing to switch to. He was opening THIS
  file. That is the whole of "they all are the same."

  CANONICAL — https://life.xlrd.org/aether/ , 158,180 B — carries 5 presets in
  ORB_ORDER: liquid, glass, crystal, dense, ghost. Pixel-verified distinct by
  an independent browser on 2026-08-26, mean-abs-difference vs dense:
      liquid  1.7978  27.92% of pixels differ
      crystal 1.6852  25.28%
      glass   1.6014  24.23%
      ghost   1.5133  20.61%
      noise floor (dense captured twice) 0.0039 / 0.01%
  dense IS ORB_DEFAULT, so ?v=dense and no-param are the same render.

  SAFE TO FORWARD — audited before replacing, not assumed. Canonical is a
  STRICT FUNCTIONAL SUPERSET of this fork:
    · two-finger pinch dolly — present, line-for-line identical, down to the
      "// re-baseline, never jump" comment
    · press-and-hold travel  — present both sides
    · GIF frame decoding     — canonical has THREE paths incl. a pure-JS GIF89a
      decoder; this fork had only ImageDecoder, which does not exist on
      Safari/iOS, i.e. it was already dead on his phone
    · the gesture-ownership anti-regression guard from commit e017a0b exists
      ONLY in canonical — more of it than in the fork that claims to restore it
    · the only fork-only executable code was an 8-line ?mass=/?carve= reader,
      reproduced by canonical's orbUrlOverride() with byte-identical defaults
      (canonical 'dense' = mass 1.45 / carve 0.28 = the fork's own defaults)

  TWO DELTAS CARRIED FORWARD DELIBERATELY, neither a lost feature:
    1. data-orb-mass / data-orb-carve were fork-only DOM attributes. Canonical
       exposes the same numbers inside data-orb-params (JSON). Any verify rig
       keyed on data-orb-mass must be repointed at data-orb-params.
    2. Clamp ranges differ: fork carve ceiling 2.00 vs canonical 1.6, fork mass
       floor 0.50 vs canonical 0.25. A saved ?carve=1.8 link will render
       differently than it did here.

  THE FORWARD PRESERVES SEARCH AND HASH, so every dial he has ever saved keeps
  working across the crossing: ?v=liquid, ?mass=1.6, ?carve=0.4, #anything.
  JS first (keeps query+hash); meta-refresh is the no-JS fallback.
-->
