<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XENOS — orb variations</title>
<meta name="description" content="Every XENOS orb variation, live and animated, on hitthe.link's own tokens. One is on the root page right now.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --jade:#00ff44; --jade-d:#07C42C; --ink:#000;
  --w-06:rgba(255,255,255,.06); --w-10:rgba(255,255,255,.10); --w-16:rgba(255,255,255,.16);
  --w-30:rgba(255,255,255,.30); --w-42:rgba(255,255,255,.42); --w-58:rgba(255,255,255,.58);
  --w-72:rgba(255,255,255,.72); --steel:#c4c4c4;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html{background:#000;-webkit-text-size-adjust:100%}
body{background:#000;color:var(--w-72);font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:
    radial-gradient(760px 420px at 50% -8%, rgba(0,255,68,.10), transparent 62%),
    radial-gradient(900px 700px at 50% 118%, rgba(7,196,44,.05), transparent 62%);
}
::selection{background:var(--jade);color:#000}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

header{padding:72px 0 30px;text-align:center}
.eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--jade);opacity:.85}
h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:900;letter-spacing:-.035em;line-height:1;margin:16px 0 0;color:#fff}
h1 i{font-style:italic;font-weight:800;background:linear-gradient(110deg,#eaffe4,var(--jade) 48%,#8dff6a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(0,255,68,.5))}
.rule{height:1px;max-width:340px;margin:20px auto 0;
  background:linear-gradient(90deg,transparent,var(--jade-d),#8dff6a,var(--jade-d),transparent);
  box-shadow:0 0 14px rgba(0,255,68,.3)}
.lede{max-width:560px;margin:16px auto 0;font-size:.95rem;line-height:1.65;color:var(--w-42);font-weight:300}

.bar{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:30px 0 8px}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;border:1px solid var(--w-10);color:var(--w-58);
  background:rgba(239,239,239,.05);cursor:pointer;transition:.16s;user-select:none}
.pill:hover{color:#8dff6a;border-color:rgba(0,255,68,.32)}
.pill.on{color:#031206;background:linear-gradient(180deg,#a8ff8a,var(--jade) 55%,var(--jade-d));
  border-color:transparent;font-weight:700;box-shadow:0 0 18px rgba(0,255,68,.34)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px;margin:34px 0 20px}
.card{position:relative;border:1px solid var(--w-10);border-radius:14px;padding:26px 18px 18px;
  background:linear-gradient(168deg,#0b0e0c,#060706);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(0,255,68,.06),0 16px 40px rgba(0,0,0,.6);transition:.2s}
.card:hover{border-color:rgba(0,255,68,.30);transform:translateY(-2px)}
.card::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;
  background:linear-gradient(90deg,transparent,#8dff6a,transparent);opacity:.4}
.card.is-live{border-color:rgba(0,255,68,.42);box-shadow:inset 0 1px 0 rgba(0,255,68,.12),0 0 40px rgba(0,255,68,.10),0 16px 40px rgba(0,0,0,.6)}
.tag{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#031206;background:var(--jade);padding:3px 7px;border-radius:999px;font-weight:700}
.stage{display:flex;align-items:center;justify-content:center;height:150px}
.n{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--w-30);text-align:center;margin-top:6px}
.t{font-size:.95rem;font-weight:600;color:var(--steel);text-align:center;margin-top:9px;letter-spacing:-.01em}
.d{font-size:.72rem;line-height:1.55;color:var(--w-42);text-align:center;margin-top:6px;font-weight:300;
  min-height:2.4em;padding:0 4px}

footer{padding:44px 0 70px;text-align:center}
.f1{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--w-30)}
.f1 em{color:var(--jade);font-style:normal}
.f1 a{color:#8dff6a;text-decoration:none}
.f1 a:hover{color:#eaffe4}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:600px){header{padding:48px 0 22px}.stage{height:132px}}

/* ── shared motion vocabulary ───────────────────────────────────────────── */
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes band{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes orbit{from{transform:rotate(-22deg)}to{transform:rotate(338deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-200}}
@keyframes wob{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.03)}}
.o-body{animation:breathe 5.2s ease-in-out infinite;transform-origin:60px 60px}
.o-b1{animation:band 7.4s ease-in-out infinite}
.o-b2{animation:band 5.9s ease-in-out infinite reverse}
.o-b3{animation:band 8.8s ease-in-out infinite}
.o-orbit{animation:orbit 34s linear infinite;transform-origin:60px 60px}
.o-spin{animation:spin 26s linear infinite;transform-origin:60px 60px}
.o-spinr{animation:spinr 17s linear infinite;transform-origin:60px 60px}
.o-fast{animation:spin 9s linear infinite;transform-origin:60px 60px}
.o-pulse{animation:pulse 3.4s ease-in-out infinite}
.o-dash{animation:dash 18s linear infinite}
.o-wob{animation:wob 11s ease-in-out infinite;transform-origin:60px 60px}
svg{display:block;overflow:visible}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">HITTHE.LINK · XENOS</div>
    <h1>Orb <i>Variations</i></h1>
    <div class="rule"></div>
    <p class="lede">Every direction for the XENOS mark, live and animated, drawn on the root page's own tokens. One of them is on hitthe.link right now — it is tagged.</p>
    <div class="bar" id="bar"></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="f1">forged by <em>Xen</em> · East Allen · <a href="/">hitthe.link</a> · <a href="/xenos/">/xenos</a></div>
  </footer>
</div>

<script>
/* Shared paint. Every variation draws in a 120x120 box so the ramp is honest —
   the shipped mark is this geometry scaled to 48. */
const DEFS = `
<defs>
  <radialGradient id="g-core" cx="38%" cy="34%" r="72%">
    <stop offset="0%" stop-color="#eaffe4"/><stop offset="26%" stop-color="#8dff6a"/>
    <stop offset="58%" stop-color="#07C42C"/><stop offset="100%" stop-color="#05270a"/>
  </radialGradient>
  <radialGradient id="g-halo" cx="50%" cy="50%" r="50%">
    <stop offset="55%" stop-color="#00ff44" stop-opacity="0"/>
    <stop offset="82%" stop-color="#00ff44" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#00ff44" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g-hot" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="18%" stop-color="#eaffe4"/>
    <stop offset="46%" stop-color="#00ff44"/><stop offset="100%" stop-color="#031206"/>
  </radialGradient>
  <radialGradient id="g-cold" cx="42%" cy="30%" r="76%">
    <stop offset="0%" stop-color="#d8ffcb"/><stop offset="40%" stop-color="#07C42C"/>
    <stop offset="100%" stop-color="#000"/>
  </radialGradient>
  <clipPath id="c-sph"><circle cx="60" cy="60" r="34"/></clipPath>
</defs>`;

/* latitude bands, clipped to the sphere — the ORB_BAND signature */
function bands(op){
  op = op || 1;
  return `<g clip-path="url(#c-sph)" fill="none" stroke="#d8ffcb" stroke-linecap="round" opacity="${op}">
    <ellipse class="o-b1" cx="60" cy="45.5" rx="33" ry="8.7" stroke-opacity=".55" stroke-width="1.5"/>
    <ellipse class="o-b2" cx="60" cy="60"   rx="34" ry="11.5" stroke-opacity=".78" stroke-width="1.8"/>
    <ellipse class="o-b3" cx="60" cy="74.5" rx="33" ry="8.7" stroke-opacity=".45" stroke-width="1.5"/>
  </g>`;
}
const LIMB = `<circle cx="60" cy="60" r="34" fill="none" stroke="#b6ff9c" stroke-opacity=".72" stroke-width="1.6"/>`;
const HALO = `<circle cx="60" cy="60" r="55" fill="url(#g-halo)"/>`;

const V = [
  { id:'shipped', live:true, group:'orb', t:'Plasma Orb', d:'Gradient body, hard limb, three latitude bands, one tilted orbit arc. This is on the root now.',
    svg:`${HALO}<circle class="o-body" cx="60" cy="60" r="34" fill="url(#g-core)"/>${bands()}${LIMB}
      <ellipse class="o-orbit" cx="60" cy="60" rx="52" ry="19" fill="none" stroke="#00ff44" stroke-opacity=".5" stroke-width="1.6" stroke-dasharray="2.5 8.5" stroke-linecap="round"/>` },

  { id:'core', group:'orb', t:'Hot Core', d:'White-hot centre falling to black. Reads as energy rather than a body.',
    svg:`${HALO}<circle class="o-body" cx="60" cy="60" r="34" fill="url(#g-hot)"/>${bands(.5)}${LIMB}` },

  { id:'naked', group:'orb', t:'Naked Body', d:'No bands, no arc. The sphere alone — the quietest possible mark.',
    svg:`${HALO}<circle class="o-body" cx="60" cy="60" r="34" fill="url(#g-core)"/>${LIMB}` },

  { id:'banded', group:'orb', t:'Band Heavy', d:'Seven latitudes instead of three. The spectrum written across the whole body.',
    svg:`${HALO}<circle class="o-body" cx="60" cy="60" r="34" fill="url(#g-cold)"/>
      <g clip-path="url(#c-sph)" fill="none" stroke="#d8ffcb" stroke-linecap="round">
        <ellipse class="o-b1" cx="60" cy="34" rx="34" ry="4"  stroke-opacity=".30" stroke-width="1.2"/>
        <ellipse class="o-b2" cx="60" cy="43" rx="34" ry="6"  stroke-opacity=".44" stroke-width="1.3"/>
        <ellipse class="o-b3" cx="60" cy="51.5" rx="34" ry="8" stroke-opacity=".58" stroke-width="1.5"/>
        <ellipse class="o-b1" cx="60" cy="60" rx="34" ry="10.5" stroke-opacity=".82" stroke-width="1.9"/>
        <ellipse class="o-b2" cx="60" cy="68.5" rx="34" ry="8" stroke-opacity=".58" stroke-width="1.5"/>
        <ellipse class="o-b3" cx="60" cy="77" rx="34" ry="6"  stroke-opacity=".44" stroke-width="1.3"/>
        <ellipse class="o-b1" cx="60" cy="86" rx="34" ry="4"  stroke-opacity=".30" stroke-width="1.2"/>
      </g>${LIMB}` },

  { id:'ophanim', group:'form', t:'Ophanim', d:'Wheel within a wheel — the FORMS entry /xenos names before ORB.',
    svg:`${HALO}<circle class="o-body" cx="60" cy="60" r="16" fill="url(#g-hot)"/>
      <g class="o-spin"><circle cx="60" cy="60" r="34" fill="none" stroke="#00ff44" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/></g>
      <g class="o-spinr"><ellipse cx="60" cy="60" rx="34" ry="12" fill="none" stroke="#8dff6a" stroke-opacity=".62" stroke-width="1.7" stroke-dasharray="3 7" stroke-linecap="round"/></g>
      <g class="o-spin"><ellipse cx="60" cy="60" rx="12" ry="34" fill="none" stroke="#8dff6a" stroke-opacity=".5" stroke-width="1.7" stroke-dasharray="3 7" stroke-linecap="round"/></g>` },

  { id:'orbital', group:'form', t:'Orbital System', d:'Small body, nested tilted rings carrying satellites. The reference-calibrated marble.',
    svg:`<circle cx="60" cy="60" r="44" fill="url(#g-halo)"/>
      <circle class="o-body" cx="60" cy="60" r="15" fill="url(#g-core)"/>
      <circle cx="60" cy="60" r="15" fill="none" stroke="#b6ff9c" stroke-opacity=".7" stroke-width="1.2"/>
      <g class="o-spin"><ellipse cx="60" cy="60" rx="50" ry="17" fill="none" stroke="#00ff44" stroke-opacity=".34" stroke-width="1.2" transform="rotate(-18 60 60)"/>
        <circle cx="110" cy="60" r="3.2" fill="#eaffe4" transform="rotate(-18 60 60)"/></g>
      <g class="o-spinr"><ellipse cx="60" cy="60" rx="38" ry="13" fill="none" stroke="#8dff6a" stroke-opacity=".42" stroke-width="1.2" transform="rotate(24 60 60)"/>
        <circle cx="22" cy="60" r="2.4" fill="#8dff6a" transform="rotate(24 60 60)"/></g>
      <g class="o-fast"><ellipse cx="60" cy="60" rx="27" ry="9" fill="none" stroke="#d8ffcb" stroke-opacity=".38" stroke-width="1" transform="rotate(-52 60 60)"/>
        <circle cx="87" cy="60" r="1.9" fill="#d8ffcb" transform="rotate(-52 60 60)"/></g>` },

  { id:'wire', group:'form', t:'Wireframe', d:'Latitude and longitude only. No fill — a globe drawn in jade line.',
    svg:`${HALO}<circle cx="60" cy="60" r="34" fill="#04140a"/>
      <g fill="none" stroke="#00ff44" stroke-opacity=".55" stroke-width="1.15" clip-path="url(#c-sph)">
        <ellipse class="o-b1" cx="60" cy="43" rx="34" ry="9"/>
        <ellipse class="o-b2" cx="60" cy="60" rx="34" ry="13"/>
        <ellipse class="o-b3" cx="60" cy="77" rx="34" ry="9"/>
        <ellipse cx="60" cy="60" rx="9" ry="34"/><ellipse cx="60" cy="60" rx="20" ry="34"/>
        <ellipse cx="60" cy="60" rx="30" ry="34"/>
      </g>${LIMB}` },

  { id:'shatter', group:'form', t:'Shatter', d:'The shapeshift caught mid-break — the body coming apart into the FORM state.',
    svg:`${HALO}<circle class="o-body" cx="60" cy="60" r="34" fill="url(#g-core)" opacity=".82"/>
      <g class="o-wob" fill="none" stroke="#eaffe4" stroke-opacity=".8" stroke-width="1.4" stroke-linecap="round">
        <path d="M60 24 L72 52 L98 60"/><path d="M60 96 L48 68 L22 60"/>
        <path d="M28 34 L56 56"/><path d="M92 86 L64 64"/>
      </g>${LIMB}
      <circle class="o-pulse" cx="60" cy="60" r="6" fill="#ffffff"/>` },

  { id:'ring', group:'ring', t:'Halo Ring', d:'Body dropped to a point; the ring carries the identity.',
    svg:`${HALO}<circle class="o-spin" cx="60" cy="60" r="36" fill="none" stroke="#00ff44" stroke-opacity=".8" stroke-width="3" stroke-dasharray="46 140" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="36" fill="none" stroke="#00ff44" stroke-opacity=".14" stroke-width="3"/>
      <circle class="o-body" cx="60" cy="60" r="9" fill="url(#g-hot)"/>` },

  { id:'legacy', group:'ring', t:'Three Rings (was)', d:'The glyph the header carried before tonight. Hollow — kept here for comparison.',
    svg:`<circle class="o-spin" cx="60" cy="60" r="50" fill="none" stroke="#00ff44" stroke-opacity=".42" stroke-width="4" stroke-dasharray="2.5 7.8" stroke-linecap="round"/>
      <circle class="o-spinr" cx="60" cy="60" r="36" fill="none" stroke="#00ff44" stroke-opacity=".62" stroke-width="4.5" stroke-dasharray="2.5 8.5" stroke-linecap="round"/>
      <circle class="o-spin" cx="60" cy="60" r="22" fill="none" stroke="#00ff44" stroke-opacity=".85" stroke-width="4.2" stroke-dasharray="2.5 9" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="10" fill="#0b140e" stroke="#00ff44" stroke-opacity=".55" stroke-width="2.5"/>
      <circle cx="60" cy="60" r="4.2" fill="#00ff44"/>` },

  { id:'comet', group:'ring', t:'Comet Trail', d:'One satellite on a long tilted path, trailing the body it orbits.',
    svg:`${HALO}<circle class="o-body" cx="60" cy="60" r="26" fill="url(#g-core)"/>${LIMB.replace('r="34"','r="26"')}
      <g class="o-fast"><ellipse cx="60" cy="60" rx="52" ry="20" fill="none" stroke="#00ff44" stroke-opacity=".22" stroke-width="1.1" transform="rotate(-20 60 60)"/>
        <path class="o-dash" d="M8 60 A52 20 0 0 1 112 60" fill="none" stroke="#eaffe4" stroke-opacity=".75" stroke-width="2" stroke-dasharray="26 174" stroke-linecap="round" transform="rotate(-20 60 60)"/></g>` },

  { id:'eclipse', group:'orb', t:'Eclipse', d:'Body in shadow with a lit limb. The most restrained of the set.',
    svg:`<circle cx="60" cy="60" r="52" fill="url(#g-halo)" opacity=".7"/>
      <circle class="o-body" cx="60" cy="60" r="34" fill="#020604"/>
      <circle cx="60" cy="60" r="34" fill="none" stroke="#00ff44" stroke-opacity=".95" stroke-width="2.4"/>
      <circle cx="60" cy="60" r="34" fill="none" stroke="#eaffe4" stroke-opacity=".55" stroke-width="1" stroke-dasharray="30 180" stroke-linecap="round" transform="rotate(-38 60 60)"/>
      ${bands(.22)}` }
];

const GROUPS = [
  { id:'all',  label:'All ' + V.length },
  { id:'orb',  label:'Orb' },
  { id:'form', label:'Form' },
  { id:'ring', label:'Ring' }
];

const grid = document.getElementById('grid');
const bar  = document.getElementById('bar');
let active = 'all';

function render(){
  let h = '';
  for (let i = 0; i < V.length; i++){
    const v = V[i];
    if (active !== 'all' && v.group !== active) continue;
    h += '<div class="card' + (v.live ? ' is-live' : '') + '">'
       + (v.live ? '<span class="tag">live now</span>' : '')
       + '<div class="stage"><svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">'
       + DEFS + v.svg + '</svg></div>'
       + '<div class="n">' + String(i + 1).padStart(2, '0') + ' · ' + v.group.toUpperCase() + '</div>'
       + '<div class="t">' + v.t + '</div>'
       + '<div class="d">' + v.d + '</div>'
       + '</div>';
  }
  grid.innerHTML = h;
}

bar.innerHTML = GROUPS.map(function(g){
  return '<span class="pill' + (g.id === 'all' ? ' on' : '') + '" data-g="' + g.id + '">' + g.label + '</span>';
}).join('');

bar.addEventListener('click', function(e){
  const p = e.target.closest('.pill');
  if (!p) return;
  active = p.dataset.g;
  [].forEach.call(bar.querySelectorAll('.pill'), function(x){ x.classList.toggle('on', x === p); });
  render();
});

render();
</script>
</body>
</html>
