// ── REPLY affordance for inbound (.firehose) bubbles (qi 2026-06-21) ──────────
// Minimal + defensive: a REPLY button reveals an inline composer; SEND POSTs
// {source, chatId, text} to /api/reply, then renders qi's reply as a persistent
// .final bubble (saveHistory) so the thread stays in the pane across reloads.
const REPLY_URL = 'https://xen.xlrd.org/api/reply';
function attachReplyAction(bubbleEl, route) {
  const row = document.createElement('div');
  row.className = 'bubble-actions';
  const replyBtn = document.createElement('button');
  replyBtn.textContent = 'REPLY';
  replyBtn.onclick = (e) => {
    e.stopPropagation();
    if (bubbleEl.querySelector('.reply-box')) return;   // already open
    const box = document.createElement('div');
    box.className = 'reply-box';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Reply to ' + (route.label || 'thread') + '…';
    const send = document.createElement('button');
    send.textContent = 'SEND';
    const doSend = async () => {
      const text = (input.value || '').trim();
      if (!text) return;
      send.disabled = true; send.textContent = '…';
      // FAILSAFE (qi 2026-06-21): if this inbound bubble has no chatId we cannot
      // route an outbound reply — but qi's words must NEVER vanish. Fall back to
      // the proven dictate-inject path with a quoted prefix so the reply still
      // reaches the one brain WITH context (same contract as .xen-reply replies),
      // instead of a silent /api/reply 400. Outbound-to-thread requires chatId.
      if (!route.chatId) {
        try {
          const q = String((bubbleEl.querySelector('.bubble-txt') || {}).textContent || '').replace(/\s+/g, ' ').trim().slice(0, 140);
          const payloadText = 're: "' + q + '" — ' + text;
          const res2 = await fetch(API_URL, {
            method: 'POST', headers: HEADERS,
            // 'xen-vei-typed', not 'xen-vei' — qi 2026-08-10 23:39 "my text from vvsvei is
        // supposed to be tagged typed:". The server tags `typed:` only when the source
        // contains typed/keyboard/text-input; bare 'xen-vei' fell through to `in:`.
        // The main composer already sent 'typed'; these reply boxes did not, so
        // keyboard text arrived looking like dictation.
        body: JSON.stringify({ source: 'xen-vei-typed', ts: Date.now(), text: payloadText })
          });
          if (!res2.ok) throw new Error('inject ' + res2.status);
          box.remove();
          try { const d3 = appendFinal(text, true); if (d3 && typeof attachBubbleActions === 'function') attachBubbleActions(d3, text); } catch (_) {}
          try { saveHistory({ role: 'you', text: payloadText, ts: Date.now() }); } catch (_) {}
        } catch (e3) {
          const err = document.createElement('span'); err.className = 'src';
          err.textContent = 'reply error: ' + (e3 && e3.message ? e3.message : 'no route');
          box.appendChild(err);
          send.disabled = false; send.textContent = 'SEND';
        }
        return;
      }
      try {
        const res = await fetch(REPLY_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: route.source || '', chatId: route.chatId || '', text })
        });
        if (!res.ok) {
          const err = document.createElement('span'); err.className = 'src';
          err.textContent = 'reply failed (' + res.status + ')';
          box.appendChild(err);
          send.disabled = false; send.textContent = 'SEND';
          return;
        }
        // success: render qi's reply as a persistent sent bubble + save to history
        box.remove();
        try { const d2 = appendFinal(text, true); if (d2 && typeof attachBubbleActions === 'function') attachBubbleActions(d2, text); } catch (_) {}
        try { saveHistory({ role: 'you', text: text, ts: Date.now() }); } catch (_) {}
      } catch (e2) {
        const err = document.createElement('span'); err.className = 'src';
        err.textContent = 'reply error: ' + (e2 && e2.message ? e2.message : 'network');
        box.appendChild(err);
        send.disabled = false; send.textContent = 'SEND';
      }
    };
    send.onclick = (ev) => { ev.stopPropagation(); doSend(); };
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); doSend(); } });
    box.appendChild(input); box.appendChild(send);
    bubbleEl.appendChild(box);
    try { input.focus(); } catch (_) {}
  };
  row.appendChild(replyBtn);
  bubbleEl.appendChild(row);
}

// ─── VEI RTC client ─── peer-to-peer voice transport, no Web Speech re-synth
(function veiRTC() {
  if (!('RTCPeerConnection' in window)) return;

  // Role: explicit ?role=broadcast|receive wins; otherwise broadcaster if a
  // non-default audio input ("out" Loopback) is selectable, else receiver.
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  let role = RTC_ROLE_OVERRIDE || (isMobile ? 'receive' : 'broadcast');

  let pc = null;
  let sseEs = null;
  let peerId = Math.random().toString(36).slice(2, 10);
  let remoteAudio = null;

  async function postSignal(type, payload) {
    try {
      await fetch(RTC_SIGNAL_URL, {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify({ room: RTC_ROOM, from: peerId, role, type, payload }),
      });
    } catch (e) { console.warn('[rtc] signal post failed', e); }
  }

  function newPC() {
    const c = new RTCPeerConnection(RTC_ICE);
    c.onicecandidate = (e) => {
      if (e.candidate) postSignal('ice', e.candidate.toJSON());
    };
    c.onconnectionstatechange = () => {
      console.log('[rtc] state', c.connectionState);
    };
    c.ontrack = (e) => {
      if (!remoteAudio) {
        remoteAudio = document.createElement('audio');
        remoteAudio.autoplay = true;
        remoteAudio.playsInline = true;
        remoteAudio.id = 'vei-rtc-audio';
        remoteAudio.style.display = 'none';
        document.body.appendChild(remoteAudio);
      }
      remoteAudio.srcObject = e.streams[0] || new MediaStream([e.track]);
      remoteAudio.play().catch(() => { /* needs gesture; first-tap unlock below */ });
    };
    return c;
  }

  async function attachBroadcasterTracks(c) {
    // Find the Loopback virtual device that carries Mac say audio. qi 2026-05-25
    // canon (canon_stt_vei_inout): system audio routes through "out" Loopback;
    // STT input arrives via "in" Loopback. Try labels in this order:
    //   1. "out" (canon default — system audio bus)
    //   2. "in"  (qi may set output→in during testing, channel still captures)
    //   3. any Loopback / BlackHole virtual device
    //   4. fall back to default mic (worst case, captures room audio)
    // We need an audioinput permission once so labels populate; ask for it.
    try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach(t => t.stop()); } catch (_) {}
    let stream, chosen = null;
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      const inputs = devs.filter(d => d.kind === 'audioinput');
      console.log('[rtc] audioinputs:', inputs.map(d => d.label || '(unlabeled)'));
      chosen =
        inputs.find(d => /^out\b/i.test(d.label)) ||
        inputs.find(d => /^in\b/i.test(d.label)) ||
        inputs.find(d => /loopback|blackhole|virtual/i.test(d.label)) ||
        null;
      const constraints = chosen
        ? { audio: { deviceId: { exact: chosen.deviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false } }
        : { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      console.log('[rtc] broadcasting via:', chosen ? chosen.label : '(default mic)');
    } catch (e) {
      console.warn('[rtc] getUserMedia failed', e); return;
    }
    stream.getAudioTracks().forEach(t => c.addTrack(t, stream));
  }

  async function handleSignal(msg) {
    if (msg.from === peerId) return; // self
    if (!pc) pc = newPC();
    try {
      if (msg.type === 'offer' && role === 'receive') {
        await pc.setRemoteDescription(msg.payload);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        postSignal('answer', answer);
      } else if (msg.type === 'answer' && role === 'broadcast') {
        await pc.setRemoteDescription(msg.payload);
      } else if (msg.type === 'ice' && pc.remoteDescription) {
        await pc.addIceCandidate(msg.payload).catch(() => {});
      } else if (msg.type === 'hello' && role === 'broadcast') {
        // Receiver said hi → make a fresh offer
        await startBroadcast();
      }
    } catch (e) { console.warn('[rtc] signal handle', msg.type, e); }
  }

  async function startBroadcast() {
    if (pc) try { pc.close(); } catch (_) {}
    pc = newPC();
    await attachBroadcasterTracks(pc);
    const offer = await pc.createOffer({ offerToReceiveAudio: false });
    await pc.setLocalDescription(offer);
    postSignal('offer', offer);
  }

  function openSSE() {
    try {
      sseEs = new EventSource(`${RTC_SIGNAL_URL}/sse?room=${encodeURIComponent(RTC_ROOM)}&peer=${peerId}`);
      sseEs.onmessage = (e) => { try { handleSignal(JSON.parse(e.data)); } catch (_) {} };
      sseEs.onerror = () => { setTimeout(openSSE, 3000); };
    } catch (e) { console.warn('[rtc] sse open', e); }
  }

  // Unlock audio playback on first gesture (iOS Safari needs this)
  document.body.addEventListener('click', () => {
    if (remoteAudio) remoteAudio.play().catch(() => {});
  }, { passive: true, once: false });

  // Boot
  openSSE();
  if (role === 'broadcast') {
    // wait a beat for SSE to be ready, then announce and start
    setTimeout(() => { postSignal('hello', {}); startBroadcast(); }, 600);
  } else {
    setTimeout(() => postSignal('hello', {}), 600);
  }

  // Expose for debugging
  window._veiRTC = { get pc(){return pc;}, get role(){return role;}, room: RTC_ROOM, peerId };
})();

  if (!row) return;
  let current = null;

  // The row IS the picker — every voice is always on screen, one tap away, no layer
  // on top of anything (qi: no modals on this interface). Slidable because 12 pills
  // never fit a phone width; scroll-snap so a flick lands on a pill, not between two.
  // #pill-row is the single scrolling row; #voice-pills is just a flat group inside it,
  // so the voice pill and the thread pills read as ONE row and slide together.
  row.style.cssText = ['display:flex', 'gap:6px', 'flex:0 0 auto', 'white-space:nowrap'].join(';');
  const pillRow = document.getElementById('pill-row');
  if (pillRow) {
    pillRow.style.cssText = [
      'display:flex', 'align-items:center', 'gap:6px',
      'overflow-x:auto', 'overflow-y:hidden',
      'scroll-snap-type:x proximity', '-webkit-overflow-scrolling:touch',
      // ⛔ DO NOT ADD A BACKGROUND TO THIS ROW. qi 2026-08-17 03:40:24, immediately
      // after I did exactly that: "NO!!!!!!" → "the menu bar was already perfect".
      // I read his 03:14 "supposed to be black and collapsed" as being about THIS bar
      // and painted it #000 with a pill radius. It was never about the menu bar — his
      // very next message said "i expect to see this in the collapsed black chat
      // bubbles", so BLACK + COLLAPSED describes the TUI STEP BUBBLES, not the rail.
      // Restored byte-for-byte to the values that were here before I touched it.
      'padding:0 4px 6px', 'margin:0 0 2px', 'scrollbar-width:none',
      'flex:0 0 auto', 'white-space:nowrap',
    ].join(';');
  }
  // Hide the scrollbar without killing the scrolling itself.
  if (!document.getElementById('voice-pills-css')) {
    const st = document.createElement('style');
    st.id = 'voice-pills-css';
    st.textContent = '#pill-row::-webkit-scrollbar{display:none}' +
      // The toolbar ships its own `padding:0 4px 8px`; inside the shared row that
      // bottom padding drops its pills off the voice pill's baseline. Flatten it.
      '#pill-row .transcript-toolbar{padding:0;gap:6px;flex:0 0 auto}' +
      '#voice-pills::-webkit-scrollbar{display:none}' +
      '#voice-pills button{scroll-snap-align:center;flex:0 0 auto;border-radius:999px;' +
      'cursor:pointer;white-space:nowrap;font:500 11px/1 -apple-system,system-ui,sans-serif;' +
      'letter-spacing:.2px;padding:6px 11px;transition:background .12s,color .12s,border-color .12s}';
    document.head.appendChild(st);
  }

  // ⛔ RESTORED to its pre-2026-08-17 form. qi 03:40:24: "the menu bar was already
  // perfect". I had changed the selector to button[data-vid] and made this call
  // paintTrigger(), on the reasoning that the trigger was being repainted grey. That
  // reasoning may even be right — it is also a change to a bar he told me was finished,
  // which under cmd 45 makes it a guess dressed as a fix. Appearance goes back exactly
  // as it was; only the POST-assert in pick() (a correctness fix for "every voice is
  // still Hani") is kept, because that one is behavior he explicitly reported broken.
  const paint = () => {
    row.querySelectorAll('button').forEach((b) => {
      const on = b.dataset.vid === current;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.style.background = on ? 'rgba(0,255,136,.18)' : 'rgba(255,255,255,.05)';
      b.style.border = '1px solid ' + (on ? 'var(--accent, #00ff88)' : 'rgba(255,255,255,.14)');
      b.style.color = on ? 'var(--accent, #00ff88)'
        : (b.dataset.paid ? '#f0b57a' : (b.dataset.reader ? '#8b8d94' : '#cfd0d4'));
      if (b.dataset.reader) b.style.textDecoration = 'none';
      b.style.fontWeight = on ? '650' : '500';
    });
  };
  const label = paint;

  // Read the TRUTH from the server, not localStorage. A stale local label is how
  // "I picked a voice" and "I hear a different voice" coexist without a visible bug.
  fetch(VOICE_ID_URL, { cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => { if (j && j.voice_id) { current = j.voice_id; label(); } })
    .catch(() => {});

  // Selecting a voice does BOTH: rewrites the server voice, and speaks a sample
  // INSIDE the tap gesture. The sample is not a nicety — playing audio in the
  // gesture is what unlocks <audio> on iOS, so the tap that picks a voice is also
  // the tap that proves voice-out works on this device.
  // No confirm() for the paid clone either — window.confirm IS a modal. It is marked
  // amber in the row and labelled "PAID" instead; the warning lives in the pill.
  const pick = (v) => {
    // A locked voice must NEVER become the live voice — that would leave qi silent on
    // every reply until someone noticed. Play the sample so he hears WHICH voice it
    // is not, but do not POST it as the server voice.
    if (v.readerOnly) {
      const b = row.querySelector('button[data-vid="' + v.id + '"]');
      if (b) {
        const t = b.textContent;
        b.textContent = 'READER-APP ONLY';
        setTimeout(() => { b.textContent = t; }, 2600);
      }
      return;
    }
    const prev = current;
    current = v.id;
    // Collapse back to the single pill: the tap that picks is the tap that closes.
    if (typeof closeList === 'function') closeList(); else paint();
    // The <audio> element MUST be created inside this tap, not in the .then() —
    // iOS grants playback to an element born of a gesture, and a promise callback
    // is no longer the gesture. Create here, set .src after the POST resolves.
    let a = null;
    try { a = new Audio(); a.setAttribute('playsinline', ''); } catch (_) {}
    try { if (typeof _avaBargeIn === 'function') _avaBargeIn(); } catch (_) {}
    const sample = 'This is ' + v.name.split(' · ')[0] + '.';
    // ORDER MATTERS. /api/tts renders whatever voice.id says at request time, so
    // firing the sample in parallel with the POST is a race the sample can WIN —
    // qi picks Olivier and hears Emily, which is indistinguishable from a broken
    // picker. Await the POST, THEN ask for audio. Cache-bust too: /api/tts keys on
    // voice|rate|text, so identical text could replay the previous voice's clip.
    // ASSERT ON THE BODY, AND REVERT IF THE SWAP DID NOT LAND.
    // qi 2026-08-16, about every voice in the list: "I put it on Arabella, but it was
    // not Arabella … I can put it on Bill, Brian, Daniel, Juniper, Clinton, Alex, its
    // still Hani." This is why. The old chain was `.catch(() => {}).then(play)` — the
    // catch sat BEFORE the then, so a rejected or non-2xx swap was swallowed whole and
    // the sample played anyway. And the sample comes from /api/tts, which renders
    // whatever the SERVER's voice.id says — so a failed swap produced the OLD voice
    // while the pill painted the NEW one as selected. The picker reported success it
    // never had, which is indistinguishable from a picker that does nothing.
    // `prev` was already captured above and then never used: the revert was intended
    // and never wired. Wire it. A 200 is not proof either — confirm the returned
    // voice_id is the one we asked for (cmd: assert on the artifact, not the status).
    const failPill = (why) => {
      current = prev;                          // the UI must show what is ACTUALLY live
      build();
      const t = trigger.textContent;
      trigger.textContent = why;
      trigger.style.background = 'rgba(255,107,90,.16)';
      trigger.style.border = '1px solid var(--bad, #ff6b5a)';
      trigger.style.color = 'var(--bad, #ff6b5a)';
      setTimeout(() => { trigger.textContent = t; paintTrigger(); }, 3200);
    };
    fetch(VOICE_ID_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voice_id: v.id }),
    })
      .then((r) => (r.ok ? r.json().catch(() => ({})) : Promise.reject(new Error('HTTP ' + r.status))))
      .then((j) => {
        // The server is the authority on what is live. If it echoes a different id,
        // the swap did not take — say so instead of playing a sample that lies.
        if (j && j.voice_id && j.voice_id !== v.id) throw new Error('server kept ' + nameOf(j.voice_id));
        if (!a) return;
        // The sample must render on the SAME engine the pick just selected, or Ava
        // would preview in an ElevenLabs voice and burn credits to demo the free one.
        a.src = AVA_TTS_URL + '?text=' + encodeURIComponent(sample)
              + '&engine=' + (v.free ? 'edge' : 'eleven') + '&t=' + Date.now();
        a.play().catch(() => {});
      })
      .catch((e) => { failPill('✕ ' + (e && e.message ? e.message : 'swap failed')); });
  };

  // COLLAPSED BY DEFAULT — qi 2026-08-10 23:21: "voice pills to open up to show the
  // list". ONE pill showing the live voice; tapping it expands the roster INLINE in
  // this same row, still above the bar. Never a layer over the page (no modals here).
  let open = false;
  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.id = 'voice-trigger';

  const nameOf = (id) => {
    const v = VOICES.find((x) => x.id === id);
    return v ? (v.paid ? 'East' : v.name.split(' · ')[0]) : 'Voice';
  };
  const paintTrigger = () => {
    trigger.textContent = (open ? '▾ ' : '▸ ') + nameOf(current);
    trigger.title = 'Xen reader voice: ' + nameOf(current) + ' — tap to ' + (open ? 'close' : 'open') + ' the list';
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    trigger.style.background = 'rgba(0,255,136,.14)';
    trigger.style.border = '1px solid var(--accent, #00ff88)';
    trigger.style.color = 'var(--accent, #00ff88)';
    trigger.style.fontWeight = '650';
  };

  const build = () => {
    row.textContent = '';
    row.appendChild(trigger);
    paintTrigger();
    if (!open) return;
    VOICES.forEach((v) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.dataset.vid = v.id;
      if (v.paid) b.dataset.paid = '1';
      b.textContent = v.paid ? 'East · PAID' : (v.readerOnly ? v.name.split(' · ')[0] + ' ⃰' : v.name.split(' · ')[0]);
      b.title = v.readerOnly
        ? v.name + ' — LOCKED: ElevenLabs licenses this famous voice to the Reader app only; the TTS API returns voice_access_denied. Nothing on our side can unlock it.'
        : v.name;
      if (v.readerOnly) b.dataset.reader = '1';
      b.onclick = () => pick(v);
      row.appendChild(b);
    });
    paint();
  };

  // Picking a voice collapses the list back to the single pill — the tap that chooses
  // is also the tap that closes, so the row never stays fanned open over the bar.
  const closeList = () => { if (open) { open = false; build(); } };

  trigger.onclick = () => { open = !open; build(); if (open) reveal(); };
  build();

  // ─── THE PILL MUST NEVER LIE ABOUT WHAT IS LIVE (qi 2026-08-17) ───────────────
  // "if you make a voice switch, the interface HAS to show that switch. It can't be
  // where if it's a different voice, it doesn't show in the interface. It has to be
  // in sync."
  //
  // The two fetches above only run on LOAD and after HIS OWN tap. So a voice changed
  // server-side — by Xen, by a script, by another device — left the pill painting a
  // voice that was no longer speaking. Same silent-divergence class as the picker
  // that reported a swap it never made: the UI was confident and wrong.
  //
  // Poll the server (the authority) and repaint on CHANGE only. 10s is far below the
  // rate he notices and the response is a few bytes. Repaint is skipped while the
  // list is open so it can never yank the row out from under a tap in progress.
  setInterval(() => {
    if (open) return;
    fetch(VOICE_ID_URL, { cache: 'no-store' })
      .then((r) => r.json())
      .then((j) => {
        if (j && j.voice_id && j.voice_id !== current) {
          current = j.voice_id;
          build();
          console.log('[voice] server-side change -> pill now ' + nameOf(current));
        }
      })
      .catch(() => {});      // a failed poll must never disturb the live surface
  }, 10000);

  // Keep the selected pill in view on load, so qi can SEE which voice is live without
  // sliding to hunt for it.
  const reveal = () => {
    const on = row.querySelector('button[aria-checked="true"]');
    if (on && on.scrollIntoView) { try { on.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (_) {} }
  };
  fetch(VOICE_ID_URL, { cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => { if (j && j.voice_id) { current = j.voice_id; paint(); reveal(); } })
    .catch(() => {});
})();
</script>

<script>
/* ══ INJECT SOURCE PILL — behaviour ══ qi 2026-08-22. Additive; touches no existing
   function. Reads/writes ONE localStorage key and re-applies on every render tick. */
(function(){
  "use strict";
  var KEY="xen.vei.injectSources.v1";
  /* MEASURED rails, 2026-08-22, over 11,979 capture records. label = what he sees,
     tag = the prefix as it actually appears in the feed. `locked` rails cannot be
     switched off — his own words are not hideable. */
  var RAILS=[
    {tag:"typed",  label:"typed",  locked:true,  n:191},
    {tag:"in",     label:"spoken", n:1475},
    {tag:"bee",    label:"bee",    n:6002},
    {tag:"omi",    label:"omi",    n:97},
    {tag:"sms",    label:"sms",    n:19},
    {tag:"notif",  label:"notif",  n:53},
    {tag:"rss",    label:"rss",    n:16},
    {tag:"xen-step",label:"steps", n:443},
    {tag:"XEN-AGENT",label:"agents",n:71},
    {tag:"VEI ATTACH",label:"attach",n:16},
    {tag:"DESK DROP",label:"drops", n:3}
  ];
  var btn=document.getElementById("tb-inject");
  var cnt=document.getElementById("tb-inject-n");
  var wrap=document.getElementById("inject-picker");   /* THEIR mount — see merge note */
  if(!btn||!wrap||!cnt) return;                 /* his DOM changed — do nothing, never throw */

  function load(){
    var off={};
    try{ off=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ off={}; }
    RAILS.forEach(function(r){ if(r.locked) delete off[r.tag]; });   /* locked can never be off */
    return off;
  }
  function save(off){ try{ localStorage.setItem(KEY,JSON.stringify(off)); }catch(e){} }

  function label(){
    var off=load(), on=RAILS.filter(function(r){return !off[r.tag];}).length;
    cnt.textContent=" "+on+"/"+RAILS.length;
    btn.classList.toggle("muting", on<RAILS.length);
  }

  /* Hide rows whose rail is off. NOTHING is removed from the DOM or the store —
     display only, so flipping it back is instant and lossless. */
  /* ⚠️ 2026-08-22 18:23 — THIS FUNCTION FROZE HIS PAGE. Measured by clicking the live
     page over CDP: the click returned "clicked", then the page stopped answering for
     >30s. v1 re-queried the ENTIRE transcript and wrote style.display on every match,
     driven by an UNTHROTTLED MutationObserver on a LIVE SSE feed — so every inbound
     message triggered a full-document walk. He reported it as "injection device list
     did not appear"; the list was fine, the thread was blocked.
     THREE FIXES, all required:
       1. classify each row ONCE and cache it in dataset.xrail — never re-scan text
       2. process ONLY the nodes a mutation actually added, not the whole tree
       3. coalesce bursts through requestAnimationFrame — SSE arrives in clumps

        stream that is not slow, it is a lock. */
  function railOf(el){
    var c=el.dataset?el.dataset.xrail:null;
    if(c) return c==="-"?null:c;
    var rail=el.getAttribute("data-rail");
    if(!rail){
      var t=(el.textContent||"").slice(0,64);
      for(var j=0;j<RAILS.length;j++){
        var tg=RAILS[j].tag;
        if(t.indexOf(tg+":")>-1||t.indexOf("["+tg+"]")>-1){ rail=tg; break; }
      }
    }
    try{ el.dataset.xrail = rail || "-"; }catch(e){}
    return rail;
  }
  function paint(nodes,off){
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(!el||el.nodeType!==1) continue;
      var rail=railOf(el);
      if(rail) el.style.display = off[rail] ? "none" : "";
    }
  }
  var pending=false;
  function apply(scope){
    var off=load();
    if(scope&&scope.length){ paint(scope,off); label(); return; }
    if(pending) return;                        /* coalesce a burst into one pass */
    pending=true;
    var run=function(){
      pending=false;
      /* MEASURED 2026-08-22 18:38 — this selector matched ZERO elements, so the mute
         was cosmetic: chip flipped to .off, label went 11/11 -> 10/11, store wrote
         {"bee":1}, and all 116 messages stayed on screen. A control reporting success
         against its own state instead of the DOM it governs.
         Live tally of #transcript children: final 108 · xen-reply 5 · tui-live 2 ·
         tl-daybreak 1. No [data-rail], no .line, no .msg exist in this app at all.
         SAFE BY CONSTRUCTION: railOf() returns null for a bubble with no rail prefix and
         paint() only touches `if(rail)`, so qi's own untagged words can never be hidden —
         the `typed` lock stays a second belt, not the only one. */
      paint(document.querySelectorAll("#transcript [data-rail], #transcript .line, #transcript .msg, #transcript .final, #transcript .xen-reply, #transcript .tui-live"),load());
      label();
    };
    if(window.requestAnimationFrame) requestAnimationFrame(run); else setTimeout(run,16);
  }

  function build(){
    wrap.textContent="";
    var off=load();
    RAILS.forEach(function(r){
      var b=document.createElement("button");
      b.className="inject-chip"+(off[r.tag]?" off":"")+(r.locked?" locked":"");
      b.type="button";
      b.textContent=r.label+(r.n?" "+r.n:"");
      b.setAttribute("aria-pressed", off[r.tag]?"false":"true");

      if(r.locked){ b.disabled=true; }
      else b.onclick=function(){
        var o=load();
        if(o[r.tag]) delete o[r.tag]; else o[r.tag]=1;
        save(o); build(); apply();
      };
      wrap.appendChild(b);
    });
  }

  /* MERGE NOTE 2026-08-22 17:37 — two seats implemented qi's 17:29 directive in the same
     minute. The OTHER seat's markup landed first (#tb-inject + #inject-picker, styled
     display:none) and is kept; this seat's behaviour was rewired onto it and its own
     duplicate markup excised. Duplicate ids are not a cosmetic problem: getElementById
     returns the FIRST match, so the second button would have been inert markup while the
     JS drove the other one. Their div toggles via style.display, NOT [hidden]. */
  btn.onclick=function(){
    var open=(wrap.style.display==="none"||!wrap.style.display);
    if(open){
      wrap.style.display="flex"; build();
      /* bring it into view — an inline picker in a scrolling row is invisible if it
         opens past the right edge. Two belts: scroll the row, then scroll the node. */
      try{
        var row=document.getElementById("pill-row");
        if(row) row.scrollLeft = Math.max(0, wrap.offsetLeft - 8);

    btn.setAttribute("aria-expanded", open?"true":"false");
  };

    var st=document.createElement("style"); st.id="inject-picker-css";

      "#inject-picker{display:flex;gap:6px;align-items:center;flex:0 0 auto}"+
      "#inject-picker{flex-wrap:nowrap}"+"#inject-picker button{scroll-snap-align:center;flex:0 0 auto;border-radius:999px;"+
        "font:500 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.2px;padding:6px 11px;cursor:pointer;"+
        "background:rgba(255,255,255,.06);color:var(--text,#e8e8e8);"+
        "border:1px solid rgba(255,255,255,.14);white-space:nowrap}"+
      "#inject-picker button.off{opacity:.42;text-decoration:line-through}"+
      "#inject-picker button.locked{opacity:.9;cursor:default;"+
        "border-color:rgba(60,255,150,.45);color:#3cff96}"+
      "#tb-inject.muting{border-color:rgba(60,255,150,.55);color:#3cff96}";
    document.head.appendChild(st);
  }

  label();
  apply();
  /* re-apply after the transcript redraws — no polling gate, just a cheap observer */
  try{
    var tr=document.getElementById("transcript");
    if(tr&&window.MutationObserver) new MutationObserver(function(muts){
      /* only the nodes this mutation ADDED — never the whole tree */
      var added=[];
      for(var i=0;i<muts.length;i++){
        var a=muts[i].addedNodes;
        for(var j=0;j<a.length;j++) if(a[j].nodeType===1) added.push(a[j]);
      }
      if(added.length) apply(added); else apply();
    }).observe(tr,{childList:true,subtree:false});
  }catch(e){}
})();
</script>
<script>
/* ── INJECT PICKER: BRING IT INTO VIEW ─────────────────────────────────────────
   qi 2026-08-22 18:12, measured: "injection device list did not appear."
   He was right and the earlier "11 chips / 11 rails MATCH" was a useless pass —
   it proved the chips EXIST and that display:flex, never that a pixel was on
   screen. getBoundingClientRect against the viewport, at 430x932:

       pill-row      y = 16336        (viewport is 932 tall)
       inject-picker x = 251, w = 1084 inside a 430-wide scroller
       chips on screen: 0 of 11       ← the actual product state

   TWO failures, both fixed here:
     (a) VERTICAL — the row lives ~16,000px down the transcript, so opening the
         picker changed nothing in view. scrollIntoView({block:'nearest'}) on the
         row is enough; 'nearest' will not yank him if it is already visible.
     (b) HORIZONTAL — 1084px of chips in a 430px rail with scrollLeft 0, so even
         at the row the list starts past the fold. scrollIntoView({inline:'start'})
         drives #pill-row's own horizontal scroll to the picker.

   ⛔ addEventListener, NOT btn.onclick. The measured 6-chips-under-an-11/11-label
      defect earlier today was caused by a second block ASSIGNING onclick and
      silently replacing the handler that calls build(). A listener composes; an
      assignment destroys. One writer per behaviour: their block owns open/close
      and the chips, this one owns only "make it visible".
   Runs after their handler on the same click, on the next frame so display has
   already flipped to flex and the rects are real. */
(function(){
  var btn=document.getElementById('tb-inject');
  if(!btn) return;                                   /* markup changed — never throw */
  btn.addEventListener('click', function(){
    requestAnimationFrame(function(){
      var pick=document.getElementById('inject-picker');
      if(!pick) return;
      var open=getComputedStyle(pick).display!=='none';
      if(!open) return;                              /* closing — leave his scroll alone */
      var row=document.getElementById('pill-row');
      try{ if(row) row.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){
           try{ if(row) row.scrollIntoView(false); }catch(_){} }
      try{ pick.scrollIntoView({inline:'start',block:'nearest',behavior:'smooth'}); }catch(e){
           try{ if(row) row.scrollLeft = pick.offsetLeft - row.offsetLeft; }catch(_){} }
    });
  });
})();
</script>
