/* VEI — qi-locked design (Photoroom_20260523_134010.png reference).
   Deep green radial gradient bg, phosphor-green waveform, soft cream chat bubbles.
   Aesthetic: terminal-organism. Hebrew Ruach (breath/spirit) made visible. */
:root {
  --bg:#0A1F12;
  --bg-glow:#1A4D2E;
  --bg-elev:rgba(20, 60, 35, .25);
  --bg-input:rgba(20, 60, 35, .45);
  --fg:#F0EAD6;
  --fg-dim:#A8C0A4;
  --fg-mute:#6B8B72;
  --line:rgba(176, 255, 200, .12);
  --line-strong:rgba(176, 255, 200, .22);
  --accent:#00FF88;
  --accent-hover:#5FFF9E;
  --accent-glow:rgba(0, 255, 136, .35);
  --bubble-bg:rgba(176, 200, 170, .92);
  --bubble-fg:#0A1F12;
  --good:#00FF88;
  --warn:#F5C842;
  --bad:#FF6B5A;
  --r-card:18px;
  --r-pill:9999px;
  --sans:'Inter','SF Pro Text',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100dvh;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--sans);
  font-feature-settings:"ss01","cv11";
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
/* Background layer — Ophanim 3D avatar (qi-XLRD-ID). Dim until touched. */
.bg-video, .bg-iframe {
  position:fixed; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:0; pointer-events:none;
  border:0;
  opacity:.32;
  filter:saturate(.95);
  transition:opacity .55s ease-out, filter .55s ease-out;
}
body.lit .bg-video, body.lit .bg-iframe { opacity:.78; filter:saturate(1.15); }
/* Glass over the video — frosted layer with heavy blur + soft tint.
   qi 2026-05-23: 'video needs to be behind glass'. */
.bg-overlay {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 55%, rgba(10,31,18,.30), rgba(2,6,10,.72)),
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  backdrop-filter:blur(22px) saturate(1.15);
  -webkit-backdrop-filter:blur(22px) saturate(1.15);
  border-top:1px solid rgba(255,255,255,.04);
  border-bottom:1px solid rgba(0,0,0,.18);
  transition:backdrop-filter .55s ease-out, background .55s ease-out;
}
body.lit .bg-overlay {
  background:
    radial-gradient(ellipse 80% 60% at 50% 55%, rgba(10,31,18,.12), rgba(2,6,10,.42)),
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  backdrop-filter:blur(10px) saturate(1.3);
  -webkit-backdrop-filter:blur(10px) saturate(1.3);
}
/* FILL THE VISUAL VIEWPORT, DO NOT TRUST A UNIT TO EQUAL IT.
   qi 2026-08-12 20:04: "black empty dead space is still present" — after the pills and
   the bar were already on screen. Cause: height:100dvh makes the wrap as tall as what
   the browser REPORTS, and on iOS (Safari and standalone PWA) that can exceed the area
   actually painted, so the tail of the page — and the space under the composer — falls
   below the fold as dead black.
   position:fixed + inset:0 CANNOT exceed the visual viewport: the box is defined by the
   edges, not by a length. And inside the XOS panel this same rule is rewritten to
   position:absolute by deViewport() (xos/app.jsx), where inset:0 fills the panel exactly
   — so one declaration is correct on the phone AND mounted, with no dvh dependence
   anywhere. Same lesson as the composer clearance: measure/anchor, never assume. */
.wrap { position:fixed; inset:0; z-index:2; }
.wrap {
  display:flex; flex-direction:column;
  width:100%;
  /* ⛔ NO 760px COLUMN. qi 2026-08-13 20:41: "The center panel VBSVI looks like its
     been constrained" / "Instead of going all the way from edge to edge all the way
     to the side" / "Even even the type bar its constrained".
     `.wrap` holds BOTH the transcript and the composer, so this single cap boxed the
     centre panel and the type bar together — which is exactly the pair he named.
     Reading-measure caps belong on prose. This is an operating surface: it goes edge
     to edge, and the bubbles keep their own 78%/88% max-widths so text still reads. */
  max-width:none; margin:0;
  /* --wrap-px is now the SINGLE SOURCE of this surface's horizontal inset, because
     #tl-rail has to cancel exactly this value to sit flush on the panel edge
     (qi 2026-08-15 02:19). Two hardcoded 20s in two rules is how a "0px" quietly
     becomes a 4px later; one variable read by both cannot drift. */
  --wrap-px:20px;
  padding:env(safe-area-inset-top, 18px) var(--wrap-px) env(safe-area-inset-bottom, 16px);
  position:relative;
}

/* Header — top-right mic icon, top-left brand, minimal chrome */
header { padding:8px 0 22px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { display:none; }
.brand-text { display:flex; flex-direction:column; gap:3px; }
.title { font-size:15px; font-weight:500; letter-spacing:.02em; line-height:1; color:var(--fg-dim); }
.title .heb { color:var(--accent); margin-left:6px; font-size:14px; }
.subtitle { font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--fg-mute); text-transform:uppercase; }

.mic-icon {
  width:32px; height:32px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  color:var(--fg);
  opacity:.85;
  cursor:pointer;
  transition:opacity .15s, transform .15s, color .15s;
}
.mic-icon svg { width:18px; height:18px; }
.mic-icon:hover { opacity:1; transform:scale(1.05); }
.mic-icon.active { color:var(--accent); opacity:1; filter:drop-shadow(0 0 6px var(--accent-glow)); }

.count-chip { display:none; }

/* Status pill removed — replaced by waveform-bottom-bar visual feedback */
.status-bar { display:none; }
@keyframes pulse { 0%, 100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(1.5); } }

/* Transcript = top-anchored chat bubbles, cream-on-green */
#transcript {
  flex:1; overflow-y:auto;
  display:flex; flex-direction:column; gap:10px;
  /* --composer-h is the measured OVERLAP of the absolutely-positioned .composer
     over this scroller, published by _veiComposerClearance — search that name;
     the full rationale lives next to the code that does the work so the two
     cannot drift apart, which is the exact failure this replaced. 100px is the
     pre-JS fallback ONLY. The + 16px is the visible gap between the last bubble
     and the top of the bar. */
  padding:4px 4px calc(var(--composer-h, 100px) + 16px);
  /* NO scroll-behavior:smooth here. Every append does scrollTop = scrollHeight,
     and smooth turns that assignment into a ~300ms ANIMATION — so the newest
     message is visibly sitting under the composer for the whole animation, and on
     a fast feed the next message restarts it before it ever clears. That is the
     "margin under the chat blocking the bottom" symptom: the padding math was
     right the whole time (measured 2026-08-12: 84px overlap, 100px pad, 16px gap),
     the SCROLL was late. Appends must land instantly. The timeline rail still
     animates its jumps — it asks for smooth per-call via scrollTo(). */
}
/* Native bar is GONE — the timeline rail on the right IS the scrollbar now. */
#transcript::-webkit-scrollbar { width:0; height:0; }
#transcript { scrollbar-width:none; }

/* ─── THE TIMELINE IS THE SCROLL BAR ON THE RIGHT ────────────────────────────
   qi 2026-08-12 16:49: "the timeline was supposed the scoll bar on the right".

   CORRECTION OF MY FIRST PASS. I built the timeline as a spine down the LEFT
   with hour labels interleaved into the feed. Wrong axis and wrong element:
   the timeline is not decoration beside the entries, it REPLACES the
   scrollbar. Same information, but it lives where your thumb already goes to
   move through the day.

   Structure: #tlwrap is a flex ROW holding the scroller plus a fixed rail.
   #transcript keeps its own `flex:1`, so it simply claims the remaining width
   instead of the remaining height — the wrapper inherits the vertical claim.
   `min-height:0` on the wrapper is load-bearing: a flex item's default
   `min-height:auto` refuses to shrink below content, which kills the child's
   overflow scrolling outright.

   Ticks are positioned from each entry's REAL offsetTop over scrollHeight, not
   from wall-clock spacing — a 40-minute silence must not open a 40-minute gap
   in a bar whose height is fixed. The bar maps document space, and the labels
   tell you which hour you have reached in it. */
#tlwrap {
  flex:1; min-height:0; display:flex; align-items:stretch;
  /* Containing block for the rail, which is now an absolute LAYER rather than a
     column in this row — see #tl-rail for the measurement and the reason. */
  position:relative;
}
/* `position:relative` is what makes #transcript the offsetParent, so each
   entry's offsetTop is measured against the SCROLLER rather than against some
   ancestor further up. Without it every tick is off by the scroller's own
   page offset. */
#transcript { min-width:0; position:relative; }

/* ── DESIGN LANGUAGE PORTED FROM xt/09's STATION RAIL (qi 2026-08-12 16:52:
   "compare it the scroll bar design of xt/09"). Its grammar, matched here:

     · TICK LENGTH ENCODES STATE, not colour alone — 14px at rest, 22px hovered,
       30px active. Read the rail at a glance and the current position is the
       longest line, no legend needed.
     · LABELS ARE `color:transparent` BY DEFAULT and only resolve on hover or
       when active. The rail is quiet until you engage it, so it never competes
       with the transcript.
     · The active state alone gets the accent plus a glow.
     · The originals' easings, kept exactly: colour .45s
       cubic-bezier(.19,1,.22,1), width .55s cubic-bezier(.47,.38,0,1.1).

   Token mapping — xt/09 → this file (its palette is jade-on-black, ours is the
   VVSVEI green): --jade → --accent, --w-30 → rgba(255,255,255,.30),
   --w-58 → rgba(255,255,255,.58). Values are inlined for the two whites
   because this file has no equivalent token to point at, and inventing one
   would imply a palette entry that nothing else uses. */
/* ── THE RAIL IS A LAYER, NOT A COLUMN ──────────────────────────────────────
   qi 2026-08-15 00:03: "the time line can remain exactly where it is but the
   chat bubble should not have to move to the left because the time line should
   be a layer above it. so when the times show and the line extends it can
   extend over bubbles on the right side. thats fine. because currently the chat
   is asymmetric and we cant tolerate that in my designs."

   MEASURED CAUSE OF THE ASYMMETRY: this was `flex:0 0 34px` inside the #tlwrap
   flex ROW, so the rail consumed 34px of that row and #transcript (flex:1) got
   only the remainder. #transcript's own padding is a symmetric `4px 4px` — the
   bubbles were never off-centre INSIDE it. The whole defect was that its BOX
   was 34px narrower than the panel and hard against the left edge, so the
   composition read as shoved left with a dead column on the right.

   Out of flow, #transcript claims the full panel width and the bubbles centre
   on the real panel. The ticks and the hover labels now extend OVER the
   right-hand bubbles, which is exactly what he approved.

   pointer-events is SPLIT on purpose: none on the rail, auto on the stations.
   Without that split this 34px column — now floating above live content — would
   swallow every tap on the right edge of the bubbles underneath it. */
/* ── FLUSH TO THE PANEL EDGE ─────────────────────────────────────────────────
   qi 2026-08-15 02:19: "is the time line scroll fix and it works great. [now] you
   move the that to be 0px from the right edge of the middle [panel]".

   MEASURED CAUSE OF THE GAP, live at 390x844 before this change:
     .pane-vei / #xos-vei   right edge = 390
     #tlwrap                right edge = 370   ← the rail's offsetParent
     #tl-rail               right edge = 370   (right:0 was already honoured)
     ticks painted to             ~366   (its own padding-right:4px)
   So `right:0` was never the defect. The rail WAS at zero — against #tlwrap, and
   #tlwrap is a flex child of .wrap, which carries `padding: … var(--wrap-px) …`.
   The 20px he sees is that padding, inherited one box up, plus 4px of the rail's
   own internal inset. Nothing in the rail's own rule could have shown it.

   FIX: cancel exactly the parent inset with a negative offset read from the SAME
   variable, and drop the internal 4px, so the ticks land on x = panel width. This
   is deliberately not `right:-24px` — a literal would silently lie the moment
   --wrap-px changes.

   The rail stays a LAYER (pointer-events:none, .tl-st auto) exactly as the 00:03
   change left it — the part he said works great is untouched. */
#tl-rail {
  position:absolute; top:0; right:calc(-1 * var(--wrap-px, 20px)); bottom:0;
  width:34px; z-index:5;
  pointer-events:none;
  display:flex; flex-direction:column; justify-content:center;
  align-items:flex-end; gap:11px;
  padding-right:0;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.tl-st {
  position:relative; display:flex; align-items:center; gap:9px;
  background:none; border:0; padding:3px 0; cursor:pointer;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.16em;
  color:transparent; text-transform:uppercase; white-space:nowrap;
  transition:color .45s cubic-bezier(.19,1,.22,1);
  /* The only interactive part of the layer (see #tl-rail). touch-action:none so
     a vertical drag on a station scrubs the rail instead of being claimed by the
     browser as a page scroll — the scrub is wired in _tlScrub. */
  pointer-events:auto; touch-action:none;
}
.tl-st i {
  display:block; width:14px; height:1px; background:rgba(255,255,255,.30);
  transition:width .55s cubic-bezier(.47,.38,0,1.1), background .3s;
}
.tl-st:hover { color:rgba(255,255,255,.58); }
.tl-st:hover i { width:22px; background:rgba(255,255,255,.58); }
.tl-st.on { color:var(--accent); }
.tl-st.on i { width:30px; background:var(--accent); box-shadow:0 0 9px rgba(0,255,136,.6); }
/* The live end of the day. Distinguishable from `.on` because "the newest
   hour" and "the hour you are looking at" are different facts and are often
   not the same station. */
.tl-st.now i { background:var(--accent); }
/* DAY BOUNDARIES ON THE RAIL — qi 2026-08-13 20:10: "it should have dates when I
   start scrolling back through different days and weeks".
   Every other station label is `color:transparent` at rest by design (the rail is
   quiet until engaged), but a DATE is a landmark, not a hover affordance: scrolling
   back through a week is exactly when he cannot afford to hover 20 stations to find
   out where he is. So this one stays legible at rest, dimmed enough not to compete.
   Rendered via ::before on the first station of each past day, so it adds no node to
   the rail and cannot disturb the even station spacing the xt/09 design depends on. */
.tl-st.tl-newday::before {
  content: attr(data-day);
  position:absolute; right:100%; margin-right:10px; top:50%;
  transform:translateY(-50%);
  font-family:var(--mono); font-size:7.5px; letter-spacing:.18em;
  color:rgba(255,255,255,.38); white-space:nowrap; pointer-events:none;
}
.tl-st.tl-newday i { background:rgba(255,255,255,.52); }   /* the day tick reads harder */
#tl-thumb { display:none; }   /* xt/09 has no thumb — the active station IS the position */

/* Glass bubbles — heavy backdrop-blur + thin gloss highlight + translucent fill.
   qi-spec 2026-05-23: "super hyper realistic glass" */
/* qi 2026-05-25 timestamp canon — h:mm AM/PM tag on every bubble. */
.bubble-ts {
  display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-dim); opacity:.62;
  margin-bottom:4px;
}
.bubble-txt { display:block; }

/* qi 2026-05-25 — drag-drop active state. Subtle accent ring across the body
   so qi knows the page will catch the file anywhere he releases it. */
body.drop-active::before {
  content: ""; position: fixed; inset: 12px; pointer-events: none; z-index: 9000;
  border: 2px dashed rgba(0,153,255,0.65); border-radius: 18px;
  background: rgba(0,153,255,0.05);
  box-shadow: inset 0 0 32px rgba(0,153,255,0.18);
}
body.drop-active::after {
  content: "drop to attach"; position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  z-index: 9001; padding: 8px 18px; border-radius: 999px;
  background: rgba(0,153,255,0.18); border: 1px solid rgba(0,153,255,0.45);
  color: #cfe6ff; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  pointer-events: none;
}

.final, .interim, .xen-reply {
  position:relative;
  max-width:78%; align-self:flex-start;
  padding:12px 16px; border-radius:var(--r-card);
  background:linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 8px 24px rgba(0,0,0,.28),
    0 0 0 0.5px rgba(255,255,255,.06);
  backdrop-filter:blur(18px) saturate(1.3);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  color:var(--fg);
  font-size:15px; line-height:1.45; font-weight:500;
  word-break:break-word;
  animation:fadeIn .22s cubic-bezier(.32,.72,.2,1);
}
/* Top-gloss specular reflection */
.final::before, .interim::before, .xen-reply::before {
  content:""; position:absolute; inset:1px 1px auto 1px; height:38%;
  border-radius:var(--r-card) var(--r-card) 30% 30%/var(--r-card) var(--r-card) 60% 60%;
  background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
  pointer-events:none;
}
.final.posted-flag { box-shadow:
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 8px 24px rgba(0,0,0,.28),
    0 0 0 1px var(--accent-glow); }
.interim { opacity:.78; font-style:italic; }
.xen-reply { align-self:flex-end; background:linear-gradient(145deg, rgba(0,255,136,.16), rgba(0,255,136,.04)); border-color:rgba(0,255,136,.28); color:var(--fg); }
.firehose {
  max-width:78%; align-self:flex-start;
  padding:8px 12px; border-radius:10px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  color:var(--fg-dim);
  font-family:var(--mono); font-size:11.5px; line-height:1.35;
  word-break:break-word;
  opacity:.7;
}
.firehose .src {
  display:inline-block; margin-right:6px;
  font-size:9.5px; letter-spacing:.10em; text-transform:uppercase;
  color:var(--accent);
}
/* qi 2026-07-02: nitro-tool bubbles sit on the right like xen-reply, everything
   else in the background feed stays left (.firehose default). */
.firehose-right { align-self:flex-end; }

/* ── COLLAPSED OBSIDIAN GLASS — THE TUI STREAM BUBBLE ────────────────────────
   qi 2026-08-14 23:30: "collapsed obsidian glass tui stream chat bubbles"
   qi 2026-08-14 23:31: "it should write on real time like how the ticker animates"
   qi 2026-08-15 00:17: "those bubbles needed the obsidian ... in ticker streaming
   glass style"

   ⚖️ THIS RECONCILES A PRIOR DECREE RATHER THAN BREAKING IT. On 2026-07-22 he said
   Xen's raw bash/tool output "showing up in my main message feed like chat bubbles"
   belonged in a background area, and the router still sends xen-step / lane:steps to
   #er-list and returns before any bubble. That complaint was about VOLUME — full-size
   conversational bubbles flooding the feed. The word he chose this time is COLLAPSED,
   and that is the resolution: the step is back in the stream but clamped to ONE line,
   in mono, in dark glass, expanding only when tapped. The Operator·Firehose rail keeps
   its copy — nothing is moved, nothing is lost, so the 07-22 routing still holds.

   OBSIDIAN = the same glass recipe as .final/.xen-reply inverted to dark. Identical
   structure — 145deg fill gradient, 1px hairline, inset top gloss, the ::before
   specular, blur(18px) saturate(1.3) — with the tint taken from white to near-black
   so it reads as obsidian rather than as a new material. Matching the STRUCTURE is
   what keeps it in the same family as the cream bubbles.

   Collapse uses -webkit-line-clamp:1 rather than a fixed height: a clamp gives the
   ellipsis for free and cannot mis-measure a proportional font the way a px height
   does. Tap toggles .open. */
/* ── qi 2026-08-15 02:01, VERBATIM ───────────────────────────────────────────
   "the tui stream chat bubble need to be dark like my swipe glass and the text
    should stream like the notification ticker does and it the should be collapsible"

   ⚠️ WHY HE ASKED A SECOND TIME, AND WHAT WAS ACTUALLY WRONG. He had already asked
   for this at 00:17 and `.tui-step` below was built for it — streaming, clamped,
   tap-to-open, all three. MEASURED on his live feed at 2026-08-15 03:5x, 390x844:

       .tui-step   count = 0        ← never rendered once
       .firehose   count = 4        ← ALL of them src "xen 9934", Xen's own stream
                   background rgba(255,255,255,.04)   ← pale, not dark
                   opacity .7, no clamp, no caret, no tap handler

   appendTuiStep() only fires for source `xen-step` / lane `steps`. Xen's stream
   reaches him on the FIREHOSE path instead, so every bubble he was looking at when
   he typed this was the pale one. The obsidian work was real and invisible. That is
   why the fix is not "build it again" — it is to put the same material, the same
   typing and the same collapse on the bubbles that are actually in his feed.

   ⚖️ SCOPE, deliberately narrow: only firehose bubbles carrying XEN'S OWN stream get
   `.tui`. An inbound SMS from a person keeps today's look — he asked for the TUI
   stream bubble, and silently clamping a human's message to one line would be a
   regression wearing a fix's clothes.

   ── "DARK LIKE MY SWIPE GLASS" IS A CITATION, NOT A MOOD ─────────────────────
   These declarations are COPIED OUT OF the canonical swipe glass,
   `.os.os-fullscreen .dock.dock-swipe` in xos/styles.css:3745-3759 — the radial
   specular, the three-stop vertical ramp, the blur/saturate/brightness, the two
   inset hairlines. That rule is SACRED and is not touched by this change; it is
   only read. The previous obsidian recipe here was invented
   (`linear-gradient(145deg, rgba(14,20,17,.84), rgba(4,7,6,.60))`, blur(18px)) and
   therefore could never satisfy "like my swipe glass" no matter how dark it looked.

   TWO ADAPTATIONS, stated plainly because they are real departures:
     · `border-top` → `border` — the dock is a bar sitting on one edge, a bubble has
       four sides; a top-only hairline on a rounded box reads as a broken outline.
     · `0 -8px 24px` → `0 8px 24px` — the dock throws its shadow UP off the bottom of
       the screen; a bubble sits in a feed and throws it DOWN. Same colour, same blur.
   Every other value is byte-identical to his glass. */
.tui-step,
.firehose.tui {
  /* qi 2026-08-15 04:43: "it needs to be on your side, not my side."
     flex-START is HIS side in this feed — line 340/371 give inbound bubbles
     flex-start, and .xen-reply (line 369) is flex-end. This rule shipped at
     flex-start, so Xen's own stream was rendering on qi's side. Worse, .firehose.tui
     (0,2,0) outranks .firehose-right (0,1,0), so it also OVERRODE the right-align
     that outbound bubbles already had. Xen's lane is flex-end, always. */
  position:relative; align-self:flex-end; max-width:88%;
  /* MEASURED 2026-08-15 00:25, and this is why the row is flex rather than inline:
     -webkit-box (the clamp) is BLOCK-level, so with an inline .tui-src label the
     clamped body dropped onto its own second line — collapsed rendered at 66px while
     open rendered at 33px, i.e. "collapsed" was TALLER than expanded. A flex row with
     a non-shrinking label and a min-width:0 body keeps the clamped line beside its
     label, which is what makes one line actually one line.
     flex-wrap is for .bubble-actions (the REPLY row), which is a BLOCK child: without
     wrap it would become a third item on the same line and shove the body out. */
  display:flex; flex-wrap:wrap; align-items:baseline; column-gap:0;
  padding:7px 12px; border-radius:12px;
  /* qi 2026-08-15 04:43: "It needs to be almost black."
     WHY COPYING THE GLASS RECIPE WAS NEVER GOING TO WORK — measured in painted
     pixels, text-free regions, 390x844:
         this bubble        avg RGB [8, 98, 15]
         .dock.dock-swipe   avg RGB [8, 11, 10]
     Byte-identical declarations, green channel 98 vs 11. `backdrop-filter` samples
     WHAT IS BEHIND IT. The dock sits over [30,43,37] and lands near-black; this
     bubble sits over the feed's [14,108,46] and the same blur barely touches it.
     A translucent recipe cannot be "dark" — it can only be as dark as its backdrop.
     FIX: an OPAQUE near-black base FIRST in the stack, so darkness is a property of
     the bubble and not of whatever happens to scroll behind it. The specular and the
     blur stay on top, so it still reads as glass rather than a flat panel. */
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(
      to bottom,
      rgba(7, 10, 9, 0.94) 0%,
      rgba(5, 8, 7, 0.95) 50%,
      rgba(3, 6, 5, 0.96) 100%
    );
  backdrop-filter:blur(40px) saturate(220%) brightness(1.05);
  -webkit-backdrop-filter:blur(40px) saturate(220%) brightness(1.05);
  border:1px solid rgba(255, 255, 255, 0.14);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.18),
    inset 0 -1px 0 rgba(0, 0, 0, 0.4),
    0 8px 24px rgba(0, 0, 0, 0.45);
  /* .firehose ships opacity:.7 — a translucent glass behind a 70% veil is mud, and it
     would also fade the accent label. The glass carries its own transparency. */
  opacity:1;
  font-family:var(--mono); font-size:11px; line-height:1.5;
  color:rgba(255,255,255,.74);
  cursor:pointer;
  animation:fadeIn .22s cubic-bezier(.32,.72,.2,1);
  transition:max-width .28s cubic-bezier(.32,.72,.2,1);
}
/* The REPLY row is a block child of a flex bubble — give it its own full-width line
   so it can never sit beside the clamped body. */
.firehose.tui .bubble-actions { flex:0 0 100%; }
/* Same top-gloss specular as the cream bubbles, cut down for a dark surface. */
.tui-step::before,
.firehose.tui::before {
  content:""; position:absolute; inset:1px 1px auto 1px; height:38%;
  border-radius:12px 12px 30% 30%/12px 12px 60% 60%;
  background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0));
  pointer-events:none;
}
.tui-step .tui-src,
.firehose.tui .src {
  flex:0 0 auto;                 /* the label never shrinks — it is the identity of the line */
  color:var(--accent); font-size:9.5px; letter-spacing:.10em;
  text-transform:uppercase; margin-right:7px; opacity:.85;
}
.tui-step .tui-body,
.firehose.tui .bubble-txt {
  flex:1 1 auto; min-width:0;    /* min-width:0 or the clamp cannot shrink below content */
  white-space:pre-wrap; word-break:break-word;
}
/* COLLAPSED is the default state — one line, ellipsis, never a flood. */
.tui-step:not(.open) .tui-body,
.firehose.tui:not(.open) .bubble-txt {
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
  overflow:hidden;
}
.tui-step.open,
.firehose.tui.open { max-width:96%; }
/* The affordance, so "collapsible" is DISCOVERABLE and not a secret tap target.
   A ▸/▾ chevron that rotates on open — no extra node, no layout cost, and it reads
   as an expander in every UI he uses. Sits on the label so the row still starts with
   the identity of the line. */
.tui-step .tui-src::before,
.firehose.tui .src::before {
  content:"\25B8";               /* ▸ */
  display:inline-block; margin-right:5px;
  transition:transform .18s cubic-bezier(.32,.72,.2,1);
}
.tui-step.open .tui-src::before,
.firehose.tui.open .src::before { transform:rotate(90deg); }
/* The ticker's caret, same glyph and cadence as .dock-notif-ticker in XOS. It exists
   only while bytes are still arriving, so a settled bubble never blinks at him. */
.tui-step .tui-caret,
.firehose.tui .tui-caret {
  flex:0 0 auto;                 /* a shrunk caret would render as a sliver, not a cursor */
  display:inline-block; margin-left:1px; color:var(--accent);
  animation:tuiCaret .9s steps(1,end) infinite;
}
@keyframes tuiCaret { 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* ── #tui-live — THE LIVE CLAUDE CODE TUI STREAM ──────────────────────────────
   qi 2026-08-17 03:43:43: "osed to bee the live stream of local claude code tui
   session shown live inside the chat in full!"
   and 03:14:14: "supposed to be black and collapsed"  ← this describes THIS
   element, not the menu bar.

   THE ONE RULE: this is ONE PERSISTENT ELEMENT WHOSE CONTENT IS REPLACED on
   every frame — never one bubble per frame. Appending per frame is the
   "fragments" sin he has now rejected four separate times; the rejected
   .firehose.tui/.tui-step path above rendered one clamped bubble per TOOL CALL
   ("Bash · ok · 125ms") interleaved with his own sentences. Those rules are
   left untouched and are NOT reused here — this is a NEW element type, exactly
   as he asked on 2026-08-15 04:44: "You werent supposed to be changing any of
   the bubbles, you were adding another bubble type for the terminal."

   ⛔ NOTHING BELOW TOUCHES #pill-row, paint(), paintTrigger(), .firehose,
   .tui-step, .final or .xen-reply. qi 03:40:24 "the menu bar was already
   perfect" / 03:42:21 "did not tell to chanch the css of the menu".

   ⛔ NO position:fixed AND NO position:sticky, deliberately. The retired
   #events-rail directly below is the measured proof: it was position:fixed, so
   once vvsvei mounted into XOS it ESCAPED its panel and floated over the whole
   phone as a ghost. A live monitor that escapes its container is a worse defect
   than one that scrolls, so this stays in normal flow and is re-anchored to the
   live edge by JS only while he is already scrolled to the bottom.

   The near-black base is the SAME recipe he approved for the terminal surface
   (opaque first, glass on top) — copied by value, not by selector, so the two
   can never restyle each other. Reason it must be opaque is in the .tui-step
   header: backdrop-filter samples what is BEHIND it, so a translucent recipe
   over this feed lands at green-channel 98, not 11. */
.tui-live {
  align-self:stretch;                 /* full width: 115 columns need every pixel */
  max-width:100%;
  margin:6px 0;
  border-radius:12px;
  padding:6px 8px 7px;
  position:relative;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(
      to bottom,
      rgba(7, 10, 9, 0.94) 0%,
      rgba(5, 8, 7, 0.95) 50%,
      rgba(3, 6, 5, 0.96) 100%
    );
  backdrop-filter:blur(40px) saturate(220%) brightness(1.05);
  -webkit-backdrop-filter:blur(40px) saturate(220%) brightness(1.05);
  border:1px solid rgba(255, 255, 255, 0.14);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.18),
    inset 0 -1px 0 rgba(0, 0, 0, 0.4),
    0 8px 24px rgba(0, 0, 0, 0.45);
  opacity:1;
  font-family:var(--mono);
  color:rgba(255,255,255,.74);
  animation:fadeIn .22s cubic-bezier(.32,.72,.2,1);
}
/* Header row: identity + the collapse affordance. Its own line, not a flex
   sibling of the body — a 115-column screen beside an inline label would squash
   the screen to nothing (that squash is exactly what the .tui-step header
   documents at 66px-collapsed-vs-33px-open). */
.tui-live .tui-live-head {
  display:flex; align-items:center; gap:6px;
  cursor:pointer; user-select:none;
  color:var(--accent); font-size:9.5px; letter-spacing:.10em;
  text-transform:uppercase; opacity:.85;
  padding-bottom:4px;
}
.tui-live .tui-live-head::before {
  content:"\25B8";                    /* ▸ — same affordance as the terminal bubbles */
  display:inline-block;
  transition:transform .18s cubic-bezier(.32,.72,.2,1);
}
.tui-live.open .tui-live-head::before { transform:rotate(90deg); }
/* The dim right-hand meta (pane · size). Never the loud part of the row. */
.tui-live .tui-live-meta {
  margin-left:auto; opacity:.55; letter-spacing:.04em; text-transform:none;
}
/* A live caret so a settled screen and a streaming one are distinguishable. */
.tui-live .tui-live-caret {
  display:inline-block; color:var(--accent);
  animation:tuiCaret .9s steps(1,end) infinite;
}
/* SEALED = a finished snapshot. qi 2026-08-17 05:34: "it's supposed to be like
   snapshots" + 05:33:35 "they should just show up when anything runs instead of
   MOVING like that". Once a message lands beneath a screen, that screen is
   history: it stops streaming, stops claiming live, and never relocates. Dimmed
   one notch so the live one is findable at a glance without reading a label. */
.tui-live.sealed { opacity:.82; border-color:rgba(255,255,255,0.09); }
.tui-live.sealed .tui-live-caret { display:none; }
.tui-live.sealed .tui-live-head { opacity:.6; }
/* THE SCREEN ITSELF — verbatim, so `white-space:pre` (NOT pre-wrap): wrapping a
   115-column TUI reflows every box-drawing rule into garbage. It therefore
   overflows horizontally BY DESIGN, and that overflow scrolls INSIDE this box —
   `overscroll-behavior-x:contain` stops the swipe from chaining out to the page,
   so the body never scrolls sideways. */
.tui-live .tui-live-body {
  margin:0;
  font-family:var(--mono); font-size:9.5px; line-height:1.35;
  white-space:pre;
  overflow-x:auto; overflow-y:hidden;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  color:rgba(255,255,255,.78);
}
.tui-live .tui-live-body::-webkit-scrollbar { height:0; }
.tui-live .tui-live-body { scrollbar-width:none; }

     transport was built with vdo ninja i think" — correct, and the grant was OURS: this
     iframe listed `camera`, so Chrome reported "using your camera and microphone" on a

     the browser refuses video to the frame no matter what the third party asks for.
     Defend at our boundary, never on a vendor's flag. -->
<iframe id="vdo-rtc" allow="microphone; autoplay; speaker"
  style="position:fixed; left:-10000px; top:-10000px; width:1px; height:1px; opacity:0; pointer-events:none; border:0;"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
// INSTANT OPEN (wf 2026-05-31): register a cache-first service worker so reopen
// paints the page shell from cache with NO network wait for the HTML. Async +
// non-blocking — does not delay first paint, hydrate, or arm. Scope is /vvsvei/
// only; the SW never intercepts /events SSE or /api/* (see sw.js). qi: "having to
// reload vvsvei is a bottleneck. it should open and work instantly."
if ('serviceWorker' in navigator) {
  try {
    window.addEventListener('load', () => {
      // Was there already a controller at load? If yes, a later controllerchange
      // means a NEW build claimed us (a real update). If no controller (first
      // install ever), the initial claim is NOT an update and must not reload.
      var _hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { scope: './' }).then(function(reg){
        // SSE-independent update DETECTION (H5): poll for a byte-changed sw.js so a
        // deploy is noticed even when SSE is down/backgrounded. Cheap conditional GET.
        try { reg.update(); } catch (_) {}
        setInterval(function(){ try { reg.update(); } catch (_) {} }, 60000);
      }).catch(function(){});
      var _swReloaded = false;
      // Guard a deploy-reload so it NEVER silently re-locks a live armed tab (iOS
      // audio re-locks on reload, re-arm is a manual tap, no full persistence yet).
      var _safeReload = function(){
        if (_swReloaded || !_hadController) return;                       // never on first install
        if (typeof _avaLive !== 'undefined' && _avaLive) return;          // never yank a live tab
        if (typeof _avaAudioUnlocked !== 'undefined' && _avaAudioUnlocked) return;  // never an armed tab
        _swReloaded = true; try { location.reload(); } catch (_) {}
      };
      navigator.serviceWorker.addEventListener('controllerchange', _safeReload);
      // PRE-v7 CONVERGENCE (H5): honor the v8 SW's postMessage nudge under the same
      // arm-safe guard — a stale never-armed tab reloads (heals), a live tab stays.
      navigator.serviceWorker.addEventListener('message', function(ev){
        try { if (ev.data && ev.data.type === 'vvsvei-reload') _safeReload(); } catch (_) {}
      });
    });
  } catch (_) {}
}
const API_URL = 'https://xen.xlrd.org/api/dictate-inject';
const AUDIO_URL = 'https://xen.xlrd.org/api/dictate-audio';
const RTC_SIGNAL_URL = 'https://xen.xlrd.org/api/rtc-signal';
const HEADERS = { 'Content-Type': 'application/json' };
const CHUNK_MS = 5000;

// ── Reply feedback (qi rates Xen replies 👍/👎 → Xen learns good vs not) ───────
// Endpoint may not exist yet — POST is fire-and-forget, no-cors, errors swallowed.
// localStorage is the source of truth so nothing is lost when the endpoint is down.
const FEEDBACK_URL = 'https://xen.xlrd.org/api/feedback';
const FEEDBACK_LOG_KEY = 'xen-feedback-log';
function logFeedback(entry) {
  // (b) persist locally first — never lose a rating even if the network is down.
  let log = [];
  try { log = JSON.parse(localStorage.getItem(FEEDBACK_LOG_KEY) || '[]'); } catch (_) { log = []; }
  if (!Array.isArray(log)) log = [];
  log.push(entry);
  if (log.length > 500) log.splice(0, log.length - 500);   // bound growth
  try { localStorage.setItem(FEEDBACK_LOG_KEY, JSON.stringify(log)); } catch (_) {}
  // (a) fire-and-forget POST — graceful: endpoint may 404/not-exist, swallow all.
  try {
    fetch(FEEDBACK_URL, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry),
    }).catch(() => {});
  } catch (_) {}
}

// ── VEI RTC: transport Mac say-worker voice to phone over WebRTC (peer-to-peer,
// identical audio bytes, no re-synthesis). qi 2026-05-25 "vei rtc... public".
// Broadcaster (?role=broadcast) captures the Loopback "out" virtual device on
// Mac. Receiver (default on mobile) attaches inbound track to hidden audio.
// Signaling via omnimind /api/rtc-signal SSE+POST. Open Relay TURN for
// cellular fallback per qi greenlight.
const RTC_ROOM = new URLSearchParams(location.search).get('room') || 'xen-qi';
const RTC_ROLE_OVERRIDE = new URLSearchParams(location.search).get('role'); // broadcast | receive | null
const RTC_ICE = {
  iceServers: [
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  ],
  iceCandidatePoolSize: 4,
};

const transcript = document.getElementById('transcript');

/* ── SOURCE STAMP AT BIRTH ──────────────────────────────────────────────────
   MEASURED 2026-08-22 on the live page: the inject filter hid NOTHING. 0 of 190
   rows carried a rail; every single one was cached as "-". railOf() re-reads
   el.textContent hunting an "in:"/"typed:"/"bee:" prefix — but EVERY renderer
   STRIPS that prefix before painting. The feed sends
       "6:37:05 PM, in: Corporate stories"
   and the DOM receives
       "Corporate stories".
   The source is destroyed BEFORE classification ever runs, so no amount of
   pattern-matching inside railOf can recover it. That is why the chips flipped,
   the counter ticked 11/11 -> 10/11, localStorage was written, and not one
   message moved: every component reported success against its own state instead
   of the DOM it governs.

   FIX: classify from the EVENT — where d.text still has the prefix intact — and
   stamp data-rail on whatever that event appends. railOf() already reads
   data-rail first, so nothing downstream changes.

   ONE wrapper, not 16 patched appendChild sites: renderEvent's appends are
   synchronous, so the scope cannot be clobbered mid-render, and it is released
   on the next microtask once every sync append has landed.

   FAIL-SAFE BY DESIGN: an unclassified row gets no data-rail, and paint() acts
   only `if(rail)` — so anything this cannot identify stays VISIBLE. A mute can
   never make one of qi's own messages disappear by accident. */
var _railScope = null;
function _stampRail(node){
  if(!node || !_railScope) return node;
  if(node.nodeType === 11){                    /* DocumentFragment — stamp kids */
    for(var i=0;i<node.children.length;i++){
      if(!node.children[i].hasAttribute('data-rail')) node.children[i].setAttribute('data-rail', _railScope);
    }
    return node;
  }
  if(node.nodeType === 1 && !node.hasAttribute('data-rail')) node.setAttribute('data-rail', _railScope);
  return node;
}
(function(){
  var _ac = transcript.appendChild.bind(transcript);
  var _ib = transcript.insertBefore.bind(transcript);
  transcript.appendChild  = function(n){ return _ac(_stampRail(n)); };
  transcript.insertBefore = function(n, ref){ return _ib(_stampRail(n), ref); };
})();
function _railFromEvent(d){
  if(!d) return null;
  var t = (d.text || d.body || d.message || d.preview || '').toString().slice(0,64);
  var R = ['typed','in','bee','omi','sms','notif','rss','xen-step','XEN-AGENT','VEI ATTACH','DESK DROP'];
  for(var i=0;i<R.length;i++){
    if(t.indexOf(R[i]+':') > -1 || t.indexOf('['+R[i]+']') > -1) return R[i];
  }
  var s = (d.source||'').toString().toLowerCase(), l = (d.lane||'').toString().toLowerCase();
  /* Measured off 105 live events 2026-08-22: these three carry step telemetry
     and belong to the "steps" chip. netwatch and bare xen-out stay
     unclassified ON PURPOSE — no RAILS entry claims them, and inventing one
     would let a toggle hide traffic it never named. */
  if(l === 'steps' || s === 'xen-step' || s === 'otlp' || s === 'claude-code') return 'xen-step';
  return null;
}
const status = document.getElementById('status');
const statusLbl = document.getElementById('status-lbl');
const countEl = document.getElementById('count');
const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');

let recognition = null;
let listening = false;
// v16 2026-07-23: DURABLE mic intent — true from the moment qi arms the mic until
// he explicitly Stops. `listening` gets flipped false by onend/onerror/blur-abort,
// so it can't tell "qi wants mic on but engine died" from "qi stopped". _veiMicIntent
// is the source of truth the focus/visibility auto-recover consults to re-arm.
let _veiMicIntent = false;
let _reArmInFlight = false;   // guard: prevents visibility+focus double-firing a 2nd recognizer
// PERSISTED, not session-scoped. qi 2026-08-13 21:21 screenshot: the header read
// "0 SENT" with a full evening of his own messages rendered directly beneath it.
//
// Nothing was actually failing — postTranscript() does increment on success and his
// messages were arriving. But this was a bare `let sentCount = 0`, so every page reload

  // station, so the hour lands at the top of the viewport rather than centred

  // recording. The old line was `const h = new Date(t).getHours()` — 0..23 with
  // NO DATE — and `if (h === last) continue` only skipped CONSECUTIVE repeats.

  // the label is formatted `hour:'numeric'` with no date either, the rail read

  // construction: a rail whose order can invert is lying about time.
  const out = [];

  tlRail.querySelectorAll('.tl-st').forEach((n) => n.remove());

(function _tlScrub() {
  // ── THE OTHER HALF OF THE LOOP ─────────────────────────────────────────────
  // qi 2026-08-14 23:59: "the timeline should be the only way to scroll the chat
  // by the way. the timeline is how to scroll. the scroll moves the timeline and
  // timeline scrolls. they were not to be separate."
  // and earlier, 2026-08-13: "I wanted it to be able to scroll THROUGH the
  // timeline and every time I come back its only one hour."
  //
  // WHAT WAS ALREADY HERE was exactly one direction: #transcript scroll ->
  // _tlSync -> _tlMark lights the active station. Going the other way, a station
  // CLICK jumped to that hour's offsetTop. But a column of jump buttons is not a
  // scrollbar — there was no way to move CONTINUOUSLY through the day by dragging
  // the rail, and that missing half is precisely why the two read as separate
  // controls instead of one.
  //
  // Drag begins on a station, never on the rail: #tl-rail is pointer-events:none
  // now that it floats above live bubbles, so grabbing bare rail must not be a
  // requirement. setPointerCapture then hands us every subsequent move, which is
  // what lets the finger leave the 34px column and keep scrubbing.
  //
  // The mapping is pointer-Y over the RAIL's box -> the scroller's full range, so
  // the rail means document space — the same thing its tick placement already
  // means (see the #tl-rail header: ticks come from offsetTop over scrollHeight,
  // not from wall-clock spacing).
  //
  // scrollTop is assigned BARE here, never scrollTo({behavior:'smooth'}). A scrub
  // must track the finger frame-for-frame; smoothing a drag makes the content lag
  // behind the thumb and feel broken. Smooth stays where it belongs — the click
  // jump, which opts into it per call.
  try {
    if (!tlRail || !transcript) return;

    const SLOP = 4;          // px of travel before a press becomes a drag, not a tap
    let downY = 0, dragging = false, capturedOn = null;

    const scrubTo = (clientY) => {
      const r = tlRail.getBoundingClientRect();
      if (!r.height) return;
      const range = transcript.scrollHeight - transcript.clientHeight;
      if (range <= 0) return;
      let f = (clientY - r.top) / r.height;
      f = f < 0 ? 0 : f > 1 ? 1 : f;
      transcript.scrollTop = f * range;   // _tlSync fires off this and relights the station
    };

    tlRail.addEventListener('pointerdown', (e) => {
      const st = e.target.closest && e.target.closest('.tl-st');
      if (!st) return;
      downY = e.clientY;
      dragging = false;
      capturedOn = st;
      try { st.setPointerCapture(e.pointerId); } catch (_) {}
    });

    tlRail.addEventListener('pointermove', (e) => {
      if (!capturedOn) return;
      if (!dragging && Math.abs(e.clientY - downY) <= SLOP) return;
      dragging = true;
      e.preventDefault();
      scrubTo(e.clientY);
    });

    const release = (e) => {
      if (!capturedOn) return;
      try { capturedOn.releasePointerCapture(e.pointerId); } catch (_) {}
      capturedOn = null;
      // `dragging` is deliberately NOT cleared here. The click event fires AFTER
      // pointerup, and the capture-phase listener below reads this flag to decide
      // whether that click was the tail of a scrub (swallow it — the finger has
      // already put us where we want to be) or a genuine tap on a station (let it
      // through, so the existing smooth hour-jump still works untouched).
    };
    tlRail.addEventListener('pointerup', release);
    tlRail.addEventListener('pointercancel', release);

    tlRail.addEventListener('click', (e) => {
      if (!dragging) return;
      dragging = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);
  } catch (_) { /* same rule as _tlWire: a dead rail must not take the page down */ }
})();

(function _veiComposerClearance() {
  // Publishes --composer-h, which #transcript's padding-bottom is built on.
  //
  // WHY A MEASUREMENT AND NOT A NUMBER: .composer is position:absolute, so it is
  // OUT OF FLOW — #transcript cannot see it and scrolls straight underneath. The
  // padding was a hardcoded 100px. On 2026-08-10 23:21 .transcript-toolbar was
  // moved INTO .composer, the bar got taller, the 100px was never raised, and the
  // last message sat under the bar (qi 2026-08-12 18:25: "theres a margin under
  // the chat blocking the bottom of the face"). Nothing errored. It cannot error:
  // a constant that must track another element's height drifts silently forever.
  // .field textarea grows to max-height:120px, so the bar is not even a FIXED
  // height at runtime — no constant can be right.
  //
  // WHAT IS MEASURED: the OVERLAP — how far the composer's top edge rises above
  // the transcript's bottom edge. Not the composer's own height: it floats
  // env(safe-area-inset-bottom, 16px) off the bottom, and the two elements have
  // different parents (.composer in .wrap, #transcript in #tlwrap), so height
  // alone would be wrong on both counts. The overlap is correct no matter how the
  // DOM is nested or what the safe-area inset resolves to on the device.
  // The CSS adds its own + 16px on top of this, which is the visible gap between
  // the last bubble and the top of the bar.
  try {
    const composer = document.querySelector('.composer');
    if (!composer || !transcript) return;
    let last = -1;
    function publish() {
      // THE FORMULA ONLY MEANS ANYTHING WHILE THE COMPOSER OVERLAYS THE SCROLLER.
      //
      // In XOS the composer is MOVED OUT of this subtree into the swipe glass
      // (xos/app.jsx relocateComposer). Once it is gone, `t.bottom - c.top` stops
      // measuring an overlap and becomes the distance between two unrelated boxes —
      // and that is a RUNAWAY: padding-bottom makes #transcript taller, taller pushes
      // t.bottom down, which makes the "overlap" bigger, which adds more padding.
      // MEASURED 2026-08-12 22:2x: 3129px, then 3636px on the next run, climbing, with
      // the render gate reporting 2968px of the feed cut off.
      //
      // So the precondition is checked, not assumed: if the composer no longer shares
      // this scroller's offsetParent chain, there is nothing to clear and the answer is
      // 0 — the bare 16px gap from the CSS. This is also exactly right for the glass
      // mount, where the dock reserves its own space via --xos-dock-real.
      const detached = !composer.offsetParent ||
                       !transcript.parentElement ||
                       !transcript.parentElement.parentElement ||
                       !transcript.parentElement.parentElement.contains(composer);

          last = 0;

      const c = composer.getBoundingClientRect();

      // content, and scrollTop does not follow. If he was pinned to the bottom he
      // silently stops being pinned, and the newest bubble slides under the taller
      // bar with scrollable space beneath it that nothing scrolls into.
      //
      // MEASURED (Fable 5 review, 2026-08-12, headless reduction of this exact CSS):
      // composer 51 -> 134px, --composer-h 86 -> 169px, scrollTop stayed 693 while
      // maxScroll rose to 776 -> the last bubble ended up 67px OCCLUDED. Re-pinning
      // restored the designed +16px gap, which is what proves this is the whole fix.
      //
      // Scroll anchoring cannot save it: the growth is padding BELOW every child, so
      // there is no anchor element to adjust against.
      //
      // The trigger is NOT typing — there is no 'input' listener in this file at all,
      // so the textarea never auto-grows from keystrokes. It is injectToComposer(),
      // reached by paste and by text-drop, which the placeholder itself invites
      // ("Type, dictate, or paste"). Rotation and the on-screen keyboard hit the same
      // path by changing #transcript's height instead of the composer's.
      const wasAtBottom =
        transcript.scrollTop + transcript.clientHeight >= transcript.scrollHeight - 2;
      transcript.style.setProperty('--composer-h', overlap + 'px');
      if (wasAtBottom) transcript.scrollTop = transcript.scrollHeight;

    // px, so the first measurement is taken before the bar has its final size.
    if (document.fonts && document.fonts.ready) {

  if (res.status >= 500) throw new Error('http ' + res.status);

  // retrying won't fix a 400. Show inline so qi sees the failure and the queue

  // diagnosis), composes with Fix B server-side bodyKeys logging.

  const source = (kind === 'typed') ? 'xen-vei-typed' : 'xen-vei';
  const payload = { source, ts: Date.now(), text };

async function postAudioChunk(blob) {
  // Diagnostics: surface blob size + mime + URL so "Failed to fetch" gives
  // us actionable info instead of opaque browser-network errors.
  const blobInfo = `${blob?.size || 0}B ${blob?.type || 'no-type'}`;
  if (!blob || blob.size === 0) {
    appendError(`audio chunk EMPTY (${blobInfo}) — mic capture may be silenced`);
    return false;
  }
  try {
    const fd = new FormData();
    // Use mp4 extension if blob says mp4, else webm
    const ext = (blob.type && blob.type.includes('mp4')) ? 'mp4' : 'webm';
    fd.append('audio', blob, `chunk.${ext}`);
    fd.append('source', 'xen-vei-audio');
    fd.append('ts', Date.now().toString());
    const res = await fetch(AUDIO_URL, { method: 'POST', body: fd, mode: 'cors' });
    if (res.ok) {
      sentCount++;
      countEl.textContent = sentCount + ' chunks';
      const j = await res.json().catch(() => null);
      if (j && j.text) appendFinal(j.text, true);
      return true;
    } else {
      const errBody = await res.text().catch(() => '');
      appendError(`audio POST → HTTP ${res.status} ${errBody.slice(0, 80)}`);
      return false;
    }
  } catch (e) {
    appendError(`audio POST failed: ${e.name}: ${e.message} (${blobInfo} → ${AUDIO_URL})`);
    return false;
  }
}

// ─── Engine-independent server-side STT (any browser, incl. Comet/Android) ────
// 2026-06-11: NOT Whisper. The /api/dictate-audio endpoint is now backed by the
// Apple on-device STT sidecar (stt-sidecar.py:4458 behind cloudflared). Comet's
// Chromium lacks Google's Web Speech backend, so SpeechRecognition fails there;
// MediaRecorder works in EVERY browser. We record short utterances (VAD-style
// chunks) and POST each to the server, which transcribes + injects as in:.
// This is canon-aligned: Apple STT is the sole engine, Whisper is NOT used.
async function startMediaRecorder() {
  _veiMicIntent = true;   // qi wants the mic ON — auto-recover re-arms on focus return
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    setStatus('err', 'mic blocked');
    appendError('MIC BLOCKED — grant microphone access (lock/page icon → Permissions → Microphone → Allow; on Android also Settings → Apps → your browser → Permissions → Microphone). Then reload. Type below meanwhile.');
    startBtn.disabled = false;
    stopBtn.disabled = true;
    return;
  }
  // Pick a mime the browser actually supports. Chromium → webm/opus; Safari/iOS → mp4.
  let mime = '';
  for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mime = m; break; }
  }
  mediaMode = true;
  listening = true;
  setStatus('listen', 'listening (server STT)');
  startBtn.disabled = true;
  stopBtn.disabled = false;

  // Chunk-per-utterance loop: record fixed ~5s windows, POST each, repeat while
  // listening. Simple + robust (no WebSocket, survives flaky mobile networks).
  // The server returns the transcript and injects it; we render it locally too.
  const CHUNK_MS = 5000;
  function recordOneChunk() {
    if (!listening || !mediaStream) return;
    let chunks = [];
    let rec;
    try {
      rec = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
    } catch (e) {
      appendError('MediaRecorder init failed: ' + e.message);
      stopMediaRecorder();
      return;
    }
    mediaRecorder = rec;
    rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
    rec.onstop = async () => {
      if (chunks.length) {
        const blob = new Blob(chunks, { type: mime || 'audio/webm' });
        // Only POST if there's meaningful audio (skip near-empty silence windows).
        if (blob.size > 2000) {
          try { await postAudioChunk(blob); } catch (_) {}
        }
      }
      if (listening) recordOneChunk();  // loop to next window
    };
    rec.start();
    setTimeout(() => { if (rec.state !== 'inactive') { try { rec.stop(); } catch (_) {} } }, CHUNK_MS);
  }
  recordOneChunk();
}

  waveCanvas.height = Math.floor(h * dpr);

  // qi 2026-08-13 21:06/21:16: "not properly centered ... not full width", "the wave

  // is always correct by construction. The old line wrote `style.width = w + 'px'` —
  // an INLINE style, which beats the stylesheet — freezing the canvas at whatever the
  // container measured at that instant. From then on the CSS rule was dead.
  //
  // WHY THAT GOES STALE: this only re-ran on `window.resize`, but `.waveform` is
  // `flex:1` inside `.waveform-bar`. Its width changes with NO window resize at all —
  // the pill row wrapping, the textarea growing to max-height:120px, the on-screen
  // keyboard, a safe-area recalc. Every one of those leaves a stale px width behind,
  // and the canvas stops filling its box: narrower than the bar, hugging one edge.
  // That is exactly the "too far to the right / not full width" he is looking at.
  //
  // Keeping the CSS percentage means the ELEMENT is always the right size and only the
  // backing store needs recomputing here. Height stays explicit because the parent's
  // height is fixed (48px) and the percentage would resolve against a padding box that
  // the blur/backdrop layers perturb.
  waveCanvas.style.width = '';           // release it back to the stylesheet's 100%
  waveCanvas.style.height = h + 'px';

function drawWave(samples, listening) {
  const w = waveCanvas.width / (window.devicePixelRatio || 1);
  const h = waveCanvas.height / (window.devicePixelRatio || 1);
  waveCtx2d.clearRect(0, 0, w, h);
  // Skip drawing if amplitude is below silence threshold — no flat line baseline.
  // qi 2026-05-23: 'the sound wave should still work without starting with a line'.
  const N = samples.length;
  let peak = 0;
  for (let i = 0; i < N; i++) {
    const d = Math.abs(samples[i] - 128);
    if (d > peak) peak = d;
  }
  const SILENCE_THRESHOLD = 6;  // out of 128 — below this, no draw
  if (peak < SILENCE_THRESHOLD) return;
  // Amplitude-driven opacity ramp so soft voice doesn't slam into full glow
  const ampScale = Math.min(1, (peak - SILENCE_THRESHOLD) / 40);
  const mid = h / 2;
  waveCtx2d.lineWidth = 1.4;
  waveCtx2d.strokeStyle = '#00FF88';
  waveCtx2d.shadowColor = 'rgba(0,255,136,.85)';
  waveCtx2d.shadowBlur = 6 + 12 * ampScale;
  waveCtx2d.globalAlpha = 0.45 + 0.55 * ampScale;
  waveCtx2d.beginPath();
  for (let i = 0; i < N; i++) {
    const x = (i / (N - 1)) * w;
    const norm = (samples[i] - 128) / 128;
    const y = mid + norm * mid * 0.92;
    if (i === 0) waveCtx2d.moveTo(x, y);
    else waveCtx2d.lineTo(x, y);
  }
  waveCtx2d.stroke();
  // Secondary inner glow line
  waveCtx2d.lineWidth = 3.0;
  waveCtx2d.strokeStyle = 'rgba(0,255,136,.22)';
  waveCtx2d.shadowBlur = 0;

  waveCtx2d.globalAlpha = 1;
}

// ─── Energy VAD + barge-in cuts (qi 2026-06-09: "web vad and barge in cuts") ──
// Hands-free barge-in. The visualizer's AnalyserNode already hands us the raw mic
// waveform every animation frame, so we compute short-time RMS energy on it — no
// extra dependency, no Silero/ONNX model that could fail to load (reliability >
// accuracy for a voice OS whose breakage paralyzes qi). On a speech ONSET we cut
// Ava mid-sentence through the existing _avaBargeIn(); echoCancellation on the
// analyser stream keeps her own playback from self-triggering the cut.
let _vadSpeaking = false;        // currently inside a detected speech segment
let _vadHot = 0;                 // consecutive frames above threshold (onset debounce)
let _vadCold = 0;                // consecutive frames below threshold (offset debounce)
let _vadFloor = 0.012;           // adaptive noise floor (EMA), seeded at a quiet-room guess
const VAD_ONSET_FRAMES = 4;      // ~66ms @60fps of energy before we trust it's real speech
const VAD_OFFSET_FRAMES = 12;    // ~200ms of quiet ends the segment and re-arms the cut
const VAD_ABS_MIN = 0.045;       // absolute floor so a silent room can't collapse the
                                 // adaptive threshold to ~0 and trigger on faint hiss
function _vadCheck(samples) {
  // Short-time RMS of the centered waveform (bytes 0..255, 128 = silence).
  let sum = 0;
  for (let i = 0; i < samples.length; i++) { const v = (samples[i] - 128) / 128; sum += v * v; }
  const rms = Math.sqrt(sum / samples.length);
  const avaActive = _avaPlaying || (_avaQueue && _avaQueue.length > 0);
  // Adapt the noise floor ONLY while Ava is silent — otherwise her playback (even the
  // post-AEC residue) inflates the floor and qi would have to shout to barge in.
  if (!avaActive) _vadFloor = _vadFloor * 0.95 + rms * 0.05;
  const thresh = Math.max(VAD_ABS_MIN, _vadFloor * 2.4);
  if (rms > thresh) { _vadHot++; _vadCold = 0; } else { _vadCold++; _vadHot = 0; }
  // Rising edge → speech onset confirmed: cut Ava the instant qi talks over her.
  if (!_vadSpeaking && _vadHot >= VAD_ONSET_FRAMES) {
    _vadSpeaking = true;
    if (avaActive) _avaBargeIn();
  }
  // Falling edge → segment ended; next onset re-arms the cut.
  if (_vadSpeaking && _vadCold >= VAD_OFFSET_FRAMES) { _vadSpeaking = false; }
}

function tickListening() {
  if (!analyser) return;
  const samples = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(samples);
  _vadCheck(samples);          // energy VAD → barge-in cut (qi 2026-06-09)
  drawWave(samples, true);
  rafId = requestAnimationFrame(tickListening);
}

function clearWave() {

// Is the analyser actually ALIVE, or just non-null? These are different questions,
// and conflating them is what made the wave vanish permanently.
// qi 2026-08-13 21:11: "the sound wave is not there anymore its gone" — while TALKING,
// so this is not the silence threshold; the meter was genuinely dead.
//
// THREE WAYS IT DIES WHILE `analyser` STAYS TRUTHY:
//   1. The mic track ENDS — another tab/app takes the device, the OS interrupts for a
//      call, or the user switches input. track.readyState flips to "ended" and the
//      AnalyserNode keeps returning a flat 128 forever.
//   2. The AudioContext is SUSPENDED — browsers suspend it when the page backgrounds,
//      and nothing here ever resumed it. Coming back to the tab does NOT auto-resume.
//   3. The rAF loop was cancelled but analyser survived.
// In all three the object is still there, so `if (analyser) return` short-circuits every
// recovery attempt. The ONLY escape was toggling the mic off and on by hand — a tap,
// which is canon 4's definition of total failure.
function _analyserAlive() {
  if (!analyser || !analyserStream) return false;
  const tracks = analyserStream.getAudioTracks ? analyserStream.getAudioTracks() : [];
  if (!tracks.length) return false;
  // "live" is the only readyState that means data is still flowing.
  if (!tracks.some(t => t.readyState === 'live' && t.enabled)) return false;
  if (audioCtx && audioCtx.state === 'closed') return false;
  return true;
}

async function startAnalyser() {
  // Resume-then-recheck: a suspended context is recoverable WITHOUT re-prompting for
  // the mic, so try that before tearing anything down. Re-acquiring getUserMedia
  // unnecessarily can re-trigger a permission UI, which is its own tap.
  if (analyser && audioCtx && audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch (_) {}
  }
  if (_analyserAlive()) {
    // Alive but not painting => the rAF loop was lost. Restart just the loop.
    if (!rafId) rafId = requestAnimationFrame(tickListening);
    return;
  }
  // Stale husk: tear it down completely so the rebuild below is clean. Without this
  // the old context leaks and the new source connects to a dead graph.
  if (analyser || analyserStream || audioCtx) {
    try { stopAnalyser(); } catch (_) {}
  }
  try {
    // echoCancellation is the load-bearing flag (qi 2026-06-09): it subtracts Ava's
    // own TTS playback from the mic signal so her voice does NOT self-trigger the VAD
    // barge-in below. noiseSuppression cleans hiss; autoGainControl normalizes level.
    // This is the analyser-only stream — Web Speech STT runs its own internal stream,
    // so these constraints never affect recognition accuracy.
    analyserStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(analyserStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.78;
    source.connect(analyser);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tickListening);
  } catch (e) {
    appendError('mic visualizer denied: ' + e.message);
  }
}

function stopAnalyser() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (analyser) { try { analyser.disconnect(); } catch (_) {} analyser = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; }
  if (analyserStream) { analyserStream.getTracks().forEach(t => t.stop()); analyserStream = null; }
  clearWave();   // no idle line — canvas stays empty when not listening
}

// ─── ANALYSER WATCHDOG — the meter comes back BY ITSELF ─────────────────────
// A detection without an automatic recovery still costs qi a tap, and a tap is total
// failure (canon 4). _analyserAlive() above only makes the death VISIBLE; this is what
// makes it TEMPORARY.
//
// Runs only while he has the mic on (viz_listening), so it never re-prompts for a
// device he deliberately turned off. 2s is slow enough to be free and fast enough that
// a dropped track is back before he finishes the sentence he is already speaking.
//
// visibilitychange is the common case, not an edge case: he switches to another app,
// the browser suspends the AudioContext, he comes back — and before this, the meter was
// dead for the rest of the session with no error anywhere. Silent, permanent, and
// indistinguishable from "the feature is broken".
(function _analyserWatchdog() {
  try {
    setInterval(() => {
      if (!viz_listening) return;          // he turned it off — respect that
      if (_analyserAlive() && rafId) return;
      startAnalyser();                     // idempotent: resumes, restarts, or rebuilds
    }, 2000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && viz_listening) startAnalyser();
    });

})();

const _origAppendFinal = appendFinal;
// Double-input fix (qi 2026-05-30): qi's dictation renders LOCALLY here (Web
// Speech) AND again when omnimind echoes it back over SSE as xen-dictate-in.
// Register each locally-rendered line so the SSE echo can be suppressed.
const _localDictated = new Map(); // normText -> ts
function _normDict(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
appendFinal = function(text, postedFlag) {

  // missing" / "I dont get a indicator that it posted on my chat bubble like Im
  // supposed to".
  // This wrapper called _origAppendFinal(...) and THREW AWAY its return value, so it
  // returned undefined. Both callers do `const finalDiv = appendFinal(text, false)`
  // and then `if (posted && finalDiv && ...)` before appending the ✓ (voice :1487,
  // typed :915) — with finalDiv undefined that condition can never be true, so the
  // badge was unreachable by construction no matter how healthy the post was.
  // MEASURED the same minute: his lines were arriving in the seat with exact
  // timestamps while his own screen showed no confirmation at all. A working rail
  // that cannot say so is indistinguishable from a broken one — that is the whole
  // lesson of tonight, and here it was one missing `return`.
  // Fall back to :last-child so a future refactor of the original cannot silently
  // re-break the badge.
  const _node = _origAppendFinal(text, postedFlag);
  const lastFinal = transcript.querySelector('.final:last-child');
  if (lastFinal) attachBubbleActions(lastFinal, text);
  const k = _normDict(text);
  if (k) { _localDictated.set(k, Date.now());
    if (_localDictated.size > 50) { for (const [kk,vv] of _localDictated) { if (Date.now()-vv > 30000) _localDictated.delete(kk); } } }

  // so its incoming SSE echo (same text, ~same time) is suppressed in renderEvent
  // and never renders a second time. Claims current + next 5s bucket to cover lag.
  try {
    const now = Date.now();

  // `_node` is what the original built; `lastFinal` is the belt-and-braces fallback

  return _node || lastFinal;

// ─── Top toolbar: copy-all / export / share / attach ─────────────────────
// qi 2026-05-23 17:57: "Export only exported a partial version" — the old
// selector only captured .final + .xen-reply, dropping .interim bubbles
// (in-progress utterances that never finalized — large with the fire-and-
// forget model since Web Speech can park final-promotion indefinitely) and
// .firehose bubbles (inbound events from other sources). Now exports the
// FULL visible transcript in DOM order, tagged by bubble type.
function collectTranscriptText() {
  const out = [];
  // qi 2026-05-23 17:57: pull FULL thread from localStorage (the actual archive),
  // not just rendered DOM (only the last N visible bubbles). Includes timestamps
  // per qi canon "everything needs to be timestamped."
  try {
    const activeId = (typeof _activeThreadId !== 'undefined' && _activeThreadId) ? _activeThreadId : null;
    const entries = activeId ? loadThreadEntries(activeId) : [];
    if (entries && entries.length) {
      for (const e of entries) {
        const role = (e.role || 'you').toString().toUpperCase();
        const ts = e.ts ? new Date(e.ts).toLocaleString() : '';
        const txt = (e.text || '').toString().trim();
        if (txt) out.push(`[${ts}] ${role}: ${txt}`);
      }
      return out.join('\n');
    }
  } catch (_) {}
  // Fallback: scrape DOM if localStorage history is empty.
  transcript.querySelectorAll('.final, .interim, .xen-reply, .firehose').forEach(el => {
    const role =
      el.classList.contains('xen-reply') ? 'XEN' :
      el.classList.contains('firehose') ? 'FIREHOSE' :
      el.classList.contains('interim') ? 'YOU?' :
      'YOU';

    t.querySelectorAll('.bubble-actions, .posted, .src').forEach(n => n.remove());
    const txt = t.textContent.trim();

}

// Drag-drop on the whole page — accepts FILES AND FOLDERS. qi 2026-05-25 08:45
// PT "I try to drag a whole folder into the UI and it didn't work". Folders
// are walked recursively via webkitGetAsEntry; every file inside ships to
// /api/dictate-attach with a relative-path prefix so the server preserves
// folder structure.
(function wireDragDrop() {
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  let depth = 0;
  function setActive(on) {
    document.body.classList.toggle('drop-active', !!on);
  }
  ['dragenter','dragover'].forEach(ev =>
    document.addEventListener(ev, (e) => { stop(e); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; if (ev === 'dragenter') depth++; setActive(true); })
  );
  document.addEventListener('dragleave', (e) => {
    stop(e);
    depth = Math.max(0, depth - 1);
    if (depth === 0) setActive(false);
  });

  // Recursive walk over a FileSystemEntry (browser File API directory entry).
  // Returns array of File objects with __path set to the relative path.
  function walkEntry(entry, pathPrefix = '') {
    return new Promise((resolve) => {
      if (!entry) return resolve([]);
      if (entry.isFile) {
        entry.file(
          (file) => { file.__path = pathPrefix + file.name; resolve([file]); },
          () => resolve([])
        );
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const collected = [];
        const readBatch = () => reader.readEntries(async (entries) => {
          if (!entries.length) return resolve(collected);
          for (const e of entries) {
            const sub = await walkEntry(e, pathPrefix + entry.name + '/');
            collected.push(...sub);
          }
          readBatch(); // keep reading until empty (some browsers chunk readEntries)
        }, () => resolve(collected));
        readBatch();
      } else {
        resolve([]);
      }
    });
  }

  document.addEventListener('drop', async (e) => {
    stop(e);
    depth = 0;
    setActive(false);
    const dt = e.dataTransfer;
    if (!dt) return;
    const items = dt.items ? Array.from(dt.items) : [];
    let collected = [];
    // Prefer items[] which can expose directories via webkitGetAsEntry().
    if (items.length && items[0].webkitGetAsEntry) {
      for (const it of items) {
        const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
        if (entry) {
          const sub = await walkEntry(entry);
          collected.push(...sub);
        } else if (it.kind === 'file') {
          const f = it.getAsFile && it.getAsFile();
          if (f) collected.push(f);
        }
      }
    }
    // Fallback: plain files[] (no folder support, but covers older drag sources).
    if (!collected.length && dt.files && dt.files.length) {
      collected = Array.from(dt.files);
    }
    if (collected.length) {
      appendError(`drag-drop · ${collected.length} file${collected.length === 1 ? '' : 's'} queued`);
      await uploadAttachments(collected);
    }
  });
})();

// ─── Paste-anywhere + text-drop-anywhere → composer input ──────────────
// qi 2026-05-25 09:16-09:17 PT: same idea as drag-drop files but for text —
// cmd-V paste from any focus state, or dragging selected text from anywhere
// on the page (or another window), should auto-route into the chat composer.
(function pasteAndTextDropAnywhere() {
  function injectToComposer(text) {
    if (!text) return;
    const t = String(text);
    // Append (preserve any existing draft) with a space separator if needed.
    const current = fbText.value;
    fbText.value = current ? (current.endsWith('\n') ? current + t : current + (current ? '\n' : '') + t) : t;
    fbText.dispatchEvent(new Event('input', { bubbles: true }));
    fbText.focus();
    // Auto-grow if your CSS supports it
    try { fbText.style.height = 'auto'; fbText.style.height = fbText.scrollHeight + 'px'; } catch (_) {}
  }

  // Paste anywhere on page — if focus isn't already in the textarea, capture
  // clipboard text and route it. If the user is pasting into the textarea
  // directly, leave the default behavior alone.
  document.addEventListener('paste', (e) => {
    const active = document.activeElement;
    if (active === fbText) return; // user is already in the input, default paste handles it
    if (!e.clipboardData) return;
    const text = e.clipboardData.getData('text/plain');
    if (!text) return;
    e.preventDefault();
    injectToComposer(text);
  });

  // Drag-drop TEXT (already dragged-and-dropped from another app or selection).
  // The file drop handler above already preventDefaults and reads dataTransfer;
  // we extend it to also pick up text/plain when no files are in the transfer.
  document.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    if (!dt) return;
    // If files dropped, the earlier listener handled it. Only route text when
    // no files came with the drop.
    const hasFiles = (dt.files && dt.files.length) || (dt.items && Array.from(dt.items).some((it) => it.kind === 'file'));
    if (hasFiles) return;
    const text = dt.getData && (dt.getData('text/plain') || dt.getData('text'));
    if (!text) return;
    // The earlier drop handler already preventDefault'd; just route.
    injectToComposer(text);
  }, true); // capture phase so we see it before the file-walk handler bails on no files
})();

// and saveHistory returned normally. The thread looked saved and was not.

// There is no eviction anywhere, so keys accumulate to the ~5MB origin cap forever.
// It compounds because saveHistory re-serializes the ENTIRE thread on EVERY turn,
// and `__reload__` force-reloads every tab on every deploy while
// freshThreadOnReload mints a NEW thread each load — so thread count grows at

// is worse. Report the failure, keep every byte, let the operator decide.

      if (typeof appendError === 'function') {
