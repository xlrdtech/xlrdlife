<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>AUXGEN // SPATIAL NAVIGATOR</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@100;400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090e17;
      --ink: #ffffff;
      --accent: #00e5ff;
      --dim: rgba(255, 255, 255, 0.5);
      --glass: rgba(9, 14, 23, 0.4);
      --border: rgba(0, 229, 255, 0.2);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      height: 100%; 
      background: var(--bg); 
      overflow: hidden; 
      touch-action: none; 
      font-family: 'Inter', sans-serif; 
      color: var(--ink);
      overscroll-behavior: none;
    }
    
    canvas { 
      display: block; 
      position: fixed; 
      inset: 0; 
      outline: none; 
      z-index: 1;
    }

    /* UI Overlay Layer */
    .ui-layer {
      position: fixed; 
      inset: 0; 
      pointer-events: none; 
      z-index: 10;
      padding: clamp(20px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      font-size: clamp(16px, 2vw, 20px);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    
    .brand h1 span { color: var(--accent); }
    
    .brand p {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .telemetry {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.1em;
      color: var(--dim);
      background: var(--glass);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .telemetry b { color: var(--accent); font-weight: 400; }
    .telemetry .warning { color: #ff3366; }

    /* Interactive Progress UI */
    .navigation-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .instruction {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--ink);
      text-transform: uppercase;
      font-weight: 300;
      opacity: 0.8;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    .progress-track {
      width: 100%;
      max-width: 400px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: -1px;
      height: 4px;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.1s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translate(50%, -50%);
      width: 12px;
      height: 12px;
      background: var(--ink);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--accent);
    }

    /* Pre-loader UI */
    #loader {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: flex; justify-content: center; align-items: center;
      flex-direction: column; color: var(--accent); font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.2em; transition: opacity 1s;
    }
  </style>
</head>
<body>

<div id="loader">GENERATING SPATIAL TOPOLOGY...</div>

<div class="ui-layer">
  <div class="header">
    <div class="brand">
      <h1>AUXGEN<span>//</span>EXPEDITION</h1>
      <p>Spline Trajectory Protocol</p>
    </div>
    <div class="telemetry">
      <div>FPS: <b id="fps">--</b></div>
      <div>Z-DEPTH: <b id="depth">0.00</b>m</div>
      <div>HEALING: <b id="healing">STANDBY</b></div>
    </div>
  </div>
  
  <div class="navigation-ui">
    <div class="instruction">Swipe to explore</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/gsap@3.13.0/dist/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// DOM Elements
const DOM = {
  fps: document.getElementById('fps'),
  depth: document.getElementById('depth'),
  healing: document.getElementById('healing'),
  progressBar: document.getElementById('progress-bar'),
  loader: document.getElementById('loader')
};

// State Management for Spatial Navigation
const State = {
  progress: 0,       // Current smoothed position on spline (0 to 1)
  targetProgress: 0, // Desired position based on user input
  velocity: 0,       // Calculated speed for FOV stretching
  parallaxX: 0,
  parallaxY: 0,
  time: 0
};

// --- CORE THREE.JS SETUP ---
const scene = new THREE.Scene();
// Deep, atmospheric fog to create depth and hide the end of the tunnel
scene.fog = new THREE.FogExp2(0x090e17, 0.0018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
let currentPixelRatio = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(currentPixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Physical Environment for Reflections (Hyper-realism crucial step)
const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

// Post-Processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// Soft bloom for glowing elements
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.8, 0.1);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

//
// Create a winding 3D trajectory (The Path)
const curvePoints = [];
const curveLength = 4000;
const numPoints = 60;

for (let i = 0; i <= numPoints; i++) {
  const t = i / numPoints;
  // Procedural meandering path
  const x = Math.sin(t * Math.PI * 4) * 300 + Math.cos(t * Math.PI * 2) * 100;
  const y = Math.cos(t * Math.PI * 3) * 150 + Math.sin(t * Math.PI * 1.5) * 50;
  const z = -t * curveLength; // Move deep into the screen
  curvePoints.push(new THREE.Vector3(x, y, z));
}

// CatmullRomCurve3 ensures smooth interpolation between points
const trajectory = new THREE.CatmullRomCurve3(curvePoints);
trajectory.tension = 0.5;

// Optional: Visualize the path (debugging/aesthetic choice, keeping it invisible for realism)
// const tubeGeom = new THREE.TubeGeometry(trajectory, 200, 2, 8, false);
// const tubeMat = new THREE.MeshBasicMaterial({color: 0xffffff, wireframe: true, transparent: true, opacity: 0.05});
// scene.add(new THREE.Mesh(tubeGeom, tubeMat));


//
// Master Materials
const frostedGlassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.1,
  roughness: 0.2,
  transmission: 0.95, // Glass-like transparency
  thickness: 5.0,     // Refraction thickness
  ior: 1.5,
  envMapIntensity: 1.5,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
});

const darkMatteMaterial = new THREE.MeshStandardMaterial({
  color: 0x05080f,
  roughness: 0.8,
  metalness: 0.2,
});

const emissiveMaterial = new THREE.MeshStandardMaterial({
  color: 0x00e5ff,
  emissive: 0x00e5ff,
  emissiveIntensity: 2.0,
});

const worldGroup = new THREE.Group();
scene.add(worldGroup);

// Geometries
const capsuleGeo = new THREE.CapsuleGeometry(15, 40, 16, 32);
const sphereGeo = new THREE.SphereGeometry(10, 32, 32);
const octahedronGeo = new THREE.OctahedronGeometry(25, 0);

// Populate the environment ALONG the spline
const numObjects = 400;
for (let i = 0; i < numObjects; i++) {
  // Pick a random point along the curve (t = 0 to 1)
  const t = Math.random();
  const pointOnCurve = trajectory.getPointAt(t);
  
  // Calculate tangent to orient objects along the path
  const tangent = trajectory.getTangentAt(t).normalize();
  
  // Offset the object from the center of the path
  const offsetRadius = 40 + Math.random() * 200; // Keep path clear in center
  const offsetAngle = Math.random() * Math.PI * 2;
  
  // Create a perpendicular vector to offset
  const up = new THREE.Vector3(0, 1, 0);
  const axis = new THREE.Vector3().crossVectors(up, tangent).normalize();
  const quaternion = new THREE.Quaternion().setFromAxisAngle(tangent, offsetAngle);
  
  const offset = new THREE.Vector3(0, offsetRadius, 0).applyQuaternion(quaternion);
  
  // Choose material and geometry
  let mesh;
  const rand = Math.random();
  if (rand < 0.5) {
    mesh = new THREE.Mesh(capsuleGeo, frostedGlassMaterial);
    // Align capsule somewhat with the path
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tangent);
    // Add some random tilt
    mesh.rotateX(Math.random() * 0.5);
  } else if (rand < 0.85) {
    mesh = new THREE.Mesh(octahedronGeo, darkMatteMaterial);
    const scale = 1 + Math.random() * 3;
    mesh.scale.set(scale, scale, scale);
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  } else {
    mesh = new THREE.Mesh(sphereGeo, emissiveMaterial);
    mesh.scale.setScalar(0.2 + Math.random() * 0.8);
  }

  // Position mesh
  mesh.position.copy(pointOnCurve).add(offset);
  
  // Store a random rotation speed for animation
  mesh.userData.rotSpeed = new THREE.Vector3(
    (Math.random() - 0.5) * 0.01,
    (Math.random() - 0.5) * 0.01,
    (Math.random() - 0.5) * 0.01
  );

  worldGroup.add(mesh);
}

// Ambient Particulates (Snow/Dust)
const particlesGeo = new THREE.BufferGeometry();
const particleCount = 3000;
const posArray = new Float32Array(particleCount * 3);
for(let i = 0; i < particleCount * 3; i++) {
  // Scatter particles within a large bounding box
  posArray[i] = (Math.random() - 0.5) * 1500;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const particlesMat = new THREE.PointsMaterial({
  size: 2,
  color: 0x00e5ff,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending
});
const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
scene.add(particlesMesh);


//
// Interaction Logic
let isDragging = false;
let startY = 0;
const scrollSensitivity = 0.0003; // Controls how fast you move through the tunnel

function handleMove(deltaY) {
  // Map vertical movement to trajectory progress
  State.targetProgress -= deltaY * scrollSensitivity;
  // Clamp between 0 and 0.99 (avoid reaching exact end to prevent lookAt errors)
  State.targetProgress = THREE.MathUtils.clamp(State.targetProgress, 0, 0.99);
}

// Touch Events
window.addEventListener('touchstart', (e) => {
  isDragging = true;
  startY = e.touches[0].clientY;
  document.querySelector('.instruction').style.opacity = '0'; // Hide instruction
}, { passive: true });

window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const currentY = e.touches[0].clientY;
  const deltaY = currentY - startY;
  handleMove(deltaY);
  startY = currentY; // Reset for continuous delta
}, { passive: true });

window.addEventListener('touchend', () => {
  isDragging = false;
});

// Mouse/Trackpad Drag Events
window.addEventListener('pointerdown', (e) => {
  isDragging = true;
  startY = e.clientY;
  document.querySelector('.instruction').style.opacity = '0';
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const currentY = e.clientY;
  const deltaY = currentY - startY;
  handleMove(deltaY * 2); // Mouse drag needs a bit more sensitivity
  startY = currentY;
});

window.addEventListener('pointerup', () => {
  isDragging = false;
});

// Mouse Wheel / Trackpad Scroll Events
window.addEventListener('wheel', (e) => {
  document.querySelector('.instruction').style.opacity = '0';
  // Use deltaY for standard vertical scrolling
  handleMove(e.deltaY * 2); 
}, { passive: true });

// Gyroscopic Parallax (Subtle look-around based on device tilt)
window.addEventListener('deviceorientation', (e) => {
  if (e.beta === null || e.gamma === null) return;
  // Normalize angles to -1 to 1
  const ax = THREE.MathUtils.clamp((e.gamma || 0) / 45, -1, 1);
  const ay = THREE.MathUtils.clamp(((e.beta || 0) - 45) / 45, -1, 1);
  
  // Smoothly interpolate parallax target
  gsap.to(State, { parallaxX: ax, parallaxY: ay, duration: 0.5, overwrite: 'auto' });
}, { passive: true });


//
let frames = 0;
let prevTime = performance.now();

function runAutoHealing() {
  const time = performance.now();
  frames++;
  if (time >= prevTime + 1000) {
    const fps = Math.round((frames * 1000) / (time - prevTime));
    DOM.fps.textContent = fps;
    
    // Auto-heal logic: degrade pixel ratio if FPS drops below 45
    if (fps < 45 && currentPixelRatio > 1) {
      currentPixelRatio = Math.max(1, currentPixelRatio - 0.25);
      renderer.setPixelRatio(currentPixelRatio);
      DOM.healing.textContent = 'ACTIVE (DOWNRES)';
      DOM.healing.classList.add('warning');
    } else if (fps >= 58 && currentPixelRatio < Math.min(window.devicePixelRatio, 2)) {
      currentPixelRatio = Math.min(window.devicePixelRatio, currentPixelRatio + 0.25);
      renderer.setPixelRatio(currentPixelRatio);
      DOM.healing.textContent = 'ACTIVE (UPRES)';
      DOM.healing.classList.remove('warning');
    } else {
      DOM.healing.textContent = 'STANDBY';
      DOM.healing.classList.remove('warning');
    }
    
    frames = 0;
    prevTime = time;
  }
}

function animate() {
  requestAnimationFrame(animate);
  State.time += 0.01;
  
  runAutoHealing();

  // 1. Calculate Velocity & Smooth Progress
  const previousProgress = State.progress;
  // LERP provides the buttery smooth "Igloo.inc" scrolling feel
  State.progress = THREE.MathUtils.lerp(State.progress, State.targetProgress, 0.08);
  State.velocity = Math.abs(State.progress - previousProgress);

  // Update UI Progress Bar
  DOM.progressBar.style.width = `${State.progress * 100}%`;
  DOM.depth.textContent = (State.progress * curveLength).toFixed(1);

  // 2. Camera Positioning along Spline
  // Get exact position on curve
  const camPos = trajectory.getPointAt(State.progress);
  // Get point slightly ahead to look at
  const lookAtPos = trajectory.getPointAt(Math.min(State.progress + 0.02, 1.0));

  // Apply base position
  camera.position.copy(camPos);
  
  // Apply Parallax (Device orientation offsets the camera slightly)
  // Calculate right and up vectors based on look direction to ensure parallax is relative to view
  const viewDir = new THREE.Vector3().subVectors(lookAtPos, camPos).normalize();
  const upVec = new THREE.Vector3(0, 1, 0);
  const rightVec = new THREE.Vector3().crossVectors(viewDir, upVec).normalize();
  const trueUpVec = new THREE.Vector3().crossVectors(rightVec, viewDir).normalize();
  
  // Offset camera by parallax values
  camera.position.addScaledVector(rightVec, State.parallaxX * 20);
  camera.position.addScaledVector(trueUpVec, -State.parallaxY * 20);

  // Finally look at target
  camera.lookAt(lookAtPos);

  // Dynamic FOV based on velocity (Speed warp effect)
  const targetFOV = 60 + (State.velocity * 5000); // 5000 is an arbitrary multiplier for effect
  camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.1);
  camera.updateProjectionMatrix();

  // 3. Environmental Animation
  // Rotate floating objects slowly
  worldGroup.children.forEach(child => {
    if (child.userData.rotSpeed) {
      child.rotation.x += child.userData.rotSpeed.x;
      child.rotation.y += child.userData.rotSpeed.y;
      child.rotation.z += child.userData.rotSpeed.z;
    }
  });

  // Slowly rotate particulate matter
  particlesMesh.position.copy(camPos); // Keep particles around camera
  particlesMesh.rotation.y = State.time * 0.05;
  particlesMesh.rotation.z = State.time * 0.02;

  // Render Scene
  composer.render();
}

// Window Resizing
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Remove loader after initial compile
setTimeout(() => {
  DOM.loader.style.opacity = '0';
  setTimeout(() => {
    DOM.loader.remove();
    // Auto-scroll slightly to hint at functionality
    gsap.to(State, {targetProgress: 0.05, duration: 2, ease: "power2.out", delay: 0.5});
  }, 1000);
}, 1500);

// Initiate Loop
animate();

</script>
</body>
</html>
