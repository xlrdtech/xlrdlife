<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>XEN LIFE — assembled</title>
<meta name="description" content="Canonical three-pane assembly. Mounts the live surfaces same-origin with per-pane URL rebasing and CSS scoping. No iframe.">
<meta name="theme-color" content="#06080A">

<!-- PWA head — qi 2026-08-20 22:24: "Its a pure PWA. It does not need iOS or Android at all."
     Copied from the pattern already proven in xos-capacitor/www/index.html. NO Capacitor,
     no native shell: apple-mobile-web-app-capable + viewport-fit=cover (already on line 5)
     is what makes env(safe-area-inset-*) resolve to REAL device insets once the page is
     launched from the home screen. black-translucent lets the view extend under the status
     bar, which is the half that actually produces the inset. -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XEN LIFE">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  // Register late and never block first paint. sw.js is network-first for everything but
  // the icons, so it cannot serve stale code (see the comment header in sw.js).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {
        /* a failed SW registration must never break the app */
      });
    });
  }
</script>
<style>
/* ══ tokens: LifeNote's own, read off lifenote/index.html ══ */
:root{
  --bg:#06080A; --jade:#00FF7F; --ink:#E8EAE8; --resolve:#7CFF9B;
  --heavy:#6B7280; --luminous:#00FFC2; --restless:#F59E0B;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --line:rgba(0,255,127,.14); --glass:rgba(10,14,12,.72);
  /* CANONICAL SWIPE GLASS geometry, ported from xos-capacitor/www/styles.css.
     --sab is 0 BY DECREE (qi 2026-08-13 22:42, twice): the inset was the only thing
     between his design and the bottom of the screen, and it cost him a clipped wave.
     --dock-h 60px is the value XOS always resolved to, since nothing ever set it. */
  --dock-h:60px; --sab:0px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.panes{display:flex;height:100vh;width:300vw;transition:transform .38s cubic-bezier(.22,1,.36,1);will-change:transform}
.pane{width:100vw;height:100vh;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* CRITICAL — the pane is a containment boundary. Codex 2026-08-20 measured
   "top filters/nav overlap and clip" + "/life CSS overlaps severely" because a
   mounted limb's position:fixed escaped its pane and its 100vh blew the box.
   contain + transform creates a new containing block so fixed becomes
   pane-relative, which is what an iframe gave us for free. */
/* ⭐ TOP INSET — from qi's OWN HANDSET SHOT, IMG_1661.png, 2026-08-21 12:40.
   MEASURED FROM THE SCREENSHOT (not inferred): his kicker-bar and the "Dialpad · 131"
   badge were rendering UNDERNEATH the iOS status bar — faint ghost text bleeding through
   behind the 12:40 clock and the battery. That is also why a byte-grep for the badge text
   returned 0 while the element existed: it was present and hidden.

   CAUSE, AND IT IS MINE: I added `apple-mobile-web-app-status-bar-style: black-translucent`
   the night before, copied from XOS. black-translucent is DEFINED to extend the web view
   under the status bar. XOS compensates with its own top strip; this document had no top
   inset at all, so the first row slid under the clock.

   WHY env() AND NOT A PIXEL NUMBER: his ?geo=1 probe reported top=0, but that probe ran in
   Safari — in a standalone home-screen launch with black-translucent, inset-top becomes the
   real device value. env() resolves to 0 in every browser I can drive, so this CANNOT change
   the desktop view; on his handset it can only supply the inset that was missing.

   --sat mirrors his --sab knob: one line to zero it if he wants the overlap back. His
   "no safe area" decree (2026-08-13 22:42) was explicitly about the BOTTOM gap; this is the
   opposite failure — content HIDDEN, not space added. */
.mount{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  position:relative;transform:translateZ(0);contain:layout paint style;
  --sat:env(safe-area-inset-top, 0px);
  padding-top:var(--sat);padding-bottom:78px}

/* ── DOCK HIT + APP DRAWER ──  replaces .swipeglass  (qi 2026-08-20 21:31)
   MEASURED DEFECT THIS REPLACES: the old .swipeglass was a full bar at
   z-index 2147483000 pinned to bottom:0. In a 720x865 viewport the composer's
   SAVE button centred at y=814 — under the glass. elementFromPoint(677,814)
   returned "glass", not the button, so SAVE was visibility:visible and
   physically unclickable. DOM presence is not reachability.
   The dock keeps its z-index and its glass; the COMPOSER gets clearance
   instead (see .composer padding-bottom below) — his dock is never restyled
   to accommodate my element. */
/* ═══ CANONICAL SWIPE GLASS — qi 2026-08-20 22:53: "the canonical swipe glass from xos
   is MANDATORY" + "CANONICAL". Ported from xos-capacitor/www/styles.css, extracted from
   the LIVE rendered /xos/ DOM, not retyped from the 186KB app.jsx.

   WHAT WAS WRONG: .dock-hit here was doing two jobs — it WAS the glass and the hit
   target, in one 26px bar. Canonical is 60px, blur(40px) saturate(220%) not blur(22px)
   saturate(140%), a layered radial-sheen + 3-stop gradient not a flat var(--glass), plus
   a border-top and three inset shadows. And .dock-hit is not the bar at all: in XOS it is
   an absolutely-positioned gesture layer INSIDE the glass, which is why the glass carries
   pointer-events:none and the hit layer takes them back.

   RE-SCOPED DELIBERATELY: every XOS rule is under `.os.os-fullscreen`, which does not
   exist in this document. Copying the selectors verbatim would have produced dead CSS
   that looks correct in the file — so the scope is dropped, nothing else is.

   z-index stays this document's 2147483000 (not XOS's 6): the panes here establish their
   own stacking and 6 would bury the glass. Geometry is canonical; layering is local. */
.dock.dock-swipe{
  position:fixed;left:0;right:0;bottom:0;z-index:2147483000;
  min-height:calc(var(--dock-h) + var(--sab));
  padding:0 0 var(--sab);
  display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;
  overflow:hidden;border-radius:12px;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(to bottom,
      rgba(20,28,24,0.42) 0%,
      rgba(18,26,22,0.44) 50%,
      rgba(16,24,20,0.46) 100%);
  backdrop-filter:blur(40px) saturate(220%) brightness(1.05);
  -webkit-backdrop-filter:blur(40px) saturate(220%) brightness(1.05);
  border-top:1px solid rgba(255,255,255,0.14);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.18),
    inset 0 -1px 0 rgba(0,0,0,0.4),
    0 -8px 24px rgba(0,0,0,0.45);
  transition:backdrop-filter .18s ease, background .18s ease;
  pointer-events:none;
}
/* press feedback — "glass densifies under finger". Deliberate in XOS, kept verbatim. */
.dock.dock-swipe:active{
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(to bottom, rgba(20,28,24,0.55) 0%, rgba(10,14,12,0.75) 50%, rgba(6,10,8,0.88) 100%);
  backdrop-filter:blur(48px) saturate(240%) brightness(1.1);
  -webkit-backdrop-filter:blur(48px) saturate(240%) brightness(1.1);
}
.dock.dock-swipe:hover{
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(to bottom, rgba(22,30,26,0.48) 0%, rgba(12,16,14,0.68) 50%, rgba(8,12,10,0.82) 100%);
}
/* display:none in XOS — the handle is deliberately not drawn. The green pill this file
   used to draw with .dock-hit::after was a local invention and is gone with it. */
.dock.dock-swipe .dock-handle{display:none}
.dock.dock-swipe .dock-sheen{
  position:absolute;top:0;left:8%;right:8%;height:1px;pointer-events:none;
  background:linear-gradient(to right,
    rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
}
.dock.dock-swipe .dock-edge-light{
  position:absolute;top:4px;bottom:4px;left:0;right:0;pointer-events:none;
  background:linear-gradient(to right,
    rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 8%,
    rgba(255,255,255,0) 92%, rgba(255,255,255,0.06) 100%);
}
/* --dock-notif-h reserves the ticker strip BELOW the wave. It is a variable so the two
   can never drift into the overlap that produced the stacked-wave bug. */
.dock.dock-swipe .dock-vei-host{
  position:relative;z-index:2;pointer-events:auto;flex:0 0 auto;width:100%;
  --dock-notif-h:22px;margin-bottom:var(--dock-notif-h);
}
.dock.dock-swipe .dock-vei-host #waveform-canvas{
  display:block;width:100%;height:37px;pointer-events:none;background:transparent;border:0;
}
/* the gesture layer. touch-action:none so the OS cannot steal a horizontal drag before
   the handler classifies its axis. */
.dock.dock-swipe .dock-hit{
  position:absolute;inset:0;width:auto;height:auto;transform:none;
  pointer-events:auto;cursor:grab;background:transparent;
  touch-action:none;-webkit-tap-highlight-color:transparent;
}
.dock.dock-swipe .dock-hit:focus-visible{
  outline:2px solid rgba(0,255,127,.5);outline-offset:-4px;border-radius:12px;
}

.drawer{position:fixed;left:0;right:0;bottom:var(--xos-dock-real, calc(var(--dock-h) + var(--sab)));
  z-index:2147483001;background:var(--glass);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  border-top:1px solid var(--line);padding:10px 12px 14px;
  display:flex;flex-direction:column;gap:8px}
.drawer[hidden]{display:none}
.drawer-grip{width:70px;height:4px;border-radius:999px;background:rgba(0,255,127,.22);
  align-self:center;margin-bottom:2px}
.drawer-app{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  background:transparent;border:1px solid var(--line);border-radius:12px;
  color:var(--heavy);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  padding:12px 14px;text-transform:uppercase;cursor:pointer}
.drawer-app em{font-style:normal;color:var(--jade);letter-spacing:.04em;text-transform:none;
  margin-left:auto;font-size:10px}
.drawer-app.on{color:var(--ink);border-color:rgba(0,255,127,.42);
  background:rgba(0,255,127,.07);box-shadow:0 0 22px rgba(0,255,127,.14) inset}

/* ── APP DRAWER SITES (qi 2026-08-22 04:07: "I want to put in the sites and populate the
   app drawer and see them open up behind the swipe glass, etc.")
   17 categories / 321 real routes, extracted from EDITSLN.txt — no placeholders.
   ⛔ NOTHING BELOW TOUCHES .dock.dock-swipe. The drawer already rises from
   bottom:var(--xos-dock-real), i.e. from behind the glass — that geometry is unchanged. */
.drawer-scroll{max-height:min(62vh,520px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.drawer-sep{display:flex;align-items:center;gap:8px;margin:8px 2px 2px;

.drawer-sep:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.07)}
.cat-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;

.site-back{display:flex;align-items:center;gap:8px;background:transparent;

.site-card{display:flex;align-items:center;gap:9px;text-decoration:none;

.site-card .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);

.phead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 14px 10px;

/* ══ THE DIALPAD ══ styling for qi's canonical markup, verbatim classes.

   ⚠️ CLASS COLLISION, HANDLED HERE AND NOWHERE ELSE: his dialpad's outer wrapper is
   class="pane", and this file already defines .pane{width:100vw;height:100vh} for the
   300vw carousel. Nested inside #m-right that would hand the dialpad a full-viewport
   box and tear the layout apart. So the FIRST rule below re-scopes only the nested
   one. His markup is untouched and .pane's canon geometry is untouched — the fix
   lives entirely in specificity. */
#m-right .pane{width:auto;height:auto;overflow:visible;display:block;position:static}

#m-right .kicker-bar{display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;padding:12px 14px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em}
#m-right .kicker{color:var(--heavy);text-transform:uppercase}
#m-right .badge{font-size:9.5px;letter-spacing:.1em;color:var(--heavy);
  border:1px solid var(--line);border-radius:999px;padding:2px 8px}
#m-right .muted{color:var(--heavy)}

.phone{display:flex;flex-direction:column;min-height:0}
.phone-tabs{display:flex;gap:6px;padding:0 12px 10px}
.phone-tabs button{flex:1;background:transparent;border:1px solid var(--line);
  border-radius:999px;color:var(--heavy);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;padding:9px 6px;text-transform:uppercase;cursor:pointer}
.phone-tabs button.active{color:var(--ink);border-color:rgba(0,255,127,.42);
  background:rgba(0,255,127,.07);box-shadow:0 0 22px rgba(0,255,127,.14) inset}

.phone-body{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}
.dial-area{text-align:center}
.dial-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--heavy)}
.dial-display{font-family:var(--mono);font-size:26px;letter-spacing:.14em;
  color:var(--ink);min-height:34px;margin:4px 0 2px}
.dial-display .placeholder{color:var(--heavy)}
.dial-match{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--heavy)}

.ascii-pad{display:flex;flex-direction:column;gap:9px}
.pad-row{display:flex;gap:9px}
.ascii-key{flex:1;aspect-ratio:1/1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:50%;
  color:var(--ink);font-family:var(--mono);cursor:pointer}
.ascii-key:active{background:rgba(0,255,127,.12);border-color:rgba(0,255,127,.42)}
.ak-num{font-size:24px;line-height:1}
.ak-chars{font-size:8.5px;letter-spacing:.16em;color:var(--heavy)}

.call-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:4px}
.ca-btn{display:flex;align-items:center;justify-content:center;gap:7px;
  width:52px;height:52px;border-radius:50%;background:transparent;
  border:1px solid var(--line);color:var(--heavy);cursor:pointer}
.ca-btn.call{flex:1;width:auto;border-radius:999px;border:0;
  background:linear-gradient(180deg,#00FF7F,#00C765);color:#04120A;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase}
.ca-btn.call[aria-disabled="true"]{opacity:.4}

/* ══ CENTER COMPOSER ══ the write leg's face.            (added 2026-08-20)
   GEOMETRY IS SAFE BY CONSTRUCTION, NOT BY CARE: .pane is already
   flex-direction:column with .phead flex:0 0 auto and .mount flex:1;min-height:0.
   A third child at flex:0 0 auto simply makes .mount shorter. Nothing here reads
   or writes .panes{width:300vw} or .pane{width:100vw}, so the one-pane-at-a-time
   swipeglass carousel cannot be disturbed by this block — that geometry is
   untouchable canon and a previous attempt of mine to "fix" it was a real defect.
   Nothing here touches .dock.dock-swipe either; the drawer IS the product. */
.composer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--glass);
  /* BOTTOM PADDING IS THE FIX FOR A MEASURED DEFECT, not spacing taste: the dock
     is fixed at bottom:0 with z-index 2147483000, so without clearance the SAVE
     button lands underneath it and elementFromPoint returns "glass" instead of
     the button — visible, focusable, and impossible to click. Clearance equals the
     dock strip + the safe-area inset, so it tracks the dock instead of guessing.
     The dock is NOT restyled to make room; my element yields to his. */
  padding:10px 12px calc(12px + var(--xos-dock-real, calc(var(--dock-h) + var(--sab))));
  display:flex;flex-direction:column;gap:8px}
.composer .crow{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-width:0;resize:none;height:38px;max-height:112px;
  background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);font-family:var(--mono);font-size:12.5px;line-height:1.45;
  padding:9px 11px;outline:none}
.composer textarea:focus{border-color:rgba(0,255,127,.42)}
.composer textarea::placeholder{color:var(--heavy)}
.composer .send{flex:0 0 auto;height:38px;padding:0 16px;border:0;border-radius:999px;
  background:linear-gradient(180deg,#00FF7F,#00C765);color:#04120A;font-family:var(--mono);
  font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.composer .send:disabled{opacity:.42;cursor:default}
.composer .cstat{font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  color:var(--heavy);min-height:12px}
.composer .cstat.ok{color:var(--resolve)}
.composer .cstat.pending{color:var(--restless)}
.composer .cstat.bad{color:#FF6B6B}
.phead .rail{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--heavy)}
.dot.live{background:var(--jade);box-shadow:0 0 10px var(--jade)}
.dot.err{background:#F87171}
.loading{padding:22px 16px;font-family:var(--mono);font-size:12px;color:var(--heavy)}
.fail{padding:22px 16px;font-family:var(--mono);font-size:12px;color:var(--restless);line-height:1.7}
.fail a{color:var(--jade)}
.notgv{margin:10px 14px;padding:10px 12px;border:1px solid rgba(245,158,11,.4);border-radius:10px;
  font-family:var(--mono);font-size:11px;color:var(--restless);line-height:1.6}
</style>

<body>

<div class="panes" id="panes">
  <!-- qi 2026-08-20 21:44, verbatim: remove all three .phead bars and the whole GV
       chrome (#gv-live, #gp-keypad, #gv-foot). The panes are now pure mounted
       surfaces — no label strip, no status rail, no dial pad. Every id those blocks
       carried is on RETIRED_IDS so the 42 live references absorb harmlessly; one of
       them (#gv-stat) was the source of the "Cannot set properties of null" error
       he could see on screen. -->
  <section class="pane" id="pane-left">
    <div class="mount" id="m-left"><div class="loading">mounting /xos3/ …</div></div>
  </section>

  <section class="pane" id="pane-center">
    <div class="mount" id="m-center"><div class="loading">mounting /lifenote/ …</div></div>
    <!-- The composer is a SIBLING of .mount, never inside it: the mounted limb's
         own DOM is replaced on every remount, so anything living in there would
         vanish. flex:0 0 auto keeps it pinned under the feed. -->
    <div class="composer" id="composer">
      <div class="crow">
        <textarea id="cnote" rows="1" maxlength="3800"
          placeholder="note to the record… ⌘⏎ to save"></textarea>
        <button class="send" id="csend">SAVE</button>
      </div>
      <div class="cstat" id="cstat"></div>
    </div>
  </section>

  <!-- ══ THE DIALPAD ══ qi 2026-08-20 21:46: "THIS IS THE DIALPAD", pasted verbatim.
       This is the canonical component — I had been carrying an invented keypad
       (#gv-keys/#gv-callbig/#gv-dialtxt), which is exactly what he told me to
       remove one message earlier. His markup is reproduced EXACTLY: same classes,
       same nesting, same SVGs, same tab order (Dialpad first, active).
       Behaviour is attached by CLASS from JS below — no ids added, no attributes
       injected, no shape changed, because the shape is his. -->

   #gv-foot). That orphans 42 references across 17 ids — and one of them was
   ALREADY biting him: the visible "ggv unreachable: Cannot set properties of null

   `if(drawer)`, `if(t)` — and an always-truthy stub silently inverts them. So the
   inert node is returned ONLY for ids on this explicit retired list. Live elements
   behave exactly as before; retired ones absorb writes and no-op.
   Reads stay type-correct so nothing downstream sees undefined. */
var RETIRED_IDS = {
  "d-left":1,"s-left":1,"d-center":1,"s-center":1,"d-right":1,"s-right":1,
  "gv-live":1,"gv-title":1,"gv-ctl":1,
  "gp-keypad":1,"gv-dialout":1,"gv-dialtxt":1,"gv-hint":1,"gv-keys":1,
  "gv-callrow":1,"gv-callbig":1,"gv-del":1,"gv-contacts-btn":1,

function inertNode(){
  return { textContent:"", innerHTML:"", value:"", disabled:false, hidden:true,
           className:"", style:{}, dataset:{},

                       contains:function(){return false;} },
           setAttribute:function(){}, getAttribute:function(){return null;},
           removeAttribute:function(){}, addEventListener:function(){},

var hit=document.querySelector(".dock-hit"), drawer=$("drawer");

/* PUBLISH THE GLASS'S MEASURED HEIGHT — ported from xos-capacitor/www/app.jsx:1606-1641.
   --xos-dock-real is what .drawer and .composer read for their bottom offsets, so nothing
   downstream hardcodes a dock height again. The CSS fallback calc() covers the frames
   before the first measure.

   NO FEEDBACK LOOP BY CONSTRUCTION: --xos-dock-real is consumed by .drawer and .composer,
   neither of which is inside .dock.dock-swipe, so writing it can never change the observed
   element's own height. The prev-value guard also stops a same-value write from scheduling
   another layout. */
(function(){
  var dock = document.querySelector(".dock.dock-swipe");
  if (!dock || typeof ResizeObserver === "undefined") return;
  function publish(){
    var h = Math.round(dock.getBoundingClientRect().height);
    if (!h) return;                       // 0 during a hidden/pre-layout frame — ignore
    var next = h + "px";
    if (document.documentElement.style.getPropertyValue("--xos-dock-real") === next) return;
    document.documentElement.style.setProperty("--xos-dock-real", next);
  }
  new ResizeObserver(publish).observe(dock);
  publish();
})();

function setDrawer(open){

  // role is a lie to a screen reader.

function status(side,state,text){
  var d=$("d-"+side),s=$("s-"+side);

  if(s)s.textContent=text;

/* ── URL rebasing: bare-relative → the limb's own directory ────────────── */
function rebase(u, base){
  if(u==null) return u;
  var s=String(u);
  if(/^(https?:|data:|blob:|about:|javascript:|mailto:|#|\/\/)/i.test(s)) return s;
  if(s.charAt(0)==="/") return s;                  // already root-absolute: fine
  try { return new URL(s, location.origin+base).pathname
              + new URL(s, location.origin+base).search; } catch(e){ return s; }
}

/* ── CSS scoping: rewrite each rule to live under this pane only ────────── */
function scopeCss(css, scope, base){
  css=css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g,function(m,q,u){
    return "url("+q+rebase(u,base)+q+")";
  });
  // position:fixed would escape the pane; .mount is a containing block so make it absolute
  css=css.replace(/position\s*:\s*fixed/gi,"position:absolute");
  // 100vh inside a pane is the pane, not the viewport
  css=css.replace(/(\d+)vh/g,function(m,n){ return n==="100" ? "100%" : m; });
  var out=[], depth=0, buf="";
  // walk top-level rules; only rewrite selectors at depth 0 (leave @media innards to recursion)
  function scopeSelectors(sel){
    return sel.split(",").map(function(s){
      s=s.trim();
      if(!s) return s;
      if(/^(from|to|\d+%)$/.test(s)) return s;                 // keyframe stops
      if(/^(html|body|:root)\b/i.test(s)){
        return scope + s.replace(/^(html|body|:root)/i,"");
      }
      return scope+" "+s;
    }).join(",");
  }
  var i=0, n=css.length, sel="";
  while(i<n){
    var ch=css[i];
    if(ch==="{"){
      depth++;
      if(depth===1){
        var s=sel.trim(); sel="";
        if(s.charAt(0)==="@"){
          if(/^@(media|supports|layer)/i.test(s)){ out.push(s+"{"); buf=""; }
          else { out.push(s+"{"); buf=""; }        // @keyframes / @font-face pass through
          i++; continue;
        }
        out.push(scopeSelectors(s)+"{"); i++; continue;
      }
      out.push("{"); i++; continue;
    }
    if(ch==="}"){ depth--; out.push("}"); i++; continue; }
    if(depth===0) sel+=ch; else out.push(ch);
    i++;
  }
  var scoped=out.join("");
  // second pass: selectors nested inside @media were emitted raw — scope them
  scoped=scoped.replace(/@(media|supports|layer)([^{]*)\{([\s\S]*?)\}\s*(?=@|$)/g,
    function(m,kw,cond,body){
      var inner=body.replace(/([^{}]+)\{/g,function(mm,s){ return scopeSelectors(s)+"{"; });
      return "@"+kw+cond+"{"+inner+"}";
    });
  return scoped;
}

/* ── PERMANENT URL REBASING ────────────────────────────────────────────────────
   MEASURED 2026-08-20 in the live console: 13 identical errors, one every ~20s —
     404 https://life.xlrd.org/life-app/lifenote.json
   The previous shim restored the real fetch after 4000ms, with the comment "long
   enough for the limb's own boot fetches to fire." That assumption is the bug.
   LifeNote does not fetch once at boot; it POLLS lifenote.json every 20 seconds
   for the life of the page. So the shim was right for four seconds and wrong for
   every poll after — the pane rendered, then went stale and showed FEED 404 while
   the mount itself reported "live". A longer timeout only moves the cliff.
   SHAPE: separate LEARNING from REBASING. While a limb boots, LIMB_ACTIVE names
   its base and every bare-relative path it requests is remembered against that
   base. From then on the shim keeps rewriting those SAME paths forever, so an
   interval poll resolves exactly like its first fetch did. Panes still cannot
   cross-talk: each learned path stays bound to the base that asked for it, and a
   path is only ever learned while its own limb is the active one.
   Absolute, root-relative and protocol URLs are passed through untouched, which is
   why /xos3 (it targets https://omni.xlrd.org) needs none of this.            */
var LIMB_ACTIVE = null;      /* base of the limb currently booting, else null */
var LIMB_LEARNED = {};       /* bare path -> the base that owns it            */
(function installPermanentRebase(){
  var of=window.fetch, oes=window.EventSource, oxhr=XMLHttpRequest.prototype.open;
  function resolve(u){
    if(typeof u!=="string" || !u) return u;
    if(/^(https?:|data:|blob:|about:|javascript:|mailto:|#|\/\/)/i.test(u)) return u;
    if(u.charAt(0)==="/") return u;
    var key=u.split("?")[0];
    var b=LIMB_ACTIVE || LIMB_LEARNED[key];
    if(!b) return u;
    LIMB_LEARNED[key]=b;
    return rebase(u,b);
  }
  window.fetch=function(u,o){ return of.call(window, resolve(u), o); };
  if(oes) window.EventSource=function(u,o){ return new oes(resolve(u),o); };
  XMLHttpRequest.prototype.open=function(m,u){ arguments[1]=resolve(u); return oxhr.apply(this,arguments); };
})();

/* ── mount one limb ───────────────────────────────────────────────────── */
function mount(side, base){
  var host=$("m-"+side), scope="#m-"+side;
  status(side,"","fetching");
  fetch(base,{credentials:"same-origin",cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(html){
      var doc=new DOMParser().parseFromString(html,"text/html");

      /* styles: scope + rebase, then attach */
      doc.querySelectorAll("style").forEach(function(st){
        var el=document.createElement("style");
        el.setAttribute("data-limb",side);
        el.textContent=scopeCss(st.textContent||"", scope, base);
        document.head.appendChild(el);
      });
      doc.querySelectorAll('link[rel="stylesheet"]').forEach(function(lk){
        var href=rebase(lk.getAttribute("href"), base);
        fetch(href,{cache:"no-store"}).then(function(r){return r.ok?r.text():"";})
          .then(function(css){
            if(!css) return;
            var el=document.createElement("style");
            el.setAttribute("data-limb",side);
            el.textContent=scopeCss(css, scope, base);
            document.head.appendChild(el);
          }).catch(function(){});
      });

      /* markup: rebase every asset attribute */
      ["src","href","poster","data-src"].forEach(function(a){
        doc.body.querySelectorAll("["+a+"]").forEach(function(el){
          el.setAttribute(a, rebase(el.getAttribute(a), base));
        });
      });

      host.innerHTML="";
      var kids=doc.body.childNodes;
      while(kids.length) host.appendChild(kids[0]);

      /* Open the LEARNING window for this limb. The permanent shim (installed once,
         far below) rebases while LIMB_ACTIVE is set and REMEMBERS each bare path it
         saw, so later polls keep resolving correctly. See the shim for why the old
         4-second restore was structurally wrong.                                */
      LIMB_ACTIVE = base;

      var scripts=host.querySelectorAll("script");
      for(var i=0;i<scripts.length;i++){
        var o=scripts[i], nx=document.createElement("script");
        for(var a=0;a<o.attributes.length;a++) nx.setAttribute(o.attributes[a].name,o.attributes[a].value);
        if(o.src) nx.src=rebase(o.getAttribute("src"), base);
        else nx.textContent=o.textContent;
        o.parentNode.replaceChild(nx,o);
      }

      /* Close the LEARNING window only. The rebasing itself is permanent for the
         paths learned here, which is the whole point of the fix.                */
      setTimeout(function(){ if(LIMB_ACTIVE===base) LIMB_ACTIVE=null; }, 4000);

      status(side,"live",base);
    })
    .catch(function(err){
      status(side,"err","failed");
      host.innerHTML='<div class="fail">could not mount <b>'+base+'</b><br>'+String(err.message)+
        '<br><br>open directly: <a href="'+base+'">'+base+'</a></div>';
    });
}

function gvEsc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function gvAgo(ts){ if(!ts) return "";
  var d=Math.floor((Date.now()-ts)/1000);
  if(d<60) return d+"s"; if(d<3600) return Math.floor(d/60)+"m";
  if(d<86400) return Math.floor(d/3600)+"h"; return Math.floor(d/86400)+"d"; }
function gvInit(n){ var t=String(n||"").trim();
  if(/^\+?[\d\s()\-]+$/.test(t)) return "#";
  var p=t.split(/\s+/).filter(Boolean);
  return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function gvIsNum(v){ return /^\+?[\d\s()\-]{7,}$/.test(String(v||"").trim()); }

/* Every control goes through gv-mcp's own tools. No auth header: qi's explicit
   decision, stated four times — "if anybody can do that, that means it works."
   gv-mcp records each call to an M4 audit log with the number redacted to last-4. */
function gvTool(name, args){
  return fetch(GGV+"/mcp",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({jsonrpc:"2.0",id:Date.now(),method:"tools/call",
                         params:{name:name,arguments:args||{}}})
  }).then(function(r){ return r.json(); }).then(function(d){
    // MCP returns HTTP 200 even when the TOOL failed — the verdict lives in
    // result.isError and the payload text, never in the status line. Reading the
    // 200 as success is how a UI ends up announcing "dial sent" on a rejection.
    if (d && d.error) throw new Error(d.error.message || "rpc error");
    var res = d && d.result, txt = "";
    try { txt = (res.content || [])[0].text || ""; } catch(_) {}
    var inner = null;
    try { inner = JSON.parse(txt); } catch(_) {}
    if ((res && res.isError) || (inner && inner.ok === false)) {
      throw new Error((inner && (inner.detail || inner.error || inner.blocker)) || txt || "tool reported failure");
    }
    return inner || res;
  });
}
function gvDial(num){
  var st=$("gv-stat"); st.textContent="dialing "+num; st.className="";
  gvTool("gv_dial",{number:num})
    .then(function(){ st.textContent="dial accepted · watching state"; gvPoll(); })
    .catch(function(e){ st.textContent="dial failed: "+(e.message||e); st.className="bad"; });
}
function gvHangup(){ gvTool("gv_hangup").then(gvPoll).catch(function(){}); }

function gvDialable(r){
  // A dialable target must be an actual number. MEASURED on the live payload:
  // omni's 6 gvoice rows carry NO `number` field and only 2 titles are numeric,
  // so 4 of them are names with no phone number anywhere in the data. Offering a
  // call button there would dial a name. Nothing is invented to fill the gap.
  var cand = r.number || r.title || "";
  var digits = String(cand).replace(/\D/g, "");
  return (gvIsNum(cand) && digits.length >= 10) ? cand : null;
}
function gvRowHTML(r){
  var who=r.title||r.number||"unknown";
  var dial=gvDialable(r);
  return '<div class="gvrow"><div class="gvav">'+gvEsc(gvInit(who))+'</div>'
    +'<div class="gvmeta"><div class="gvwho">'+gvEsc(who)+'</div>'
    +'<div class="gvprev">'+gvEsc(r.preview||"")+'</div></div>'
    +'<div class="gvwhen">'+gvEsc(gvAgo(r.lastTs))+'</div>'
    +(dial
       ? '<div class="gvcall" data-dial="'+gvEsc(dial)+'" title="call '+gvEsc(dial)+'">&#9742;</div>'
       : '<div class="gvnonum" title="no phone number in this thread - omni carries no number field for it">&#8212;</div>')
    +'</div>';
}
function gvEmpty(el,head,why){
  el.innerHTML='<div class="gvempty"><b>'+gvEsc(head)+'</b>'+gvEsc(why)+'</div>';
}

/* Contacts and recents are REAL gvoice threads out of omni. If omni answers with
   zero gvoice rows we say so — nothing is invented to fill the pane. */
function gvRooms(){
  fetch(OMNI+"/api/rooms",{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      var all=Array.isArray(d.rooms)?d.rooms:[];
      var gv=all.filter(function(r){
        return ["gvoice","googlevoice","gv"].indexOf(String(r.network||"").toLowerCase())>=0;
      }).sort(function(a,b){ return (b.lastTs||0)-(a.lastTs||0); });
      if(!gv.length){
        gvEmpty($("gp-recents"),"NO GOOGLE VOICE THREADS","Omni answered and reported zero gvoice rows.");
        gvEmpty($("gp-contacts"),"NO CONTACTS","Contacts come only from real gvoice threads.");
        return;
      }
      $("gp-recents").innerHTML=gv.map(gvRowHTML).join("");
      var seen={},people=[],nums=[];
      gv.forEach(function(r){ var w=r.title||r.number; if(!w||seen[w])return; seen[w]=1;
        (gvIsNum(w)?nums:people).push(r); });
      $("gp-contacts").innerHTML=people.concat(nums).map(gvRowHTML).join("");
    })
    .catch(function(e){
      gvEmpty($("gp-recents"),"OMNI UNREACHABLE","The gvoice threads live in omni: "+(e.message||e));
      gvEmpty($("gp-contacts"),"OMNI UNREACHABLE","Contacts come from omni.");
    });
}

var gvLastAt=0;
function gvPoll(){
  fetch(GGV+"/state",{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      gvLastAt=Date.now();
      var live=$("gv-live"), st=$("gv-stat");
      if(d.ok===false && d.blocker){
        // The service tells the truth about its own blocker; surface it verbatim.
        $("gv-title").textContent=d.blocker;
        status("right","","blocked"); st.textContent=d.blocker; st.className="bad";
        return;
      }
      var s=d.state||{};
      $("gv-title").textContent = s.inCall
        ? ("IN CALL · "+(s.callerName||s.callerNumber||"unknown")+(s.duration?(" · "+s.duration):""))
        : (s.title||"idle");
      live.className = s.inCall ? "incall" : "";
      // State-appropriate controls, driven by what gv_state says GV's own DOM
      // actually exposes. canAnswer/canHangup are false when no call is up — the
      // controls appear because the real controls exist, not because we guessed.
      var ctl=$("gv-ctl");
      var bits="";
      if(s.canAnswer) bits+='<div class="gvcall" data-act="answer" title="answer">&#9742;</div>';
      if(s.canHangup) bits+='<div class="gvcall hangup" data-act="hangup" title="hang up">&#9743;</div>';
      if(s.canHangup) bits+='<div class="gvcall" data-act="mute" title="mute">&#9836;</div>';
      ctl.innerHTML=bits;
      ctl.style.display = bits ? "flex" : "none";
      status("right","live","ggv live");
      st.textContent = s.inCall ? "in call" : "live · ggv"; st.className="";
    })
    .catch(function(e){
      status("right","err","ggv down");
      var st=$("gv-stat"); st.textContent="ggv unreachable: "+(e.message||e); st.className="bad";
    });
}

function mountGV(){
  gvStyles();
  /* keypad */
  var K=[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],
         ["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]];
  var dialed="";
  function sync(){ var t=$("gv-dialtxt");
    if(dialed){ t.textContent=dialed; t.className=""; }
    else { t.innerHTML="&#8212; &#8212; &#8212; &#8212; &#8212; &#8212;"; t.className="ph"; }
    $("gv-callbig").disabled = dialed.length<3; }
  $("gv-keys").innerHTML=K.map(function(k){
    return '<div class="gvk" data-k="'+k[0]+'">'+k[0]+(k[1]?'<small>'+k[1]+'</small>':'')+'</div>'; }).join("");
  $("gv-keys").addEventListener("click",function(e){
    var k=e.target.closest(".gvk"); if(!k) return; dialed+=k.getAttribute("data-k"); sync(); });
  $("gv-del").addEventListener("click",function(){ dialed=dialed.slice(0,-1); sync(); });
  $("gv-contacts-btn").addEventListener("click",function(){
    var t=document.querySelector('#gv-tabs .gvt[data-gp="contacts"]'); if(t) t.click();
  });
  $("gv-callbig").addEventListener("click",function(){ if(dialed) gvDial(dialed); });
  sync();

  /* tabs */
  $("gv-tabs").addEventListener("click",function(e){
    var t=e.target.closest(".gvt"); if(!t) return;
    var want=t.getAttribute("data-gp");
    Array.prototype.forEach.call(document.querySelectorAll("#gv-tabs .gvt"),function(x){
      x.classList.toggle("on", x===t); });
    Array.prototype.forEach.call(document.querySelectorAll("#m-right .gvp"),function(pp){
      pp.classList.toggle("on", pp.id==="gp-"+want); });
  });

  /* delegated call buttons — survives every re-render */
  $("m-right").addEventListener("click",function(e){
    var b=e.target.closest(".gvcall"); if(!b) return;
    var act=b.getAttribute("data-act"), st=$("gv-stat");
    function run(tool){
      st.textContent=tool.replace("gv_","")+"…"; st.className="";
      gvTool(tool)
        .then(function(){ st.textContent=tool.replace("gv_","")+" sent"; gvPoll(); })
        // Honest selector-miss feedback: gv-mcp reports which selector failed to
        // match when GV's DOM drifts. Surface that verbatim instead of "failed".
        .catch(function(err){ st.textContent=tool.replace("gv_","")+" failed: "+(err.message||err); st.className="bad"; });
    }
    if(act==="answer") return run("gv_answer");
    if(act==="hangup") return run("gv_hangup");
    if(act==="mute")   return run("gv_mute");
    var num=b.getAttribute("data-dial");
    if(num) gvDial(num);
  });

  gvPoll(); gvRooms();
  setInterval(gvPoll, 6000);      /* call state is the fast lane */
  setInterval(gvRooms, 20000);    /* threads move slower */
  setInterval(function(){ $("gv-age").textContent = gvLastAt ? ("state "+gvAgo(gvLastAt)+" old") : ""; }, 1000);

  /* live push when available; polling above is the floor, not the ceiling */
  try{
    var ws=new WebSocket("wss://ggv.xlrd.org/ws");
    ws.onmessage=function(){ gvPoll(); };
  }catch(_){}
}

/* ══ DIALPAD WIRING ══ qi's canonical markup, behaviour attached BY CLASS.
   Nothing here adds an id, an attribute, or a wrapper to his DOM — the shape is
   his, so the code adapts to it rather than the reverse. Delegated from #m-right
   so it survives a remount of the limb.

   THE CALL BUTTON PLACES A REAL CALL through the gv-mcp rail that is already
   verified live (:3457 -> ggv.xlrd.org, gvTabAttached). So it is deliberately
   inert until there are >=10 digits, and it reports the REAL failure text rather
   than a cheerful nothing — a dialer that silently no-ops is worse than one that
   says why. */
(function wireDialpad(){
  var root = document.getElementById("m-right");
  if(!root) return;

  function disp(){ return root.querySelector(".dial-display"); }
  function match(){ return root.querySelector(".dial-match"); }
  var digits = "";

  function paint(){
    var d = disp(); if(!d) return;
    d.innerHTML = digits
      ? digits.replace(/[<>&]/g,"")
      : '<span class="placeholder">_ _ _ _ _ _</span>';
    var m = match();
    if(m){
      m.textContent = digits.length >= 10
        ? "› ready to dial " + digits
        : (digits ? "› " + digits.length + " of 10 digits"
                  : "› tap a key or speak a name");
    }
    var call = root.querySelector(".ca-btn.call");
    if(call) call.setAttribute("aria-disabled", digits.replace(/\D/g,"").length >= 10 ? "false" : "true");
  }

  root.addEventListener("click", function(e){
    var key = e.target.closest && e.target.closest(".ascii-key");
    if(key){
      var n = key.querySelector(".ak-num");
      if(n){ digits += (n.textContent || "").trim(); paint(); }
      return;
    }
    var back = e.target.closest && e.target.closest('.ca-btn[aria-label="backspace"]');
    if(back){ digits = digits.slice(0, -1); paint(); return; }

    var tab = e.target.closest && e.target.closest(".phone-tabs button");
    if(tab){
      Array.prototype.forEach.call(root.querySelectorAll(".phone-tabs button"), function(b){
        b.className = (b === tab) ? "active" : "";
      });
      var want = (tab.textContent || "").trim().toLowerCase();
      var body = root.querySelector(".phone-body");
      var rec  = document.getElementById("gp-recents");
      var con  = document.getElementById("gp-contacts");
      if(body) body.hidden = (want !== "dialpad");
      if(rec)  rec.hidden  = (want !== "recents");
      if(con)  con.hidden  = (want !== "contacts");
      return;
    }

    var call = e.target.closest && e.target.closest(".ca-btn.call");
    if(call){
      e.preventDefault();                       // his markup is <a href="#">
      var num = digits.replace(/\D/g, "");
      var m = match();
      if(num.length < 10){ if(m) m.textContent = "› need 10 digits before dialing"; return; }
      if(m) m.textContent = "› dialing " + num + "…";
      // gvTool already asserts on result.isError AND inner ok===false, so a
      // failure surfaces its real reason instead of a false success.
      gvTool("gv_dial", { number: num }).then(function(){
        if(m) m.textContent = "› dialing " + num + " — accepted by the line";
      }).catch(function(err){
        if(m) m.textContent = "› NOT dialed — " + (err && err.message ? err.message : err);
      });
    }
  });

  paint();
})();

/* ══ CENTER COMPOSER WIRING ══                            (added 2026-08-20)
   POSTs to omni's /api/note, which appends `note: <text>` to qi's canonical
   capture log — the same jsonl xen-lifenote-feed reads as its FIRST source. The
   rail is a TEXT PREFIX, not a field (xen-lifenote-feed:239), and the server adds
   it, so nothing here needs to know the schema.

   THE STATUS LINE TELLS THE TRUTH AND THAT IS THE POINT: a 200 here means the
   append is on disk, NOT that the note is visible in the feed. Rendering needs
   the generator to rebuild, and the PUBLIC build additionally needs a Pages
   publish. Saying "posted" would be the lie; it says saved + when it will appear.
   MEASURED 2026-08-20: an unverified 200 from this exact route sat on a note that
   rendered ZERO times because of a timezone bug. Never trust the status code alone.
   Public path proven: preflight 204 with ACAO:* from the life.xlrd.org origin. */
(function wireComposer(){
  var ta = document.getElementById("cnote");
  var btn = document.getElementById("csend");
  var out = document.getElementById("cstat");
  if(!ta || !btn || !out) return;

  function stat(msg, cls){ out.textContent = msg; out.className = "cstat" + (cls ? " " + cls : ""); }

  function grow(){ ta.style.height = "38px"; ta.style.height = Math.min(ta.scrollHeight, 112) + "px"; }
  ta.addEventListener("input", grow);

  var sending = false;
  function save(){
    var text = (ta.value || "").trim();
    if(!text || sending) return;
    // The server caps a note at 4000 B for atomicity against the capture writer;
    // fail here with a real reason rather than letting the POST 413.
    if(text.length > 3800){ stat("too long — " + text.length + "/3800 characters", "bad"); return; }
    sending = true; btn.disabled = true; stat("saving…", "pending");
    fetch(OMNI + "/api/note", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    }).then(function(r){
      return r.text().then(function(t){
        var j = null; try { j = JSON.parse(t); } catch(e){}
        // Assert on the BODY. This server answers 200 with ok:false on a real
        // failure, so a status-only check would report success that did not happen.
        if(!r.ok || !j || j.ok !== true){
          throw new Error((j && j.error) ? j.error : ("HTTP " + r.status + " " + t.slice(0,90)));
        }
        return j;
      });
    }).then(function(j){
      ta.value = ""; grow();
      stat("saved to the record · " + j.bytes + " B · shows in the feed after the next rebuild", "ok");
    }).catch(function(e){
      stat("NOT saved — " + (e && e.message ? e.message : e), "bad");
    }).then(function(){
      sending = false; btn.disabled = false;
    });
  }

  btn.addEventListener("click", save);
  ta.addEventListener("keydown", function(e){
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); save(); }
  });
})();
})();

(function(){
  var host = document.getElementById("sites-scroll");
  if (!host) return;                       /* fail soft — never break the drawer */
  var CHEV = '<span class="chev">\u203a</span>';

  function esc(t){ var d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; }

  function showCats(){
    var h = "";
    for (var i=0;i<SITES.length;i++){
      var c = SITES[i];
      h += '<button class="cat-row" data-cat="'+i+'">'
         +  esc(c.title)
         +  '<span class="n">'+c.cards.length+'</span>'+CHEV+'</button>';
    }
    host.innerHTML = h;
    host.scrollTop = 0;
  }

  function showCards(i){
    var c = SITES[i]; if (!c) return showCats();
    var h = '<button class="site-back" data-back="1">\u2039 '+esc(c.title)
          + ' \u00b7 '+c.cards.length+'</button>';
    for (var k=0;k<c.cards.length;k++){
      var x = c.cards[k];
      h += '<a class="site-card'+(x.fresh?" fresh":"")+'" href="'+esc(x.href)+'"'
        +  ' title="'+esc(x.title)+'"><span class="dot"></span>'
        +  '<span class="t">'+esc(x.label||x.href)+'</span>'
        +  '<span class="r">'+esc(x.date)+'</span></a>';
    }
    host.innerHTML = h;
    host.scrollTop = 0;
  }

  host.addEventListener("click", function(e){
    var back = e.target.closest && e.target.closest("[data-back]");
    if (back) { showCats(); return; }
    var row = e.target.closest && e.target.closest("[data-cat]");
    if (row) { showCards(+row.getAttribute("data-cat")); }
  });

  showCats();
})();
</script>
