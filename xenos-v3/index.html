<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <title>XENOS — Auxgen Hyper-Realism</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@100;300;400&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --ink: #ffffff;
      --accent: #5effa8;
      --dim: rgba(255, 255, 255, 0.45);
      --faint: rgba(255, 255, 255, 0.12);
      --glass: rgba(10, 12, 10, 0.65);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #010101; overflow: hidden; touch-action: none; font-family: 'Inter', sans-serif; }
    canvas { display: block; position: fixed; inset: 0; outline: none; }
    
    /* Center focal ring for tactile targeting */
    #ring {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: min(85vmin, 800px); aspect-ratio: 1; border-radius: 50%;
      border: 1px solid var(--faint);
      box-shadow: 0 0 140px rgba(94, 255, 168, 0.03) inset; pointer-events: none; z-index: 2;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #ring.active { transform: translate(-50%,-50%) scale(0.95); border-color: var(--dim); box-shadow: 0 0 160px rgba(94, 255, 168, 0.08) inset; }

    /* UI Overlay Layer */
    .ui {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(20px, 4vw, 40px);
    }
    
    .header { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand h1 { font-family: 'JetBrains Mono', monospace; font-weight: 300; font-size: clamp(24px, 4vw, 36px); letter-spacing: -0.04em; color: var(--ink); line-height: 1; }
    .brand h1 span { color: var(--accent); font-weight: 100; }
    .brand p { margin-top: 8px; font-size: 11px; letter-spacing: 0.1em; color: var(--dim); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
    
    .telemetry { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.8; color: var(--faint); letter-spacing: 0.15em; }
    .telemetry span { color: var(--dim); }
    .telemetry b { color: var(--accent); font-weight: 400; }

    .footer { display: flex; justify-content: space-between; align-items: flex-end; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; max-width: 60%; pointer-events: auto; }
    
    button {
      background: var(--glass); border: 1px solid var(--faint); border-radius: 30px;
      padding: 12px 20px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400;
      color: var(--dim); cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); letter-spacing: 0.05em; text-transform: uppercase;
      outline: none; -webkit-tap-highlight-color: transparent;
    }
    button:hover, button:active { color: var(--ink); border-color: var(--accent); background: rgba(94, 255, 168, 0.1); transform: scale(0.98); }
    button.active { color: #010101; background: var(--accent); border-color: var(--accent); }

    .status-panel { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .status-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--accent); border: 1px solid rgba(94, 255, 168, 0.3); padding: 4px 10px; border-radius: 20px; background: rgba(94, 255, 168, 0.05); }

    .crosshair { position: absolute; left: 50%; top: 50%; width: 2px; height: 2px; background: var(--accent); transform: translate(-50%, -50%); border-radius: 50%; opacity: 0.5; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: var(--faint); }
    .crosshair::before { width: 40px; height: 1px; left: -19px; top: 0; }
    .crosshair::after { width: 1px; height: 40px; left: 0; top: -19px; }

    /* Node Labels */
    .lbl {
      position: absolute; transform: translate(0,-50%); font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em;
      color: var(--dim); white-space: nowrap; opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    .lbl.on { opacity: 1; }
    .lbl::before { content: ''; position: absolute; left: -16px; top: 50%; width: 12px; height: 1px; background: var(--accent); opacity: 0.5; }

    @media (max-width: 768px) {
      .controls { max-width: 100%; justify-content: center; width: 100%; }
      .footer { flex-direction: column; align-items: center; gap: 20px; }
      .status-panel { align-items: center; }
      .telemetry { display: none; }
      #ring { width: 95vmin; }
    }
  </style>
</head>
<body>

<div id="ring"></div>
<div class="crosshair"></div>

<div class="ui">
  <div class="header">
    <div class="brand">
      <h1>XENOS<span>//</span>AUX</h1>
      <p>Auxgen Protocol Active</p>
    </div>
    <div class="telemetry">
      <span>STATE:</span> <b id="form-disp">ORB</b><br>
      <span>NODES:</span> <b id="nn">—</b><br>
      <span>TENSION:</span> <b id="ee">—</b><br>
      <span>DAMPING:</span> <b>ACTIVE</b>
    </div>
  </div>
  
  <div class="footer">
    <div class="controls">
      <button data-f="0">Wheels</button>
      <button data-f="1" class="active">Core</button>
      <button data-f="2">Form</button>
      <button id="probe">Pulse</button>
    </div>
    <div class="status-panel">
      <div class="status-badge" id="mood">IDLE</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/gsap@3.13.0/dist/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene(); 
scene.fog = new THREE.FogExp2(0x010101, 0.0015);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 8000); 
camera.position.z = 600;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Procedural Environment for Physical Materials
const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

const composer = new EffectComposer(renderer); 
composer.addPass(new RenderPass(scene, camera));

// Finely tuned bloom for bioluminescence 
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.2, 0.8, 0.1);
composer.addPass(bloomPass);

const outputPass = new OutputPass();
composer.addPass(outputPass);

const S = { 
  fx: 0, fy: 0, 
  camZ: 600, 
  scale: 1, 
  spin: 0.001, 
  flare: 0, 
  energy: 0, 
  drift: 0, 
  morph: 1, 
  reach: 0, 
  rz: 0,
  velX: 0, velY: 0 // Inertial velocity
};

const ophanim = new THREE.Group(); 
scene.add(ophanim);

// Transmissive Glass Core
const coreGeometry = new THREE.IcosahedronGeometry(220, 16);
const coreMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 1.0, // glass-like
  opacity: 1.0,
  metalness: 0.1,
  roughness: 0.1,
  ior: 1.5,
  thickness: 2.5,
  specularIntensity: 1.0,
  specularColor: 0x5effa8,
  envMapIntensity: 1.0,
  side: THREE.DoubleSide,
  transparent: true
});
const glassCore = new THREE.Mesh(coreGeometry, coreMaterial);
ophanim.add(glassCore);

// Ambient data dust
let world;
{ 
  const N = 2000, p = new Float32Array(N*3), s = new Float32Array(N), ph = new Float32Array(N);
  for(let i=0; i<N; i++) { 
    const r = 1200 + Math.random()*2000, th = Math.random()*Math.PI*2, pp = Math.acos(2*Math.random()-1);
    p[i*3] = r*Math.sin(pp)*Math.cos(th); p[i*3+1] = r*Math.sin(pp)*Math.sin(th); p[i*3+2] = r*Math.cos(pp);
    s[i] = Math.random()*2.0 + 0.5; ph[i] = Math.random()*Math.PI*2; 
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('asize', new THREE.BufferAttribute(s, 1));
  g.setAttribute('aph', new THREE.BufferAttribute(ph, 1));
  world = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { t: {value:0} },
    vertexShader: `
      attribute float asize; attribute float aph; uniform float t;
      varying float vo;
      void main(){ 
        vec3 q = position;
        q.y += sin(t * 0.5 + aph) * 50.0;
        vec4 mv = modelViewMatrix * vec4(q, 1.0);
        vo = 0.1 + 0.15 * sin(t * 0.8 + aph);
        gl_PointSize = asize * (400.0 / -mv.z); 
        gl_Position = projectionMatrix * mv; 
      }`,
    fragmentShader: `
      varying float vo; 
      void main(){ 
        vec2 d = gl_PointCoord - 0.5;
        float dist = length(d);
        if(dist > 0.5) discard; 
        gl_FragColor = vec4(0.36, 1.0, 0.65, exp(-dist*dist*12.0) * vo); 
      }`
  }));
  scene.add(world); 
}

let pts, base, T0, T1, T2, N=0, labels=[];
const SHELL = 230;
const RINGS = [
  {t:[0,0,0],r:SHELL}, {t:[1.5708,0,0],r:SHELL*1.05}, {t:[0,1.5708,0],r:SHELL*0.95},
  {t:[0.5,0.5,0.2],r:SHELL*1.1}, {t:[-0.7,0.8,-0.3],r:SHELL*0.9}, {t:[1.1,0.2,0.7],r:SHELL*1.02}
];

function humanoid(i, n) {
  const u = i/n, a = Math.random()*Math.PI*2, jr = Math.random();
  let x, y, z, rad;
  if(u<0.12) { rad=45*Math.sqrt(jr); y=220+Math.sqrt(Math.max(0,1-(rad/50)**2))*40; x=Math.cos(a)*rad; z=Math.sin(a)*rad*0.8; }
  else if(u<0.18) { rad=25+jr*10; y=160+jr*20; x=Math.cos(a)*rad; z=Math.sin(a)*rad*0.8; }
  else if(u<0.35) { rad=120*(0.6+0.4*jr); y=120+jr*30; x=Math.cos(a)*rad; z=Math.sin(a)*rad*0.5; }
  else if(u<0.60) { const ty=(u-0.35)/0.25; rad=(100-40*ty)*(0.5+0.5*jr); y=120-ty*180; x=Math.cos(a)*rad; z=Math.sin(a)*rad*0.6; }
  else if(u<0.80) { const s=(u<0.7)?-1:1, ta=(u<0.7)?(u-0.6)/0.1:(u-0.7)/0.1; x=s*(110+ta*50)+(Math.random()-0.5)*20; y=110-ta*190+(Math.random()-0.5)*20; z=(Math.random()-0.5)*30; }
  else { const s=(u<0.9)?-1:1, tl=(u<0.9)?(u-0.8)/0.1:(u-0.9)/0.1; x=s*40+(Math.random()-0.5)*20; y=-60-tl*170+(Math.random()-0.5)*20; z=(Math.random()-0.5)*30; }
  return [x, y, z];
}

// Procedural topology generation
const N_NODES = 500;
const pGraph = { nodes: [], edges: [] };
for(let i=0; i<N_NODES; i++) pGraph.nodes.push({ id: `node-xx${i}`, deg: 0 });
for(let i=0; i<N_NODES*2; i++) {
  let s = Math.floor(Math.random()*N_NODES), t = Math.floor(Math.random()*N_NODES);
  if (s !== t) { pGraph.edges.push({ s: pGraph.nodes[s].id, t: pGraph.nodes[t].id, w: Math.random() }); pGraph.nodes[s].deg++; pGraph.nodes[t].deg++; }
}

Promise.resolve(pGraph).then(g => {
  N = g.nodes.length;
  T0 = new Float32Array(N*3); T1 = new Float32Array(N*3); T2 = new Float32Array(N*3);
  
  // State 0: Wheels / Ophanim
  const q = new THREE.Quaternion(), eu = new THREE.Euler();
  g.nodes.forEach((n,i) => { 
    const R = RINGS[i%RINGS.length];
    const a = Math.random()*Math.PI*2, rr = R.r + (Math.random()-0.5)*40;
    const v = new THREE.Vector3(Math.cos(a)*rr, Math.sin(a)*rr, (Math.random()-0.5)*20);
    eu.set(R.t[0], R.t[1], R.t[2]); q.setFromEuler(eu); v.applyQuaternion(q);
    T0[i*3] = v.x; T0[i*3+1] = v.y; T0[i*3+2] = v.z; 
  });

  // State 1: Orb Surface
  for(let i=0; i<N; i++) { 
    const th = Math.random()*Math.PI*2, pp = Math.acos(2*Math.random()-1);
    const r = SHELL * 1.05; // Hover slightly above glass
    T1[i*3] = r*Math.sin(pp)*Math.cos(th); T1[i*3+1] = r*Math.sin(pp)*Math.sin(th); T1[i*3+2] = r*Math.cos(pp);
  }

  // State 2: Form
  for(let i=0; i<N; i++) { 
    const h = humanoid(i,N); T2[i*3] = h[0]; T2[i*3+1] = h[1]; T2[i*3+2] = h[2]; 
  }

  base = new Float32Array(T1);
  const pos = new Float32Array(T1), col = new Float32Array(N*3), siz = new Float32Array(N);
  g.nodes.forEach((n,i) => { 
    col[i*3] = 0.3; col[i*3+1] = 1.0; col[i*3+2] = 0.6; 
    siz[i] = 4.0 + Math.random()*6.0; 
  });

  const gp = new THREE.BufferGeometry();
  gp.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  gp.setAttribute('acolor', new THREE.BufferAttribute(col, 3));
  gp.setAttribute('asize', new THREE.BufferAttribute(siz, 1));
  
  pts = new THREE.Points(gp, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { t: {value:0}, flare: {value:0} },
    vertexShader: `
      attribute vec3 acolor; attribute float asize; uniform float t; uniform float flare;
      varying vec3 vc; varying float vf;
      void main(){ 
        vc = acolor; 
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vf = 1.0 - smoothstep(100.0, 1500.0, -mv.z);
        gl_PointSize = asize * (400.0 / -mv.z) * (1.0 + flare*2.0);
        gl_Position = projectionMatrix * mv; 
      }`,
    fragmentShader: `
      varying vec3 vc; varying float vf;
      void main(){ 
        vec2 d = gl_PointCoord - 0.5; float r = length(d); if(r > 0.5) discard;
        vec3 c = mix(vc, vec3(1.0), smoothstep(0.3, 0.0, r));
        gl_FragColor = vec4(c, exp(-r*r*12.0) * vf); 
      }`
  }));
  ophanim.add(pts);

  // Update telemetry
  document.getElementById('nn').textContent = N.toLocaleString();
  document.getElementById('ee').textContent = g.edges.length.toLocaleString();

  // Create physical UI labels
  for(let i=0; i<5; i++) {
    const el = document.createElement('div'); el.className = 'lbl';
    el.textContent = `DATA.PRTCL.${Math.floor(Math.random()*9999)}`;
    document.querySelector('.ui').appendChild(el); 
    labels.push({el, i: Math.floor(Math.random()*N)}); 
  }

  // Boot sequence animation
  gsap.fromTo(S, {scale: 0.01}, {scale: 1, duration: 2.5, ease: 'expo.out'});
  gsap.fromTo(glassCore.material, {opacity: 0}, {opacity: 1, duration: 3, ease: 'power2.inOut'});
});

const moodEl = document.getElementById('mood');
const ring = document.getElementById('ring');
const setMood = m => { moodEl.textContent = m; };

let isDragging = false;
let lastTouch = { x: 0, y: 0 };

function handleInteractionStart(e) {
  isDragging = true;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  lastTouch = { x, y };
  S.velX = 0; S.velY = 0;
  setMood('TRACKING');
  ring.classList.add('active');
  if(navigator.vibrate) navigator.vibrate(10);
  gsap.to(S, {flare: 0.3, duration: 0.3});
}

function handleInteractionMove(e) {
  if(!isDragging) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  
  const dx = x - lastTouch.x;
  const dy = y - lastTouch.y;
  
  // Convert drag to velocity
  S.velX = dx * 0.005;
  S.velY = dy * 0.005;
  
  lastTouch = { x, y };
}

function handleInteractionEnd() {
  isDragging = false;
  setMood('INERTIAL');
  ring.classList.remove('active');
  gsap.to(S, {flare: 0, duration: 1.0});
  setTimeout(() => setMood('IDLE'), 2000);
}

window.addEventListener('mousedown', handleInteractionStart, {passive: true});
window.addEventListener('mousemove', handleInteractionMove, {passive: true});
window.addEventListener('mouseup', handleInteractionEnd, {passive: true});

window.addEventListener('touchstart', handleInteractionStart, {passive: true});
window.addEventListener('touchmove', handleInteractionMove, {passive: true});
window.addEventListener('touchend', handleInteractionEnd, {passive: true});

// Gyroscopic Parallax
window.addEventListener('deviceorientation', (e) => {
    if (e.beta === null || e.gamma === null) return;
    const ax = Math.min(Math.max((e.gamma || 0) / 45, -1), 1);
    const ay = Math.min(Math.max((e.beta || 0) - 45, -45) / 45, 1);
    gsap.to(S, { fx: ax * 0.5, fy: -ay * 0.5, duration: 0.5, overwrite: 'auto' });
}, {passive: true});

const FORMS = ['OPHANIM','CORE','FORM'];
const btns = document.querySelectorAll('.controls button[data-f]');

function shift(idx) {
  btns.forEach(b => b.classList.remove('active'));
  document.querySelector(`button[data-f="${idx}"]`).classList.add('active');
  
  gsap.to(S, { 
    morph: idx, 
    duration: 2.5, 
    ease: 'power3.inOut',
    onUpdate: () => { document.getElementById('form-disp').textContent = FORMS[Math.round(S.morph)] || FORMS[1]; }
  });
  
  // Core material response based on state
  if(idx === 1) {
    gsap.to(glassCore.material, {transmission: 1.0, roughness: 0.1, thickness: 2.5, duration: 2});
    gsap.to(glassCore.scale, {x: 1, y: 1, z: 1, duration: 2, ease: 'back.out(1.2)'});
  } else {
    gsap.to(glassCore.material, {transmission: 0.2, roughness: 0.6, thickness: 0.1, duration: 2});
    gsap.to(glassCore.scale, {x: 0.7, y: 0.7, z: 0.7, duration: 2, ease: 'power2.inOut'});
  }

  gsap.fromTo(S, { flare: 1.0 }, { flare: 0, duration: 1.5, ease: 'power2.out' });
  if(navigator.vibrate) navigator.vibrate([15, 30, 15]);
  setMood('MORPHING');
  setTimeout(() => setMood('IDLE'), 2500);
}

btns.forEach(b => b.onclick = () => shift(+b.dataset.f));

document.getElementById('probe').onclick = () => {
  setMood('PULSE');
  if(navigator.vibrate) navigator.vibrate(40);
  gsap.timeline()
    .to(S, {scale: 0.9, duration: 0.1, ease: 'power2.in'})
    .to(S, {scale: 1.15, duration: 0.4, ease: 'elastic.out(1, 0.4)'})
    .to(S, {scale: 1, duration: 0.8, ease: 'power2.out'});
  gsap.fromTo(S, {flare: 2.0}, {flare: 0, duration: 1.5});
  setTimeout(() => setMood('IDLE'), 1500);
};

const proj = new THREE.Vector3(); 
let t = 0;

function frame() {
  requestAnimationFrame(frame); t += 0.01;
  S.drift += 0.002;

  // Apply inertial momentum
  S.velX *= 0.95; // friction
  S.velY *= 0.95;
  
  // Continuous base spin + inertial addition
  ophanim.rotation.y += S.spin + S.velX;
  ophanim.rotation.x += S.velY;
  
  // Parallax from Gyro/Pointer
  ophanim.position.x += ((S.fx * 30) - ophanim.position.x) * 0.1;
  ophanim.position.y += ((S.fy * 30) - ophanim.position.y) * 0.1;
  ophanim.scale.setScalar(S.scale);

  camera.position.x += ((S.fx * 50) - camera.position.x) * 0.05;
  camera.position.y += ((S.fy * 50) - camera.position.y) * 0.05;
  camera.lookAt(0,0,0);

  // Morph Topology
  if(pts && base && T0) {
    const m = S.morph, A = (m<1) ? T0 : T1, B = (m<1) ? T1 : T2, k = (m<1) ? m : m-1;
    const p = pts.geometry.attributes.position.array;
    for(let i=0; i<N*3; i++) {
      base[i] = A[i] + (B[i] - A[i]) * k;
      // Add subtle breathing to active positions
      p[i] = base[i] + Math.sin(t * 2.0 + i) * 2.0; 
    }
    pts.geometry.attributes.position.needsUpdate = true;
    pts.material.uniforms.t.value = t;
    pts.material.uniforms.flare.value = S.flare;
  }

  if(world) world.material.uniforms.t.value = t;
  
  // Rotate glass core slowly in opposition
  glassCore.rotation.y = -t * 0.5;
  glassCore.rotation.x = t * 0.3;

  // Update DOM labels via 3D projection
  for(const L of labels) { 
    if(L.i == null || !pts) continue;
    const a = pts.geometry.attributes.position.array;
    proj.set(a[L.i*3], a[L.i*3+1], a[L.i*3+2]).applyMatrix4(ophanim.matrixWorld).project(camera);
    if(proj.z < 1 && proj.x > -0.9 && proj.x < 0.9 && proj.y > -0.9 && proj.y < 0.9) { 
      L.el.style.left = ((proj.x*0.5+0.5)*innerWidth) + 'px';
      L.el.style.top = ((-proj.y*0.5+0.5)*innerHeight) + 'px'; 
      L.el.classList.add('on'); 
    } else L.el.classList.remove('on'); 
  }

  composer.render();
}

frame();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
